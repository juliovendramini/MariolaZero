com as cores de verdade e os 4 botões, que você aperta com o mouse.\nAssim dá para testar no simulador o menu e a calibração que o robô vai usar no campo.\n\n## 11.4 Ver o que o programa \"pensa\": `simdebug`\n\n```python\ntry:\n    import simdebug          # no robô, copie robo_real/simdebug.py (não faz nada)\nexcept ImportError:\n    simdebug = None\n\nif simdebug:\n    simdebug.texto('estado: GAP')                 # aparece no painel\n    simdebug.pose(x_mm, y_mm, theta)              # contorno roxo onde você acha que está\n    simdebug.marca(x_mm, y_mm, 'verde')           # um ponto no mapa\n```\n\nMostrar o **estado** do programa (`seguindo`, `verde à esquerda`, `gap`, `obstáculo`...) é a forma\nmais rápida de achar o porquê de um erro.\n\n## 11.5 O juiz (regra 2026)\n\nO simulador pontua como o árbitro:\n\n* **Perigos** (uma vez por sentido em que o caminho passa): interseção/beco 10, gap 10, obstáculo\n  20, lombada 10, rampa 10, gangorra 20.\n* **Checkpoint:** ladrilhos desde o anterior × 5 / 3 / 1 / 0 (1ª a 4ª tentativa).\n* **Chegada:** parado mais de 5 s na fita vermelha; bônus de saída 60 − 5 × LoP.\n* **LoP automático:** robô sai do campo/cai, pega uma linha que não é a próxima do caminho, fica\n  10 s fora do caminho. Depois de 3 tentativas, vai para o próximo checkpoint.\n* **Área de resgate:** vivas no verde e a morta no vermelho (só depois das duas vivas), ×1,4 cada,\n  perdendo 0,05 por LoP no trecho, nunca abaixo de 1,25.\n\nNo fim, o placar item por item:\n```\n0:46.48   +35  checkpoint: 7 ladrilhos x 5 (1ª tentativa)\n0:54.90    +5  chegada: 1 ladrilhos x 5 (1ª tentativa)\n0:54.90   +60  bônus de saída (60 - 5 x 0 LoP)\n          TOTAL: 130   {'LoP': 0, 'passo': '14/14'}\n```\n\nO modo **LoP: reinicia prog.** desliga e liga o programa num LoP, como desligar o robô. Isso testa\nse o seu programa **retoma** certo (checkpoint em arquivo, relógio da rodada).\n\n## 11.6 Repetir e comparar: semente e relógio sincronizado\n\n* **Semente:** com `--semente N` (padrão 1), o ruído dos sensores e o sorteio das vítimas são\n  sempre os mesmos. A rodada sai **igual, bit a bit**. Mudou o programa e piorou? Foi o programa,\n  não a sorte.\n* **Relógio sincronizado:** o tempo do programa só anda quando ele **espera** (`sleep`, serial). O\n  tempo que o PC gasta calculando não conta, então o resultado não depende da velocidade nem do\n  computador. **Consequência:** um laço sem nenhum `sleep` \"congela\" o tempo. Ponha\n  `time.sleep(0.01)` no laço principal (no robô ele também ajuda).\n\n### Testando várias rodadas de uma vez\n\nUm programa bom completa a pista com **várias** sementes, não com uma. No terminal (Linux/macOS,\nou Git Bash no Windows):\n```bash\nfor s in 1 2 3 4 5 6; do\n  python simulador.py --programa ../meuSeguidor/main.py --mapa mapas/completo.json \\\n         --sem-janela --velocidade 4 --semente $s | grep TOTAL\ndone\n```\nNo PowerShell:\n```powershell\nforeach ($s in 1..6) { python simulador.py --programa ..\\meuSeguidor\\main.py --sem-janela --velocidade 4 --semente $s | Select-String TOTAL }\n```\n\n## 11.7 O editor de mapas\n\n`python simulador.py --editor` (ou o botão **Editar mapa**). Usa os **82 ladrilhos oficiais**\n(os do sistema do rcj.cloud), com caminhos, gaps e interseções.\n\n| Ferramenta | Uso |\n|---|---|\n| **Ladrilho** | escolha na paleta e clique; clicar de novo gira; R/roda giram o da paleta; botão direito apaga |\n| **Girar** | clique gira 90° |\n| **Início** | marca o ladrilho de início (clique de novo troca a direção) |\n| **Checkpoint** | marca/desmarca |\n| **Rampa** | sem → N → L → S → O; botão direito muda a inclinação (10°–25°) |\n| **Lombada**, **Obstáculo**, **Detritos** | colocam os perigos |\n| **Camada ±** | ladrilho de ponte (camada 1 sobre a 0) |\n| **Área resgate**, **Entrada/saída**, **Triângulos** | montam a área de resgate |\n\nO editor calcula o **caminho esperado** (o mesmo algoritmo do sistema oficial), numera os passos e\navisa os problemas (caminho que não chega na chegada, checkpoint em ladrilho com item...). O\n**Abrir** também lê mapas exportados do rcj.cloud.\n\n**Dica de treino:** monte mapas pequenos com **um desafio só** (só interseções verdes, só gaps,\nsó obstáculo) e use-os como \"testes unitários\" do seu programa. O `curso_pista.json` deste curso\né um exemplo: só curvas.\n\n## 11.8 Os robôs: `robo_4x4.json` e `robo_esteira.json`\n\nO arquivo do robô diz **onde está cada coisa**: medidas, motores e em que porta/ID, sensor de linha\n(posição dos ITR e TCS, altura), giroscópio (sentido, deriva), VL53 (canal, posição, ângulo,\naltura), para-choque, TCS horizontais, câmera, mecanismo de resgate. **Os valores que vieram são\nestimativas**: o módulo 17 mostra como medir o seu robô e ajustar o arquivo.\n\n## 11.9 Limitações\n\n* Mundo 2,5D: o robô não capota; lombadas levantam, mas não fazem quicar.\n* A câmera não gera imagem (stub).\n* O BNO085 não existe no simulador (a tela OLED e o teclado existem: veja 11.3).\n* O barramento serial é \"perfeito\" (no real pode haver erro de comunicação).\n* `threading.Event.wait(timeout)` e afins usam o relógio real.\n\n## Exercícios\n\n1. Rode o exemplo com as sementes 1 a 6 no `completo.json`. Anote os totais. Qual semente é a pior?\n   Assista essa rodada na janela (`--semente N`) e descubra o que deu errado.\n2. Monte no editor um mapa só com 4 interseções de verde e teste o seu seguidor nele.\n3. Coloque `simdebug.texto()` mostrando o estado do seu seguidor e acompanhe uma rodada.\n4. Rode o mesmo programa a 1x e a 4x com a mesma semente. O placar é igual?\n", "12-simulador-maze.md": "# Módulo 12 — O simulador da Rescue Maze\n\n**Objetivo:** usar o simulador da Maze: rodar o programa, entender câmeras, kits e LEDs de\nvítima, editar labirintos e ler o placar.\n\nDocumentação completa: `simuladorMaze/README.md`. O funcionamento geral (programa em processo\nseparado, libs reais, `simdebug`, sem janela) é o mesmo do simulador da Line ([módulo 11](11-simulador-line.md)).\n\n## 12.1 Rodando\n\nNa pasta `simuladorMaze`:\n```bash\npython simulador.py                                              # exemplo, mapa exemplo1\npython simulador.py --programa ../minhaMaze/main.py --mapa mapas/exemplo1.json\npython simulador.py --programa ../minhaMaze/main.py --sem-janela --velocidade 4 --semente 1\n```\n\nOpções: `--robo`, `--mapa`, `--programa`, `--sem-janela`, `--velocidade`, `--semente N` (aqui o\npadrão é **sortear**: passe uma semente para repetir a rodada), `--lop botao|reiniciar`, `--tempo`.\n\n## 12.2 A janela\n\nIguais à Line: **▶ Iniciar rodada** (F5), **■ Parar**, **↺ Nova rodada** (apaga também os arquivos\nde checkpoint listados em `arquivos_rodada`), **LoP** (L), **Botão do robô** (B), **Auto-botão**,\n**Pausar**, **Vel.**, arrastar/Q/E para reposicionar, a **tela e o teclado do brick** no canto do\nmapa (botões com o mouse ou F1–F4; **O** esconde). Específicas da Maze:\n\n| Tecla | Mostra |\n|---|---|\n| R | raios dos VL53 |\n| T | trilha |\n| C | campo de visão das câmeras |\n| F | ladrilhos \"flutuantes\" (roxo) |\n\n## 12.3 O robô da Maze (`robo.json`)\n\n| Peça | Onde |\n|---|---|\n| Tração 4x4 | Mariola motores 1/2 (trás) + placas de motor IDs 8 e 51 (frente) na SERIAL1 |\n| Giroscópio | SERIAL5 |\n| Pro1616 | SERIAL6 — cor do piso (preto, prata, azul, vermelho) |\n| 5 VL53 | I2C1 esq. frente, I2C2 esq. trás, I2C3 dir. frente, I2C4 dir. trás, I2C5 frente |\n| Para-choque | P1 esquerdo, P2 direito |\n| Botão de início | P3 |\n| Câmeras | laterais (esquerda e direita) |\n| LEDs do Mariola | 0–3 iluminação da câmera esquerda, 4–7 da direita, **8–9 sinal de vítima** |\n| Kits | dispensador com lado esquerdo e direito |\n\n## 12.4 Vítimas, LEDs e kits\n\n```python\nfrom deteccaoVitimas import DeteccaoVitimas\nfrom dispensadorKits import DispensadorKits\n\ncam = DeteccaoVitimas()\nkits = DispensadorKits()\n\nfor v in cam.detecta_todas():          # [{'camera': 'esquerda', 'status': 'ferida', 'kits': 2, ...}]\n    pisca_led_vitima(5)                # LEDs 8–9: 500 ms aceso / 500 ms apagado por 5 s, parado\n    kits.deposita(v['kits'], v['camera'])\n```\n\n* A câmera só vê a vítima **de frente**, dentro do campo de visão e sem parede no meio.\n* Com `exige_iluminacao`, **câmera com os LEDs apagados não enxerga**. Lembre: o Mariola apaga os\n  LEDs após 5 s sem pacote (ex.: esperando o botão). Acenda a iluminação **depois** do botão.\n* Só os LEDs 8–9 contam para o juiz como \"sinal de vítima\".\n* No robô, as versões de `robo_real/` têm a mesma interface (complete a sua visão e o seu\n  mecanismo de kits).\n\n## 12.5 O juiz da Maze (regra 2026)\n\nPontua: identificação de vítima (piscar 5 s parado a até 15 cm; 5/15 letra, 10/30 cognitiva,\nconforme a parede é ou não \"linear\"), kits (10 por 1, 30 por 2, só depois da identificação),\ncheckpoint (10), azul (30, −10 por revisita, LoP se não parar 5 s), lombada (5), escada (10),\nidentificação errada (−5), LoP no preto, bônus de confiabilidade e **bônus de saída** (piscar\n1 s/1 s por 10 s no início). A rodada acaba em 8 min ou na saída.\n\n## 12.6 Mapas e editor\n\nMapas em `mapas/*.json` (fáceis de editar na mão): `paredes_h`/`paredes_v` (strings de 0 e 1),\n`ladrilhos` (piso preto/prata/azul/vermelho, terreno lombada/escada/detritos, zona), `vitimas`\n(ladrilho, parede, posição, tipo).\n\nO **editor** (\"Editar mapa\") faz tudo com o mouse, avisa vítima em posição proibida e ladrilho\ninalcançável, e tem \"Sortear pisos\" (como o dado do juiz).\n\n## 12.7 Diferenças em relação à Line\n\n* As libs de reserva (`libs_mariola/`) do simulador da Maze são de antes de algumas atualizações\n  (ex.: `giroscopio.py` sem o modo `ROS_IMU`). **Copie as libs atuais para a pasta do seu\n  programa** e é elas que vão rodar.\n* A Maze não tem câmera frontal (`visao`) nem garra.\n* Não há rampas/pontes de verdade (escada e lombada são efeitos).\n\n## Exercícios\n\n1. Rode `codigos/09_maze/mao_direita.py` com `--semente 1` e assista. Onde ele perde tempo?\n2. Edite o `exemplo1.json`: ponha um ladrilho azul onde o robô passa e confira os 30 pontos.\n3. Faça um programa que só gira no lugar e imprime `cam.detecta()` com a iluminação apagada e\n   acesa.\n", "13-organizando-o-codigo.md": "# Módulo 13 — Organizando o código de um robô de competição\n\n**Objetivo:** sair dos programas de teste e montar um projeto que cresce sem virar bagunça: uma\ncamada de hardware (`robo.py`), a estratégia separada, uma máquina de estados e ferramentas de\ndepuração.\n\nModelo: os programas de exemplo dos simuladores (`simuladorLine/exemplo_aluno/` e\n`simuladorMaze/exemplo_aluno/`).\n\n## 13.1 O problema\n\nNos tutoriais, cada programa cria os objetos, escreve um `anda()` e mistura sensores e decisões.\nNum robô de competição isso dá errado rápido:\n\n* a mesma conta (mm por contagem, sinal do giroscópio) aparece em cinco lugares, e uma delas fica\n  errada;\n* trocar um sensor de porta exige caçar o número pelo código;\n* não dá para entender **por que** o robô fez algo.\n\n## 13.2 Camadas\n\n```\nmain.py          ← ESTRATÉGIA: o que fazer (seguir, desviar, resgatar). Não sabe de portas nem bytes.\nresgate.py       ← estratégia de uma parte da prova\nnavegacao.py     ← lógica pura (mapa, rotas): sem hardware, dá para testar no PC\nrobo.py          ← HARDWARE: cria os objetos e oferece ações com nome de gente:\n                    anda(ve, vd), gira(graus), anda_mm(mm), reflexao(), cores(), z(),\n                    distancia('frente'), espera_botao(), garra.fecha() ...\nlibs (motores.py, ...)   ← as bibliotecas do Mariola\n```\n\nRegra: **só o `robo.py` importa as libs do Mariola.** O `main.py` só chama métodos do `Robo`.\n\nVantagens:\n* trocou o motor de lado? Muda uma linha no `robo.py`;\n* o robô de esteira e o 4x4 usam o mesmo `main.py` (o `robo.py` do exemplo descobre a tração);\n* dá para ler o `main.py` como uma descrição da estratégia.\n\n### Constantes no topo do `robo.py`\nTudo o que se **mede** ou se **ajusta** fica em constantes com nome e comentário de unidade:\n\n```python\nDIAMETRO_RODA = 70.0          # mm\nCONTAGENS_POR_VOLTA = 17 * 34 * 2\nGIRO_HORARIO_POSITIVO = True\nBRACO_BAIXO, BRACO_ALTO = 820, 270            # potenciômetro do servo 70 (A CALIBRAR)\nVL53_CANAIS = {'frente': Portas.I2C5, 'esquerda': Portas.I2C1, 'direita': Portas.I2C3}\n```\n\nE as de estratégia no topo do `main.py` (`VEL`, `KP`, `KD`, `PRETO`, `DIST_OBSTACULO`).\n\n## 13.3 Máquina de estados\n\nUm robô de competição está sempre \"fazendo alguma coisa\": seguindo linha, conferindo um verde,\natravessando um gap, desviando, na área de resgate. Escreva isso **explicitamente**:\n\n```python\nestado = 'SEGUINDO'\nwhile True:\n    if estado == 'SEGUINDO':\n        if viu_verde():\n            estado = 'VERDE'\n        elif sem_linha():\n            estado = 'GAP'\n        elif obstaculo_na_frente():\n            estado = 'OBSTACULO'\n        else:\n            segue_linha()\n    elif estado == 'VERDE':\n        trata_intersecao()\n        estado = 'SEGUINDO'\n    elif estado == 'GAP':\n        estado = 'SEGUINDO' if atravessa_gap() else 'PROCURANDO'\n    ...\n    mostra(estado)                  # LEDs / simdebug.texto\n    time.sleep(0.01)\n```\n\n* Cada estado tem **uma** responsabilidade e uma condição de saída clara.\n* Mostre o estado (LED de uma cor por estado no robô; `simdebug.texto` no simulador). Quando o robô\n  fizer besteira, você vai saber **em que estado** estava.\n* Toda manobra tem **tempo máximo**. Nenhum estado pode prender o robô para sempre.\n\nO `main.py` do exemplo da Line faz algo parecido, com um método por situação (`intersecao`, `gap`,\n`obstaculo`) chamados pelo `passo()`.\n\n## 13.4 Percepção x decisão x ação\n\nAo depurar, separe as três perguntas:\n\n1. **Percepção:** o robô **viu** certo? (o sensor disse verde quando era verde?)\n2. **Decisão:** com o que viu, ele **decidiu** certo?\n3. **Ação:** a manobra **executou** o que foi decidido?\n\n`print` do que foi visto e decidido (com o tempo), `simdebug.pose()` do que ele acha e o painel do\nsimulador com o que realmente é: na maioria das vezes o erro aparece na hora.\n\n```python\ndef log(*a):\n    print(f'{time.time() - T0:7.2f}', *a, flush=True)\n```\n\n## 13.5 Arquivos que o robô grava\n\nCheckpoint (Maze), cores calibradas, relógio da rodada:\n\n* caminho **absoluto a partir da pasta do programa** (o menu roda com a pasta atual em\n  `/home/banana`):\n  ```python\n  PASTA = os.path.dirname(os.path.abspath(__file__))\n  ARQUIVO = os.path.join(PASTA, 'checkpoint.json')\n  ```\n* **escrita atômica** (o robô pode ser desligado no meio): grave num `.tmp` e troque com\n  `os.replace` (o `navegacao.py` da Maze faz assim);\n* no simulador, liste esses arquivos em `arquivos_rodada` do `robo.json`, para o **Nova rodada**\n  apagá-los.\n\n## 13.6 Teste por partes\n\n* Cada capacidade nova nasce num **programa de teste pequeno** (como os de `codigos/`) e num **mapa\n  pequeno** com só aquele desafio.\n* A lógica sem hardware (mapa, BFS, classificação) se testa no PC com `python` puro.\n* Antes de cada mudança grande, rode as sementes de referência no simulador (módulo 11) e compare\n  os totais.\n\n## 13.7 Controle de versão\n\nUse **git** (ou, no mínimo, uma cópia datada da pasta) a cada versão que funcionou. Na competição,\n\"a versão de ontem que funcionava\" vale ouro. Anote no commit o que mudou e o resultado no\nsimulador.\n\n## Exercícios\n\n1. Pegue o seu seguidor do módulo 6 e separe em `robo.py` (hardware) e `main.py` (estratégia).\n2. Transforme o laço principal numa máquina de estados com pelo menos `SEGUINDO`, `PERDEU_LINHA` e\n   `CHEGADA`. Acenda uma cor de LED diferente em cada estado.\n3. Faça o `log()` com tempo e grave também num arquivo na pasta do programa.\n", "14-projeto-rescue-line.md": "# Módulo 14 — Projeto: o seguidor completo da Rescue Line\n\n**Objetivo:** juntar tudo num programa que faz a prova inteira da linha: marcadores verdes, curvas\nde 90°, gaps, obstáculo, rampas, lombadas e a chegada. Estudamos o programa de exemplo do simulador\ne o que cada parte resolve.\n\nPrograma: `simuladorLine/exemplo_aluno/` (`robo.py`, `main.py`, `resgate.py`, `calibra_cores.py`).\nMapas: `treino.json` (interseções, gap), `completo.json` (tudo), `resgate.json`.\n\n```bash\npython simulador.py --mapa mapas/completo.json\n```\n\n## 14.1 Estrutura\n\n* `robo.py` — o hardware (módulo 13): `anda`, `gira`, `anda_mm(mm, para_se=...)`, `reflexao()`,\n  `cores()` (com a confirmação RGB do módulo 6), `z()`, `inclinacao()`, `distancia(nome)` (VL53 sem\n  bloquear), `para_choque()`, `espera_botao()`, e a classe `Garra`.\n* `main.py` — a classe `Seguidor`, com um método por situação e o `passo()`, chamado em laço a cada\n  10 ms.\n\n## 14.2 O `passo()`: a ordem das perguntas importa\n\nA cada volta, o seguidor pergunta, **nesta ordem**:\n\n1. **É a entrada da área de resgate?** (fita prata) → `AreaResgate(r).executa()`\n2. **Vermelho em 2 ou mais TCS?** → chegada: para (e fica parado).\n3. **Para-choque ou VL53 da frente < 70 mm?** → `obstaculo()`\n4. **Sensor sem contraste** (tudo escuro por igual)? → segue reto pelo giroscópio (lombada, pé ou\n   topo de rampa).\n5. **Faixa preta larga** (um canal da ponta + os dois do meio)? → `intersecao(lado)`\n6. **Não vê linha?** → se a linha estava escapando para um lado, é curva: gira para lá. Senão,\n   `gap()`.\n7. **Caso normal:** PD na posição da linha (módulo 6), mais devagar quando o erro é grande, mais\n   rápido subindo rampa, mais lento descendo.\n\nA ordem é uma decisão de estratégia: o prata e o vermelho vêm antes de tudo porque são raros e\nimportantes; o PD vem por último porque é o \"senão\".\n\n## 14.3 Marcadores verdes e interseções\n\n**A regra:** antes de uma interseção pode haver marcadores verdes. Verde à esquerda → vire à\nesquerda; à direita → direita; dos dois lados → meia-volta; nenhum → siga reto.\n\n**O problema de tempo:** os TCS passam pelo verde **antes** de a fileira de IR chegar à faixa preta\nda interseção. Quando o robô percebe a interseção, o verde já ficou para trás.\n\n**A solução do exemplo:** guardar **quando** viu verde de cada lado e, ao chegar na interseção,\nolhar se foi há pouco tempo:\n\n```python\ndef olha_verde(self):                 # chamado em TODO passo\n    c = self.r.cores()\n    if c[0] == 'verde':\n        self.verde_esq = time.time()\n    if c[2] == 'verde':\n        self.verde_dir = time.time()\n    return c\n\ndef verde_recente(self, janela=0.6):\n    agora = time.time()\n    return agora - self.verde_esq < janela, agora - self.verde_dir < janela\n```\n\nNa interseção: anda até o centro do robô ficar sobre o cruzamento (`anda_mm(70)`), gira 45° (ou\n150° na meia-volta) e termina **procurando a linha** girando devagar até os canais do meio a verem\n— em vez de confiar num ângulo fixo.\n\n**Sem verde:** avança um pouco; se ainda há linha no meio, é cruzamento (segue reto); senão é uma\n**curva de 90°** e gira para o lado da faixa preta.\n\n> **Atenção à rampa:** inclinado, o sensor muda de altura e a leitura engana. O exemplo não trata\n> faixa larga como interseção quando a inclinação está entre 3° e 18° (transição de rampa).\n\n## 14.4 Gap\n\n**A regra:** a linha pode ter falhas de até 20 cm, sempre em trecho reto.\n\n```python\ndef gap(self):\n    def achou():\n        return posicao_linha(r.reflexao())[0] is not None\n    if not r.anda_mm(GAP_MAX_MM, vel=30, para_se=achou):   # anda reto pelo giroscópio\n        return True                                        # achou a linha: era gap\n    r.anda_mm(-GAP_MAX_MM, vel=35)                         # não era: volta e procura\n    self.procura_linha_girando(+1, max_graus=60)\n    ...\n```\n\nO `anda_mm(..., para_se=função)` do `robo.py` é um padrão muito útil: **andar até uma condição ou\naté a distância**, o que vier primeiro, mantendo a direção pelo giroscópio.\n\n**Curva x gap:** se a linha sumiu enquanto escapava para um lado (`erro_ant` grande), o mais\nprovável é uma curva fechada, não um gap. O exemplo gira para aquele lado antes de supor gap.\n\n## 14.5 Obstáculo\n\n**A regra:** um obstáculo em cima da linha; o robô deve contorná-lo e voltar à linha depois dele\n(pode empurrar se ele for solto, mas não pode tirar da pista de propósito).\n\nO exemplo contorna pela direita \"às cegas\": ré, gira −90°, anda 170 mm, gira 90°, anda 420 mm,\ngira 90°, anda até achar preto, procura a linha. Funciona para o obstáculo padrão, mas:\n\n* não sabe o **tamanho** do obstáculo;\n* não sabe se há **parede ou outra linha** do lado escolhido.\n\n**Melhoria clássica (exercício):** usar o VL53 lateral para **contornar seguindo o obstáculo**\n(módulo 7, seguir parede) até a linha aparecer.\n\n## 14.6 Rampas, lombadas e detritos\n\n* **Rampa:** `inclinacao()` (giroscópio X) > 8° → mais velocidade; < −8° → menos. No pé e na\n  crista, o sensor muda de altura e tudo escurece: o passo 4 do `passo()` segue reto pelo\n  giroscópio enquanto a leitura não tem contraste.\n* **Lombada:** o sensor sobe e desce; com o sensor perto do chão o branco satura (> 200) e o preto\n  fica cinza; os TCS também clareiam. Não confunda com prata (módulo 6).\n* **Detritos:** palitos que fazem o robô \"pular\". Velocidade menor ajuda.\n\n## 14.7 Chegada\n\nVermelho em 2 ou mais TCS (com a confirmação RGB) → parar e **ficar parado mais de 5 s**. O\nexemplo para e nunca mais anda (`self.parado`).\n\n## 14.8 Checkpoints e LoP\n\nNo LoP o juiz põe o robô no último checkpoint. O simulador pode **reiniciar o programa** (como\ndesligar e ligar o robô). Para a linha, quase não há estado a guardar — o seguidor recomeça\nseguindo. Mas, se o seu programa já fez a área de resgate, ele precisa **saber disso** depois de\nreiniciar (um arquivo, módulo 13).\n\n## 14.9 Como evoluir o programa\n\n1. Rode as sementes 1–6 no `completo.json` e anote LoPs e totais (módulo 11).\n2. Para a pior rodada, assista na janela com `simdebug.texto()` mostrando o estado.\n3. Classifique o erro: percepção, decisão ou ação (módulo 13).\n4. Crie um mapa pequeno que reproduza o problema, corrija, rode as 6 sementes de novo.\n5. Confirme no robô real.\n\n## Exercícios\n\n1. Monte um mapa com 4 interseções (verde esquerda, direita, os dois, nenhum) e faça o exemplo\n   acertar todas em 6 sementes.\n2. Troque o contorno \"às cegas\" do obstáculo por um contorno seguindo o obstáculo com o VL53\n   direito.\n3. A janela de 0,6 s do verde depende da velocidade. Troque por **distância** (encoder): \"vi verde\n   nos últimos 40 mm\".\n4. Aumente a velocidade base para 50 e ajuste o que for preciso para continuar completando o\n   `completo.json`.\n5. Faça a fita vermelha encerrar o programa só depois de 6 s parado (e confira o placar).\n", "15-projeto-area-de-resgate.md": "# Módulo 15 — Projeto: a área de resgate\n\n**Objetivo:** entender a estratégia completa da área de resgate — entrar, achar e pegar as\nvítimas, guardar na caçamba, depositar nos triângulos certos e sair — e as armadilhas de cada\netapa.\n\nPrograma: `simuladorLine/exemplo_aluno/resgate.py`. Mapas: `mapas/resgate.json` (linha + área) e\n`mapas/curso_area.json` (o robô começa na frente da entrada).\n\n```bash\npython simulador.py --mapa mapas/curso_area.json\n```\n\n## 15.1 A regra em resumo (2026)\n\n* Área de 120 × 90 cm (medida por fora; paredes de 25 mm para dentro, 10 cm de altura). Entrada com\n  **fita prata**, saída com **fita preta**, no vão da parede.\n* Três vítimas: **duas vivas** (bolas prateadas) e **uma morta** (bola preta), 45 mm, soltas no\n  chão. Pode haver vítimas falsas e um obstáculo.\n* Dois **triângulos** nos cantos (30 × 30 cm, paredes de 6 cm): **verde** para as vivas,\n  **vermelho** para a morta.\n* Cada vítima no triângulo certo multiplica a pontuação por 1,4 (perdendo 0,05 por LoP no trecho,\n  mínimo 1,25). **A morta só vale depois das duas vivas.**\n\n## 15.2 Dois robôs, duas estratégias\n\n| Robô | Estratégia |\n|---|---|\n| 4x4 com câmera, garra e caçamba | recolher as 3 vítimas, depositar, sair |\n| Esteira, só sensor de linha | **só sair**: achar o vão com fita preta e continuar a linha |\n\nMesmo sem resgatar ninguém, **sair da área e continuar** vale os pontos do resto da linha.\n`AreaResgate.executa()` decide pelo que o robô tem (`visao` disponível ou não).\n\n## 15.3 Detectar a entrada\n\nQuem vê a fita prata é o **TCS**: com os LEDs de 5 mm, a claridade C passa de 127 (o branco) e\nchega a ~200. O IR não ajuda a achar o prata, porque lê **menos** nele (~80) que no branco. Mas\nem cima da lombada o sensor chega mais perto do chão e **tudo** clareia: o branco também chega a\n~200 no TCS. A diferença é que a fita prata atravessa o vão inteiro (os 3 TCS e os 4 canais de IR\nficam em cima dela, sem linha preta), enquanto na lombada a linha continua embaixo do meio do\nsensor. O exemplo só aceita a entrada se tudo concordar:\n\n```python\nPRATA_C = 165          # claridade C do TCS: branco ~127, prata ~200\nIR_PRATA = (50, 120)   # no prata o IR lê ~80; abaixo = linha preta; acima = sensor perto do chão\n\ndef eh_prata(r, ir=None):\n    ir = ir if ir is not None else r.reflexao()\n    if min(ir) < IR_PRATA[0] or max(ir) > IR_PRATA[1]:\n        return False                                     # linha preta embaixo, ou IR estourado\n    for k in (1, 2, 3):                                  # os 3 TCS muito claros e 'prata'\n        if r.cor.le_rgbc(k)[3] < PRATA_C or r.cor.cor(k) != 'prata':\n            return False\n    return True\n\ndef entrada_da_area(r, ir):\n    return abs(r.inclinacao()) <= 4 and eh_prata(r, ir)  # e o robô nivelado\n```\n\n## 15.4 Um referencial para a área inteira\n\nAo entrar, o robô guarda `z_entrada = r.z()`. As paredes da área são **paralelas e\nperpendiculares** a essa direção, e os triângulos ficam a **45°**. Toda manobra usa essa\nreferência: \"virar para a parede\" é girar para `z_entrada + 90·k`; \"ficar de frente para o\ntriângulo\" é `z_entrada + 45 + 90·k`.\n\nCuidado com o giroscópio acumulando voltas (`z` = 384° depois de muitos giros): escolha sempre o\nalvo **mais perto** do ângulo atual (`diagonal_mais_perto`, `alinhado`).\n\n## 15.5 Recolher\n\n```\nprocura (gira de 30 em 30°, olhando)  →  escolhe a mais perto que ainda cabe na caçamba\n   → aproxima em passos (até ~26 cm), corrigindo o ângulo a cada quadro\n   → confirma o tipo em mais 2 quadros (votação)\n   → abaixa a garra aberta  (a câmera fica tapada!)\n   → avança devagar até o VL53 da garra ver a bolinha (< 22 mm)\n   → fecha, levanta\n   → confere com o VL53 da garra se a bolinha está lá\n   → joga no lado certo da caçamba (vivas à esquerda, morta à direita)\n```\n\nDetalhes que fazem diferença:\n\n* **Escolher:** só vítimas que ainda cabem (2 vivas, 1 morta).\n* **Não achou nada girando?** Muda de lugar (anda até perto de uma parede) e procura de novo.\n  Vítimas atrás de outras ou perto do triângulo podem não aparecer de um ponto só.\n* **Garra abaixada tapa a câmera:** o último trecho é \"às cegas\", guiado pelo VL53 da garra.\n* **Errou?** Se depois de levantar o VL53 da garra não vê nada, volta e tenta de novo.\n* **Tempo máximo** na área (`TEMPO_MAXIMO_AREA`): depois disso, desiste e vai para a saída.\n* **`garra.mantem()`** nas esperas longas (5 s sem pacote desliga os servos).\n\n## 15.6 Depositar\n\n```\nprocura o triângulo (câmera, cor)  →  vai até ~50 cm dele\n  → gira para a diagonal (de frente para a parede do triângulo)\n  → corrige o desvio lateral (centro da parede bem na frente)\n  → avança até ~15 cm\n  → gira 180° e encosta de RÉ até o TCS de trás ver a cor certa\n  → abre a porta do lado certo; as bolinhas caem por cima da parede de 6 cm\n```\n\n* O **TCS de trás** é a confirmação: nunca solte sem ver a cor certa (3 tentativas).\n* Vivas primeiro. A morta só se as duas vivas foram entregues (senão, ela não vale e ainda ocupa\n  tempo).\n\n## 15.7 Sair\n\nO robô **segue a parede pela direita** (VL53 direito a 6 cm, módulo 7), virando nos cantos (VL53 da\nfrente), até achar um **vão**. Se embaixo do vão há **fita preta**, é a saída: atravessa e volta a\nseguir a linha. Se é **prata**, é a entrada: passa reto.\n\nArmadilhas resolvidas no exemplo:\n* depois de girar, a primeira leitura do VL53 é velha (de antes do giro): `renova()`;\n* limitar o quanto o robô pode \"apontar\" para a parede (±12° do rumo), senão o sensor mede na\n  diagonal e ele se perde;\n* detectar robô **preso** (encoder não anda) e dar ré.\n\n## 15.8 Resultados e o que melhorar\n\nNo `curso_area.json` (semente 1), o exemplo resgata as três vítimas e sai: total 220 com\nmultiplicador ×2,744. Em outras sementes às vezes perde uma vítima. Boas melhorias:\n\n1. Procurar vítimas **andando em um padrão** (varrer a área) em vez de só girar parado.\n2. Pegar a vítima **encostada na parede** (o braço não chega; empurrar para o meio antes).\n3. Lembrar onde viu cada vítima (mapa da área) para não procurar de novo.\n4. Usar o tempo: se faltam poucos minutos, sair direto.\n\n## Exercícios\n\n1. Rode o exemplo com as sementes 1 a 6 no `curso_area.json` e anote quantas vítimas resgatou em\n   cada uma.\n2. Mude a ordem: entregar a morta antes das vivas. O que o juiz faz?\n3. Faça o robô de esteira (sem câmera) achar a saída em 6 sementes.\n4. Escreva a busca \"em padrão\": percorra a área em três faixas paralelas, olhando a cada 30 cm.\n", "16-projeto-rescue-maze.md": "# Módulo 16 — Projeto: Rescue Maze\n\n**Objetivo:** fazer o robô andar ladrilho a ladrilho num labirinto, ver paredes, tratar os pisos\nespeciais, achar vítimas, e evoluir da \"regra da mão direita\" para um explorador com mapa,\nrotas e checkpoint em arquivo.\n\nCódigos: [`codigos/09_maze/mao_direita.py`](codigos/09_maze/mao_direita.py) e o exemplo completo\n`simuladorMaze/exemplo_aluno/` (`robo.py`, `navegacao.py`, `main.py`, `calibra_cores.py`).\n\n## 16.1 A Maze em resumo\n\n* Labirinto de ladrilhos de 30 × 30 cm com paredes. O robô explora e volta ao início.\n* **Pisos:** preto (proibido: entrar = LoP), azul (parar 5 s; 30 pontos), prata (checkpoint),\n  vermelho (entrada da zona de perigo, opcional).\n* **Terreno:** lombadas, escadas, detritos.\n* **Vítimas** nas paredes: letras (H, S, U) e alvos cognitivos. Identificar = **piscar o LED 5 s\n  parado**; depois **deixar kits** (2 ferida, 1 estável, 0 ilesa).\n* **Saída:** voltar ao início e piscar 10 s (1 s / 1 s).\n\n## 16.2 As ações básicas (tudo que você já sabe)\n\n| Ação | Como | Módulo |\n|---|---|---|\n| andar 1 ladrilho reto | encoder + giroscópio, parando se a parede da frente chegar perto | 4, 5 |\n| girar 90° | giroscópio com **alvo acumulado** | 5 |\n| ver paredes | VL53: lado < 150 mm, frente < 200 mm | 7 |\n| cor do piso | `cor_piso()` (3 TCS votando) | 6 |\n| alinhar | para-choque (os dois apertados) ou dois VL53 do mesmo lado | 7, 8 |\n| esperar sem soltar o motor | laço mandando `anda(0, 0)` | 3 |\n\n## 16.3 Tutorial: regra da mão direita\n\n```python\nwhile time.time() - inicio < 120:\n    d = distancias()\n    if d['direita'] > PAREDE_LADO and not acabou_de_ver_preto:\n        gira(-90)                         # direita livre: vira para a direita\n    elif d['frente'] > PAREDE_FRENTE:\n        pass                              # senão, frente livre: segue\n    elif d['esquerda'] > PAREDE_LADO:\n        gira(90)                          # senão, esquerda\n    else:\n        gira(180)                         # beco: meia-volta\n    acabou_de_ver_preto = False\n    if avanca() == 'preto':               # anda 1 ladrilho; se vir preto, volta\n        gira(180)\n        acabou_de_ver_preto = True\n        continue\n    piso = cor.cor_piso()\n    if piso == 'azul':\n        espera(5.5)                       # parado 5 s, mandando comando\n```\n\n```bash\npython simulador.py --programa ../curso/codigos/09_maze/mao_direita.py --semente 1\n```\n\n**O bug que apareceu no desenvolvimento:** a primeira versão, depois de ver o preto, voltava e\nvirava à esquerda. Na volta seguinte, a direita estava \"livre\" de novo (o preto não é parede para o\nVL53) e o robô entrava no preto para sempre. A solução foi **lembrar** que acabou de ver o preto e\nnão virar para a direita uma vez. Generalizando: **o robô precisa de memória** — é o próximo passo.\n\nLimites da mão direita:\n* não visita \"ilhas\" (paredes soltas no meio);\n* não sabe onde está, então não sabe **voltar ao início**;\n* revisita muita coisa.\n\n## 16.4 O explorador do exemplo: mapa + busca\n\nO `exemplo_aluno` da Maze guarda um **mapa interno** e decide para onde ir:\n\n**Referencial:** o robô começa no ladrilho `(0, 0)` olhando para a direção 0. Direções: 0 =\nfrente, 1 = esquerda, 2 = trás, 3 = direita (girar à esquerda soma 1). Cada ladrilho visitado\nregistra suas paredes e o piso.\n\n**`navegacao.py`** (sem hardware nenhum, dá para testar no PC):\n\n| Função | Faz |\n|---|---|\n| `Mapa.set_parede(p, d, tem)` | grava a parede do ladrilho `p` na direção `d` (e a do vizinho) |\n| `Mapa.bloqueado(p, d)` | parede, ou vizinho preto/vermelho |\n| `Mapa.fronteira(p)` | direções abertas que levam a ladrilhos **não visitados** |\n| `Mapa.caminho(origem, criterio)` | **busca em largura (BFS)**: menor rota até um ladrilho que satisfaz o critério |\n| `salva_checkpoint(...)` / `carrega_checkpoint()` | mapa + posição em arquivo, com **escrita atômica** |\n\n**A estratégia (`main.py`):**\n1. Chegou num ladrilho: lê o piso, as paredes, centraliza, procura vítimas.\n2. Tem vizinho não visitado aberto? Vai (preferindo frente, depois esquerda, direita).\n3. Não tem? Usa a BFS para achar o ladrilho visitado mais perto que ainda tem fronteira, e vai até\n   ele.\n4. Mapa todo explorado, ou passou de 6,5 min? BFS até `(0, 0)` e pisca o sinal de saída.\n\nIsso é uma **busca em profundidade** guiada por BFS: visita tudo e sempre sabe voltar.\n\n## 16.5 Detalhes que fazem a diferença\n\n* **Corrigir o giroscópio com as paredes:** a cada ladrilho com parede na frente, encosta no\n  para-choque (os dois botões = reto contra a parede) e redefine a direção; com parede do lado,\n  mede o ângulo com dois VL53 e corrige. Sem isso, a deriva acumula em 8 minutos.\n* **A parede da frente é melhor que o encoder:** se há parede à frente ao alcance, o robô para a\n  uma distância certa dela (o encoder patina).\n* **Preto:** o sensor de cor está na frente; ao ver preto, volta a distância andada e marca o\n  ladrilho como proibido.\n* **Checkpoint (prata):** salva o mapa e a posição **no arquivo** assim que chega. No LoP o\n  programa é reiniciado e recomeça daquele ponto com o mapa que já tinha.\n* **Vítimas:** procura depois de cada giro e de cada chegada; marca `(ladrilho, parede)` para não\n  sinalizar a mesma duas vezes; pisca os LEDs 8–9 por 5,6 s parado; deixa os kits.\n* **Iluminação:** acende os LEDs das câmeras **depois** do botão de início (antes, o timeout de 5 s\n  do Mariola apaga tudo).\n* **Zona de perigo:** o exemplo **evita** (vermelho = volta). Entrar vale mais, mas arrisca.\n\n## 16.6 Como evoluir\n\n1. Rode com várias sementes e anote: ladrilhos visitados, vítimas, LoPs, se voltou ao início.\n2. Use `simdebug.pose()` (o exemplo já usa): se o contorno roxo se afasta do robô real, o problema\n   é de **posição** (giro, encoder), não de estratégia.\n3. Otimize a ordem de exploração (ex.: preferir ladrilhos perto do início no fim da rodada).\n\n## Exercícios\n\n1. Na `mao_direita.py`, troque para \"mão esquerda\". O robô visita os mesmos ladrilhos?\n2. Teste `navegacao.py` no PC: monte um mapa à mão com `set_parede` e peça `caminho()` até um\n   ladrilho.\n3. No exemplo, mude `TEMPO_VOLTAR` para 3 min e confira que o robô volta ao início a tempo.\n4. Faça o exemplo entrar na zona de perigo e compare a pontuação em 6 sementes.\n", "17-do-simulador-para-o-robo.md": "# Módulo 17 — Do simulador para o robô real (e para a competição)\n\n**Objetivo:** fazer o simulador ficar parecido com o **seu** robô, levar o programa para o robô\nsem surpresas e chegar na competição com tudo calibrado e testado.\n\n## 17.1 O que muda entre o simulador e o robô\n\n| Igual nos dois | Diferente |\n|---|---|\n| o seu `main.py` e as libs | atrito, peso, centro de massa |\n| protocolo das placas, timeouts | luz do local (sensores de cor e IR) |\n| comportamento do encoder, do VL53, dos servos | bateria (velocidade máxima, leitura do IR) |\n| | folgas mecânicas, cabos, mau contato |\n| | a câmera (o stub × a sua IA de verdade) |\n\nPor isso: **lógica no simulador, ajuste fino no robô**.\n\n## 17.2 Arquivos que só existem de um lado\n\n| No simulador | No robô, copie para a pasta do projeto |\n|---|---|\n| `simdebug` (automático) | `robo_real/simdebug.py` (não faz nada) |\n| `visao` (stub, Line) | `simuladorLine/robo_real/visao.py` + a sua YOLO |\n| `deteccaoVitimas`, `dispensadorKits` (Maze) | `simuladorMaze/robo_real/...` completados |\n| `libs_mariola/` (reserva) | as libs de `bananaPiM4Zero/libs/` (+ `sensorCorReflexao` V2) |\n\n## 17.3 Deixando o `robo*.json` igual ao seu robô\n\nOs valores que vêm no simulador são **estimativas**. Meça e ajuste:\n\n| O que | Como medir | Onde no json |\n|---|---|---|\n| diâmetro da roda / polia | paquímetro | `rodas.diametro` |\n| contagens por volta | gire a roda 1 volta à mão e leia `angulo_motor` | `motor_padrao.contagens_por_volta_*` |\n| calibração dos motores | `obtem_calibracao_motores()` / `obter_calibracao()` | `motor_padrao.calibracao_*` |\n| posição das rodas | régua, a partir do centro do robô (x para frente, y para a esquerda) | `motores[].x/y` |\n| medidas e massa | régua e balança | `geometria` |\n| posição do sensor de linha | régua (x do IR e dos TCS, altura do chão) | `sensor_linha` |\n| leituras de cada material | o robô sobre cada cor, `le_reflexao()`/`le_rgbc()` | `cores_piso` |\n| VL53: canal, posição, ângulo, altura | régua | `vl53` |\n| giroscópio: sentido, deriva | gire à mão; deixe parado 1 min | `giroscopio` |\n| servos: IDs, posições | `buscar_servos`, `consulta_posicao` (módulo 9) | `resgate` |\n| câmera: altura, campo de visão | régua; objeto na borda da imagem | `camera` (`altura`, `fov_graus`) |\n\n**Teste de comparação:** rode o **mesmo** programa (andar 1 m, girar 360°, seguir 1 volta da pista)\nno robô e no simulador. Ajuste `motor_padrao.rpm_livre`, `motor_padrao.forca_max_N`,\n`rodas.atrito_lateral` e `giroscopio.deriva_graus_min` até os resultados baterem.\n\n## 17.4 Primeira vez no robô: passo a passo\n\n1. **Robô suspenso** (rodas no ar). Rode um teste de motores: cada roda gira para o lado certo?\n2. Teste cada sensor isolado (os programas de `codigos/`): valores fazem sentido?\n3. Calibre o sensor de linha (branco/preto) e **ensine as cores** no piso real.\n4. No chão, velocidade baixa: ajuste `KP`/`KD` (eles quase sempre mudam um pouco).\n5. Só depois aumente a velocidade.\n\n## 17.5 Problemas que só aparecem no robô\n\n| Sintoma | Suspeite de |\n|---|---|\n| Funciona com bateria cheia e não com a meia carga | velocidade/limiares no limite; teste com bateria a 70% |\n| Cores erradas no local da competição | luz diferente: refaça `aprende_cor` no tempo de calibração |\n| Leituras malucas de vez em quando | cabo frouxo, mau contato no conector, ruído do motor |\n| Programa trava às vezes | exceção não tratada (veja `~/logs/*_erro.log`); `OSError` de I2C |\n| O robô funciona pelo `ssh` e não pelo menu | caminho relativo de arquivo, `print` sem flush (módulo 2) |\n| Câmera lenta | modelo pesado: use ONNX/NCNN, imagem menor (320×240) |\n\n## 17.6 Robustez\n\n* `try/except (OSError, TimeoutError)` em volta de leituras I2C, com `recover()` do sensor.\n* `PlacaControleServo`/`PlacaControleMotor` devolvem `None` quando falham: trate.\n* Uma exceção inesperada **não pode** parar o robô no meio da rodada sem querer. Um padrão:\n  ```python\n  while True:\n      try:\n          seguidor.passo()\n      except (OSError, TimeoutError) as e:\n          log('erro de sensor:', e)       # registra e continua\n      time.sleep(0.01)\n  ```\n  (Erros de lógica — `TypeError`, `NameError` — devem aparecer no teste, não ser escondidos.)\n\n## 17.7 Checklist do dia da competição\n\n**Antes de sair de casa / do laboratório**\n- [ ] Versão do programa testada, com cópia de segurança (git/pendrive) — e a anterior também.\n- [ ] Todas as libs na pasta do projeto. O programa roda **pelo menu**.\n- [ ] Baterias carregadas (e reservas), carregador.\n- [ ] Ferramentas, cabos e peças de reposição (servo, VL53, cabos dos conectores).\n- [ ] Programa de calibração de cores e programa de teste de sensores no robô.\n\n**No tempo de calibração**\n- [ ] Calibre branco/preto se necessário; **ensine as cores** no piso oficial.\n- [ ] Confira o verde, o vermelho e o prata com o programa de teste.\n- [ ] Teste a câmera com a luz do local (vítimas, triângulos).\n\n**Antes de cada rodada**\n- [ ] Bateria conferida.\n- [ ] Programa certo selecionado no menu.\n- [ ] Arquivos da rodada anterior (checkpoint, relógio) apagados — ou o programa sabe que é rodada\n      nova.\n- [ ] Robô no início, apontado certo, botão de início.\n\n**Depois de cada rodada**\n- [ ] Anote o que aconteceu (LoPs, onde, por quê). Veja o log.\n- [ ] Mudou o programa? Teste no simulador **antes** de usar na próxima rodada.\n\n## Exercício\n\nFaça a tabela de 17.3 com as medidas do seu robô, ajuste o `robo*.json` e compare: andar 1 m e\ngirar 360° no robô e no simulador. Quanto ficou a diferença?\n", "18-desafios.md": "# Módulo 18 — Desafios e projetos\n\nCada módulo tem exercícios curtos. Aqui estão **desafios maiores**, em ordem de dificuldade, que\njuntam vários módulos. Todos podem ser feitos no simulador e conferidos pelo placar (com várias\nsementes!) e depois no robô.\n\n## Nível 1 — Fundamentos\n\n| # | Desafio | Módulos | Pronto quando |\n|---|---|---|---|\n| 1.1 | **Quadrado perfeito:** andar um quadrado de 50 cm e voltar ao ponto de partida | 4, 5 | erro final < 3 cm e < 3° |\n| 1.2 | **Estacionar:** parar a 10 cm da parede, girar 180°, voltar e parar a 10 cm da parede oposta | 4, 5, 7 | ±1 cm |\n| 1.3 | **Painel de sensores:** um programa que mostra (tela ou print) todos os sensores e muda de página com o teclado | 6, 7, 8 | usado de verdade para conferir o robô no campo |\n| 1.4 | **Garra de teste:** pegar uma bolinha parada à frente e jogar no lado certo da caçamba | 9 | 5 de 5 tentativas |\n\n## Nível 2 — Rescue Line\n\n| # | Desafio | Pronto quando |\n|---|---|---|\n| 2.1 | **PD afinado:** `curso_pista.json` com velocidade 50, sem LoP | 6 sementes sem LoP |\n| 2.2 | **Interseções:** mapa só com verdes (esquerda, direita, os dois, nenhum, curva de 90° sem verde) | todas certas em 6 sementes |\n| 2.3 | **Gap e obstáculo:** mapa com 2 gaps e 1 obstáculo, contornando com o VL53 lateral | 6 sementes sem LoP |\n| 2.4 | **Rampa e lombada:** `completo.json` sem LoP nos trechos de rampa e lombada | 6 sementes |\n| 2.5 | **Prova completa:** `completo.json` ponta a ponta | média ≥ 250 em 6 sementes |\n\n## Nível 3 — Área de resgate\n\n| # | Desafio | Pronto quando |\n|---|---|---|\n| 3.1 | **Só sair:** robô de esteira acha a saída em `resgate.json` | 6 de 6 |\n| 3.2 | **Uma viva:** resgatar uma vítima viva no verde | 5 de 6 |\n| 3.3 | **As três:** duas vivas e a morta, na ordem certa | média ≥ 2,5 vítimas em 6 sementes |\n| 3.4 | **Vítimas difíceis:** vítimas encostadas nas paredes e perto dos triângulos (edite o mapa) | 2 de 3 resgatadas |\n\n## Nível 4 — Rescue Maze\n\n| # | Desafio | Pronto quando |\n|---|---|---|\n| 4.1 | **Mão direita robusta:** sem entrar no preto, parando no azul | 2 min sem LoP |\n| 4.2 | **Mapa interno:** desenhar com `simdebug.marca` cada parede detectada | o desenho bate com o labirinto |\n| 4.3 | **Volta ao início:** explorar 3 min e voltar pela rota mais curta | volta em 6 sementes |\n| 4.4 | **Vítimas e kits:** identificar e deixar os kits certos | sem identificação errada |\n| 4.5 | **Checkpoint:** com LoP \"reinicia prog.\", retomar do último prata | retoma certo em 3 LoPs |\n\n## Projeto final\n\nEscolham **Line** ou **Maze** e, em equipe:\n\n1. Montem o robô e meçam tudo (módulo 17); ajustem o `robo*.json`.\n2. Organizem o código em camadas com máquina de estados (módulo 13).\n3. Criem **mapas de teste** para cada desafio e uma bateria de sementes de referência.\n4. Mantenham um **diário**: versão, o que mudou, placar nas sementes de referência.\n5. Façam uma rodada oficial no robô real (cronometrada e pontuada como na competição).\n\n### Sugestão de avaliação (professor)\n\n| Critério | Peso |\n|---|---|\n| Resultado nas sementes de referência no simulador | 25% |\n| Resultado no robô real (rodada oficial) | 25% |\n| Organização do código (camadas, constantes, estados, nomes) | 20% |\n| Diário de testes (o que tentaram, o que mediram, o que aprenderam) | 20% |\n| Apresentação: explicar uma decisão de projeto e um erro que corrigiram | 10% |\n\n## Sugestão de cronograma\n\n| Semana | Conteúdo |\n|---|---|\n| 1 | Módulos 1–3: brick, ambiente, primeiro programa |\n| 2 | Módulo 4: motores e encoders |\n| 3 | Módulo 5: giroscópio; desafio 1.1 |\n| 4–5 | Módulo 6: sensor de linha, PD; desafio 2.1 |\n| 6 | Módulos 7–8: distância, botões, tempo; desafios 1.2–1.3 |\n| 7 | Módulos 11–13: simulador a fundo, organização do código |\n| 8–9 | Módulo 14: seguidor completo; desafios 2.2–2.5 |\n| 10 | Módulos 9–10: servos e câmera; desafio 1.4 |\n| 11–12 | Módulo 15: área de resgate; desafios 3.x |\n| (paralelo) | Módulos 12 e 16 para a equipe da Maze; desafios 4.x |\n| 13+ | Módulo 17 e projeto final |\n", "README.md": "# Curso: robôs de resgate com o brick Mariola\n\nDo primeiro motor girando até a prova completa da **RoboCupJunior Rescue Line** (com a área de\nresgate) e da **Rescue Maze**, usando as bibliotecas do Mariola e os simuladores.\n\n![Mariola](imagens/mariolaZero.jpg)\n\n## Para quem é\n\nPara alunos que já sabem o básico de Python (variáveis, `if`, `while`, funções, listas e\ndicionários). Não precisa saber eletrônica: o que for preciso do hardware está no módulo 1.\n\n## Como usar\n\n* Siga os módulos **em ordem**: cada um usa o que veio antes.\n* Cada tutorial tem um **programa pronto e testado** em [`codigos/`](codigos/). Rode, leia, mude.\n* Teste **primeiro no simulador**, depois no robô.\n* A [**referência das bibliotecas**](referencia/README.md) explica todos os métodos, quando usar\n  cada um e os cuidados. Consulte sempre.\n* Os exercícios no fim de cada módulo são o que fixa o conteúdo. Os\n  [desafios](18-desafios.md) juntam vários módulos.\n\n## Módulos\n\n### Parte 1 — Começando\n| | Módulo | Você vai aprender |\n|---|---|---|\n| 1 | [Conhecendo o brick Mariola](01-o-brick-mariola.md) | o que tem dentro, os conectores, o caminho de um comando |\n| 2 | [Ambiente, envio e execução](02-ambiente-e-envio.md) | instalar, mandar o programa, rodar pelo menu, ver os logs |\n| 3 | [O primeiro programa](03-primeiro-programa.md) | a estrutura de todo programa, `try/finally`, as regras de ouro |\n\n### Parte 2 — Atuadores e sensores\n| | Módulo | Você vai aprender |\n|---|---|---|\n| 4 | [Motores e encoders](04-motores-e-encoders.md) | velocidade × potência, andar distâncias, 4x4 com placas de motor |\n| 5 | [Giroscópio](05-giroscopio.md) | girar certo, andar reto, rampas; o controle proporcional |\n| 6 | [Sensor de linha](06-sensor-de-linha.md) | ler e calibrar o Pro1616, seguidores liga-desliga, P e PD, cores |\n| 7 | [Sensores de distância](07-sensores-de-distancia.md) | VL53L0X: vários sensores, parar na parede, seguir parede |\n| 8 | [Botões, tela, teclado e tempo](08-botoes-tela-teclado.md) | botão de início, para-choque, menu no robô, cronômetro |\n| 9 | [Servos inteligentes](09-servos-inteligentes.md) | IDs, calibração de posições, garra e caçamba sem derrubar a vítima |\n| 10 | [Câmera e visão](10-camera-e-visao.md) | achar vítimas e triângulos; do stub à câmera real |\n\n### Parte 3 — Simuladores e organização\n| | Módulo | Você vai aprender |\n|---|---|---|\n| 11 | [Simulador da Line](11-simulador-line.md) | janela, editor, juiz, semente, testes sem janela |\n| 12 | [Simulador da Maze](12-simulador-maze.md) | câmeras, LEDs de vítima, kits, mapas |\n| 13 | [Organizando o código](13-organizando-o-codigo.md) | camada de hardware, máquina de estados, depuração |\n\n### Parte 4 — Projetos\n| | Módulo | Você vai aprender |\n|---|---|---|\n| 14 | [Projeto Rescue Line](14-projeto-rescue-line.md) | verde, curvas de 90°, gap, obstáculo, rampa, chegada |\n| 15 | [Projeto área de resgate](15-projeto-area-de-resgate.md) | entrar, recolher, depositar nos triângulos, sair |\n| 16 | [Projeto Rescue Maze](16-projeto-rescue-maze.md) | mão direita, mapa interno, BFS, checkpoint |\n| 17 | [Do simulador para o robô](17-do-simulador-para-o-robo.md) | medir o robô, calibrar, checklist de competição |\n| 18 | [Desafios e projetos](18-desafios.md) | desafios por nível, projeto final, avaliação, cronograma |\n\n## O que tem nesta pasta\n\n```\ncurso/\n├── README.md                ← você está aqui\n├── 01-...md a 18-...md      ← os módulos\n├── referencia/              ← documentação de cada biblioteca (todos os métodos)\n├── codigos/                 ← os programas dos tutoriais (testados no simulador)\n│   ├── 01_ola_mariola/      02_motores/      03_giroscopio/    04_linha/\n│   ├── 05_distancia/        06_interface/    07_servos/        08_camera/\n│   └── 09_maze/\n├── mapas/                   ← mapas do curso (também em simuladorLine/mapas/)\n│   ├── curso_pista.json     (só retas e curvas: para treinar o PID)\n│   └── curso_area.json      (o robô começa na frente da área de resgate)\n└── imagens/\n```\n\n## Rodando os códigos do curso\n\nDe dentro da pasta do simulador (`simuladorLine` ou `simuladorMaze`), aponte para o programa:\n\n```bash\ncd simuladorLine\npython simulador.py --robo robo_esteira.json --programa ../curso/codigos/01_ola_mariola/main.py\n```\n\nCada programa diz, no comentário do começo, **qual simulador, robô e mapa** usar. Para rodá-los no\nrobô real, copie as bibliotecas que eles importam para dentro da pasta (módulo 2).\n\n## Convenções do curso\n\n* **Velocidades** de -100 a 100 (100 = velocidade de calibração do motor).\n* **Distâncias** em milímetros; **ângulos** em graus.\n* **`z()` positivo = esquerda** (anti-horário). O giroscópio do Mariola é positivo no horário:\n  os códigos trocam o sinal numa função só.\n* **Lados:** canal 0 do sensor de linha e TCS 1 ficam à **esquerda** do robô.\n", "codigos/01_ola_mariola/main.py": "\"\"\"Tutorial 1 — Olá, Mariola!\n\nAcende os LEDs, anda para frente 1,5 s, para e mostra quanto cada encoder contou.\nRoda igual no robô e no simulador:\n    python simulador.py --robo robo_esteira.json --programa CAMINHO/01_ola_mariola/main.py\n\"\"\"\nimport time\n\nfrom motores import Motores\n\nmotores = Motores(True)                       # True = cada comando já vai para a placa\nmotores.direcao_motor(2, Motores.INVERTIDO)   # o motor 2 está espelhado no robô\n\ntry:\n    motores.set_led_rgb_all(0, 80, 0)         # tudo verde: o programa começou\n    motores.reseta_angulo_motor(1)\n    motores.reseta_angulo_motor(2)\n\n    motores.velocidade_motores(40, 40)        # -100..100 (PID de velocidade)\n    inicio = time.time()\n    while time.time() - inicio < 1.5:\n        motores.estado()                      # lê os encoders sem mudar nada\n        print('encoders:', motores.angulo_motor(1), motores.angulo_motor(2))\n        time.sleep(0.25)\n\n    motores.velocidade_motores(0, 0)\n    time.sleep(0.3)\n    motores.estado()\n    print('andou (contagens):', motores.angulo_motor(1), motores.angulo_motor(2))\n    motores.set_led_rgb_all(0, 0, 80)         # azul: terminou\n    time.sleep(0.5)\nexcept KeyboardInterrupt:\n    print('Interrompido pelo usuário')\nfinally:\n    # acontece SEMPRE: no fim normal, no Ctrl+C e se der erro no meio\n    motores.para_motores()\n    motores.set_led_rgb_all(0, 0, 0)\n    print('Motores parados.')\n", "codigos/02_motores/anda_mm.py": "\"\"\"Tutorial 2a — andar uma distância certa usando o encoder.\n\nRobô de esteira (só os 2 motores do Mariola):\n    python simulador.py --robo robo_esteira.json --programa CAMINHO/02_motores/anda_mm.py\n\"\"\"\nimport math\nimport time\n\nfrom motores import Motores\n\nDIAMETRO = 40.0                      # mm: roda (ou polia da esteira). MEÇA no seu robô!\nCONTAGENS_POR_VOLTA = 17 * 34 * 2    # pulsos do encoder x redução x 2 (o Mariola conta as 2 bordas)\nMM_POR_CONTAGEM = math.pi * DIAMETRO / CONTAGENS_POR_VOLTA\n\nmotores = Motores(False)             # False: eu decido quando mandar (atualiza_motores)\nmotores.direcao_motor(2, Motores.INVERTIDO)\n\n\ndef andado_mm():\n    return (motores.angulo_motor(1) + motores.angulo_motor(2)) / 2 * MM_POR_CONTAGEM\n\n\ndef anda_mm(distancia, vel_max=50):\n    motores.estado()                 # pega a contagem atual antes de zerar\n    motores.reseta_angulo_motor(1)\n    motores.reseta_angulo_motor(2)\n    sentido = 1 if distancia > 0 else -1\n    while True:\n        falta = abs(distancia) - abs(andado_mm())\n        if falta <= 2:\n            break\n        # perto do fim vai mais devagar (controle proporcional simples)\n        vel = max(15, min(vel_max, falta * 0.5))\n        motores.velocidade_motores(sentido * vel, sentido * vel)\n        motores.atualiza_motores()   # envia E lê os encoders\n        time.sleep(0.01)\n    motores.velocidade_motores(0, 0)\n    motores.atualiza_motores()\n\n\ntry:\n    anda_mm(300)\n    time.sleep(0.5)\n    motores.estado()\n    print(f'pedi 300 mm, andou {andado_mm():.0f} mm')\n    anda_mm(-150)\n    time.sleep(0.5)\n    motores.estado()\n    print(f'pedi -150 mm, andou {andado_mm():.0f} mm')\nfinally:\n    motores.velocidade_motores(0, 0)\n    motores.atualiza_motores()\n", "codigos/02_motores/move_motor_angulo.py": "\"\"\"Tutorial 2b — girar as rodas um número exato de contagens (move_motores) e esperar terminar.\n\n    python simulador.py --robo robo_esteira.json --programa CAMINHO/02_motores/move_motor_angulo.py\n\"\"\"\nimport time\n\nfrom motores import Motores\n\nmotores = Motores(True)\nmotores.direcao_motor(2, Motores.INVERTIDO)\n\ntry:\n    motores.reseta_angulo_motor(1)\n    motores.reseta_angulo_motor(2)\n    # motor 1 e motor 2: velocidade 40, 1156 contagens (= 1 volta da roda neste robô)\n    motores.move_motores(40, 1156, 40, 1156)\n    # espera os dois pararem. estado() só LÊ: não reenvia a velocidade\n    time.sleep(0.1)\n    while True:\n        motores.estado()\n        if (motores.estado_motor(1) == Motores.PARADO and\n                motores.estado_motor(2) == Motores.PARADO):\n            break\n        time.sleep(0.02)\n    print('chegou:', motores.angulo_motor(1), motores.angulo_motor(2))\n    # IMPORTANTE: a velocidade 40 continua guardada na placa. Zere antes de mandar\n    # qualquer outro comando de motor, senão eles voltam a girar sem parar.\n    motores.velocidade_motores(0, 0)\n    time.sleep(0.5)\n    motores.estado()\n    print('depois de zerar:', motores.angulo_motor(1), motores.angulo_motor(2))\nfinally:\n    motores.para_motores()\n", "codigos/02_motores/tracao_4x4.py": "\"\"\"Tutorial 2c — robô 4x4: 2 motores no Mariola + 2 placas de controle de motor na SERIAL1.\n\n    python simulador.py --robo robo_4x4.json --programa CAMINHO/02_motores/tracao_4x4.py\n\"\"\"\nimport time\n\nfrom motores import Motores\nfrom placaControleMotor import PlacaControleMotor\nfrom portas import Portas\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\n\n# as placas de motor dividem a mesma porta serial: abra UMA vez e passe para todas\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nfrente_esq = PlacaControleMotor(barramento, 8)     # ID gravado na placa\nfrente_dir = PlacaControleMotor(barramento, 51)\nfrente_esq.reset()\nfrente_dir.reset()\nfrente_dir.direcao_motor(PlacaControleMotor.INVERTIDO)\n\n\ndef anda(ve, vd):\n    \"\"\"Mesma velocidade (-100..100) nas duas rodas de cada lado.\"\"\"\n    motores.velocidade_motores(ve, vd)\n    motores.atualiza_motores()\n    frente_esq.velocidade_motor(ve)\n    frente_dir.velocidade_motor(vd)\n\n\ntry:\n    frente_esq.reseta_angulo_motor()\n    motores.reseta_angulo_motor(1)\n    fim = time.time() + 1.5\n    while time.time() < fim:\n        anda(40, 40)               # reenviar sempre: as placas param após 5 s sem comando\n        time.sleep(0.02)\n    anda(0, 0)\n    time.sleep(0.3)\n    motores.estado()\n    # a placa conta em quadratura (x4): o dobro de contagens do Mariola para a mesma roda\n    print('Mariola (traseira esq.):', motores.angulo_motor(1))\n    print('Placa   (dianteira esq.):', frente_esq.angulo_motor())\n    fim = time.time() + 1.2\n    while time.time() < fim:\n        anda(-35, 35)              # gira no lugar para a esquerda\n        time.sleep(0.02)\nfinally:\n    anda(0, 0)\n", "codigos/03_giroscopio/gira_e_anda_reto.py": "\"\"\"Tutorial 3 — girar ângulos exatos e andar reto com o giroscópio.\n\n    python simulador.py --robo robo_esteira.json --programa CAMINHO/03_giroscopio/gira_e_anda_reto.py\n\"\"\"\nimport time\n\nfrom giroscopio import Giroscopio\nfrom motores import Motores\nfrom portas import Portas\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\ngiro = Giroscopio(Portas.SERIAL5)\n\nHORARIO_POSITIVO = True     # no Mariola o Z cresce girando no sentido horário\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(int(ve), int(vd))\n    motores.atualiza_motores()\n\n\ndef z():\n    \"\"\"Ângulo em graus, positivo = esquerda (anti-horário), sem voltar a zero em 360.\"\"\"\n    return -giro.le_angulo_z() if HORARIO_POSITIVO else giro.le_angulo_z()\n\n\ndef gira_para(alvo, tolerancia=1.5, tempo_max=4.0):\n    \"\"\"Gira no lugar até z() chegar no alvo (controle proporcional com velocidade mínima).\"\"\"\n    inicio = time.time()\n    while time.time() - inicio < tempo_max:\n        erro = alvo - z()\n        if abs(erro) <= tolerancia:\n            break\n        v = max(15, min(50, abs(erro) * 0.8))   # longe: rápido; perto: devagar\n        if erro < 0:\n            v = -v\n        anda(-v, v)                               # esquerda para trás, direita para frente\n        time.sleep(0.01)\n    anda(0, 0)\n\n\ndef anda_reto(segundos, vel=40):\n    \"\"\"Anda reto corrigindo a direção pelo giroscópio.\"\"\"\n    alvo = z()\n    inicio = time.time()\n    while time.time() - inicio < segundos:\n        erro = alvo - z()                         # + = robô virou para a direita\n        correcao = max(-15, min(15, erro * 2.0))\n        anda(vel - correcao, vel + correcao)\n        time.sleep(0.01)\n    anda(0, 0)\n\n\ntry:\n    print('Calibrando (robô parado!)...')\n    giro.calibra()\n    giro.reseta_z()\n    time.sleep(0.1)\n    print('z inicial:', z())\n\n    alvo = 0\n    for _ in range(4):                 # um quadrado: anda, gira 90° à esquerda\n        anda_reto(1.2)\n        alvo += 90                     # o alvo acumula: o erro de um giro não passa para o próximo\n        gira_para(alvo)\n        time.sleep(0.2)\n        print(f'alvo {alvo}°, giroscópio {z()}°')\nfinally:\n    anda(0, 0)\n", "codigos/04_linha/le_sensor.py": "\"\"\"Tutorial 4a — ver o que o sensor de linha Pro1616 enxerga.\n\nAnde com o robô (ou arraste no simulador, com o programa rodando) sobre branco, preto, verde e prata.\n    python simulador.py --programa CAMINHO/04_linha/le_sensor.py\n\"\"\"\nimport time\n\nfrom portas import Portas\nfrom sensorCorReflexao import CorReflexao\n\nsensor = CorReflexao(Portas.SERIAL6)\nsensor.usa_cores(['branco', 'preto', 'verde', 'vermelho', 'prata'])   # cores da Rescue Line\n\nfor _ in range(20):\n    ir = sensor.le_reflexao()           # 4 canais: 0 = preto, ~100 = branco (prata ~80: quem vê o prata é o TCS)\n    rgbc = [sensor.le_rgbc(s) for s in (1, 2, 3)]\n    print('IR', ir, '| TCS', rgbc, '| cores', sensor.cores())\n    time.sleep(0.5)\n", "codigos/04_linha/seguidor_liga_desliga.py": "\"\"\"Tutorial 4b — o seguidor mais simples: dois canais do meio, \"liga-desliga\".\n\nFunciona, mas balança muito e é lento. Compare com o seguidor_p.py.\n    python simulador.py --robo robo_esteira.json --mapa mapas/curso_pista.json --programa CAMINHO/04_linha/seguidor_liga_desliga.py\n\"\"\"\nimport time\n\nfrom motores import Motores\nfrom portas import Portas\nfrom sensorCorReflexao import CorReflexao\n\nPRETO = 50                     # abaixo disso o canal vê preto\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\nsensor = CorReflexao(Portas.SERIAL6)\nwhile not sensor.conectado:\n    time.sleep(0.01)\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(ve, vd)\n    motores.atualiza_motores()\n\n\ntry:\n    fim = time.time() + 40\n    while time.time() < fim:\n        ir = sensor.le_reflexao()\n        esq_preto = ir[1] < PRETO          # canal do meio à esquerda\n        dir_preto = ir[2] < PRETO          # canal do meio à direita\n        if esq_preto and not dir_preto:\n            anda(5, 35)                    # linha puxando para a esquerda\n        elif dir_preto and not esq_preto:\n            anda(35, 5)                    # linha puxando para a direita\n        else:\n            anda(30, 30)                   # os dois (ou nenhum): reto\n        time.sleep(0.01)\nfinally:\n    anda(0, 0)\n", "codigos/04_linha/seguidor_p.py": "\"\"\"Tutorial 4b — seguidor de linha proporcional (P) e proporcional-derivativo (PD).\n\nTroque KD para 0 e veja a diferença. Para na fita vermelha da chegada.\nRobô de esteira, pista do curso (só curvas, sem interseção):\n    python simulador.py --robo robo_esteira.json --mapa mapas/curso_pista.json --programa CAMINHO/04_linha/seguidor_p.py\n\"\"\"\nimport time\n\nfrom motores import Motores\nfrom portas import Portas\nfrom sensorCorReflexao import CorReflexao\n\nVEL = 35      # velocidade base\nKP = 1.4      # quanto corrige por mm de erro\nKD = 5.0      # quanto corrige pela VARIAÇÃO do erro (amortece o zigue-zague)\n\n# posição (mm, + = esquerda) de cada um dos 4 canais em relação ao centro do sensor\nY_CANAIS = [26.6, 8.9, -8.9, -26.6]\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\nsensor = CorReflexao(Portas.SERIAL6)\nsensor.usa_cores(['branco', 'preto', 'verde', 'vermelho', 'prata'])\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(int(max(-100, min(100, ve))), int(max(-100, min(100, vd))))\n    motores.atualiza_motores()\n\n\ndef posicao_linha():\n    \"\"\"Onde está a linha (mm, + = à esquerda do centro), ou None se não vê preto.\"\"\"\n    ir = sensor.le_reflexao()\n    pesos = [max(0, min(100, 100 - v)) / 100 for v in ir]   # 1 = preto, 0 = branco\n    if sum(pesos) < 0.3:\n        return None\n    return sum(p * y for p, y in zip(pesos, Y_CANAIS)) / sum(pesos)\n\n\nwhile not sensor.conectado:      # espera a primeira leitura chegar do sensor\n    time.sleep(0.01)\n\ndef eh_vermelho(tcs):\n    \"\"\"Vermelho no TCS 1, 2 ou 3. A lib classifica; o RGB confirma (com pouca luz, como em\n    cima da linha preta, a classificação sozinha às vezes erra).\"\"\"\n    r, g, b, c = sensor.le_rgbc(tcs)\n    return sensor.cor(tcs) == 'vermelho' and r > 1.8 * g and r > 1.8 * b and c > 20\n\n\ntry:\n    erro_anterior = 0.0\n    ultimo_lado = 1\n    fim = time.time() + 60\n    while time.time() < fim:\n        if sum(eh_vermelho(k) for k in (1, 2, 3)) >= 2:   # fita vermelha da chegada\n            print('Chegada!')\n            anda(0, 0)\n            time.sleep(6)                              # a regra pede mais de 5 s parado\n            break\n        pos = posicao_linha()\n        if pos is None:\n            # perdeu a linha: gira para o lado onde ela foi vista pela última vez\n            anda(-25 * ultimo_lado, 25 * ultimo_lado)\n        else:\n            erro = pos                          # queremos a linha no centro (0 mm)\n            correcao = KP * erro + KD * (erro - erro_anterior)\n            erro_anterior = erro\n            ultimo_lado = 1 if erro > 0 else -1\n            anda(VEL - correcao, VEL + correcao)    # linha à esquerda -> roda direita mais rápida\n        time.sleep(0.01)\nfinally:\n    anda(0, 0)\n", "codigos/05_distancia/le_distancias.py": "\"\"\"Tutorial 5a — vários VL53L0X no mux I2C, do jeito simples e do jeito rápido.\n\n    python simulador.py --programa CAMINHO/05_distancia/le_distancias.py\n\"\"\"\nimport time\n\nfrom portas import Portas\nfrom vl53 import VL53L0X\n\nsensores = {\n    'esquerda': VL53L0X(Portas.I2C1),\n    'direita': VL53L0X(Portas.I2C3),\n    'frente': VL53L0X(Portas.I2C5),\n}\n\n# 1) jeito simples: uma medida de cada vez (cada uma espera ~33 ms)\ninicio = time.time()\nfor nome, s in sensores.items():\n    print(nome, s.read_range_single_millimeters(), 'mm')\nprint(f'simples: {(time.time() - inicio) * 1000:.0f} ms para os 3')\n\n# 2) jeito rápido: pede a medida em todos, espera UMA vez e lê todos\ninicio = time.time()\nfor s in sensores.values():\n    s.solicita_leitura()\ntime.sleep(0.034)\nleituras = {nome: s.leitura_mm() for nome, s in sensores.items()}\nprint(leituras, f'rápido: {(time.time() - inicio) * 1000:.0f} ms para os 3')\n# 8190 (ou mais) = nada à vista dentro do alcance\n", "codigos/05_distancia/para_na_parede.py": "\"\"\"Tutorial 5b — andar até ficar a 80 mm de uma parede, desacelerando.\n\nUse o simulador da Maze (tem paredes por todo lado) com o robô de frente para uma parede:\n    python simulador.py --programa CAMINHO/05_distancia/para_na_parede.py\n\"\"\"\nimport time\n\nfrom motores import Motores\nfrom placaControleMotor import PlacaControleMotor\nfrom portas import Portas\nfrom vl53 import VL53L0X\n\nALVO = 80     # mm\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nplacas = [PlacaControleMotor(barramento, 8), PlacaControleMotor(barramento, 51)]\nplacas[1].direcao_motor(PlacaControleMotor.INVERTIDO)\nfrente = VL53L0X(Portas.I2C5)\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(int(ve), int(vd))\n    motores.atualiza_motores()\n    placas[0].velocidade_motor(int(ve))\n    placas[1].velocidade_motor(int(vd))\n\n\ntry:\n    frente.solicita_leitura()\n    while True:\n        time.sleep(0.035)\n        d = frente.leitura_mm()       # resultado da medida pedida na volta anterior\n        frente.solicita_leitura()     # já pede a próxima: o laço não fica esperando\n        falta = d - ALVO\n        if falta <= 0:\n            break\n        vel = max(12, min(50, falta * 0.3))\n        anda(vel, vel)\n    anda(0, 0)\n    time.sleep(0.5)\n    print('parei a', frente.read_range_single_millimeters(), 'mm da parede')\nfinally:\n    anda(0, 0)\n", "codigos/06_interface/botao_e_cronometro.py": "\"\"\"Tutorial 6a — esperar o botão de início, medir tempo e usar o para-choque.\n\nNo simulador o botão de início (P3) é apertado sozinho 1,5 s depois do programa subir\n(Auto-botão), ou aperte B. Simulador da Maze (tem paredes para o para-choque):\n    python simulador.py --programa CAMINHO/06_interface/botao_e_cronometro.py\n\"\"\"\nimport time\n\nfrom botoes import Botoes\nfrom cronometro import Cronometro\nfrom motores import Motores\nfrom placaControleMotor import PlacaControleMotor\nfrom portas import Portas\n\nBOTAO_INICIO = Botoes.P3\nPARA_CHOQUE_ESQ = Botoes.P1\nPARA_CHOQUE_DIR = Botoes.P2\n\nbotoes = Botoes()\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nplacas = [PlacaControleMotor(barramento, 8), PlacaControleMotor(barramento, 51)] if barramento else []\nif placas:\n    placas[1].direcao_motor(PlacaControleMotor.INVERTIDO)\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(ve, vd)\n    motores.atualiza_motores()\n    for placa, v in zip(placas, (ve, vd)):\n        placa.velocidade_motor(v)\n\n\ndef espera_botao(pino):\n    \"\"\"Espera apertar E soltar (assim o robô só sai quando o dedo já saiu do botão).\"\"\"\n    while not botoes.botao_pressionado(pino):\n        anda(0, 0)              # manda comando: o Mariola desliga tudo após 5 s sem pacote\n        time.sleep(0.05)\n    while botoes.botao_pressionado(pino):\n        time.sleep(0.02)\n\n\ntry:\n    print('Aperte o botão de início...')\n    espera_botao(BOTAO_INICIO)\n    relogio = Cronometro()\n    relogio.inicia()\n    print('Valendo! Andando até bater...')\n    while relogio.tempo() < 20000:                  # no máximo 20 s (tempo() é em ms)\n        esq = botoes.botao_pressionado(PARA_CHOQUE_ESQ)\n        dir_ = botoes.botao_pressionado(PARA_CHOQUE_DIR)\n        if esq or dir_:\n            print(f'bateu depois de {relogio.tempo()} ms (esquerdo={esq}, direito={dir_})')\n            break\n        anda(40, 40)\n        time.sleep(0.01)\n    anda(-30, -30)                                  # dá uma ré curta para soltar\n    time.sleep(0.4)\nfinally:\n    anda(0, 0)\n", "codigos/06_interface/menu_teclado.py": "\"\"\"Tutorial 6b — escolher o que o robô vai fazer pelo teclado do brick, com a tela OLED e os LEDs.\n\nPlaca da tela + teclado (conector TELA, barramento I2C 0):\n  botões, da esquerda para a direita: Voltar, Baixo, Cima, Enter\n  LEDs,   da esquerda para a direita: branco, vermelho, laranja, verde\nNo simulador a tela e o teclado aparecem no canto do mapa: clique nos botões ou use F1..F4.\n    python simulador.py --programa CAMINHO/06_interface/menu_teclado.py\n\"\"\"\nimport time\n\nfrom tela import Tela\nfrom teclado import Teclado\n\nOPCOES = ['Seguir linha', 'Calibrar cores', 'Testar garra', 'Sair']\nLED_BRANCO, LED_VERMELHO, LED_LARANJA, LED_VERDE = 1, 2, 3, 4\nLED_ACENDE_COM = 1      # o LED acende com o bit em 1 (Teclado() começa com os 4 apagados)\n\n\ndef abre_teclado():\n    \"\"\"O teclado fica no barramento 0 (placa nova, junto com a tela) ou no 1 (placa antiga).\"\"\"\n    for barramento in (0, 1):\n        try:\n            return Teclado(i2c_bus=barramento)\n        except OSError:\n            pass\n    raise RuntimeError('teclado não encontrado')\n\n\ndef led(numero, aceso):\n    teclado.altera_led(numero, LED_ACENDE_COM if aceso else 1 - LED_ACENDE_COM)\n\n\ndef apaga_leds():\n    for n in (1, 2, 3, 4):\n        led(n, False)\n\n\ndef apertou(botao):\n    \"\"\"True só uma vez por aperto (espera soltar).\"\"\"\n    if teclado.le_botao(botao) == Teclado.APERTADO:\n        while teclado.le_botao(botao) == Teclado.APERTADO:\n            time.sleep(0.02)\n        return True\n    return False\n\n\ndef mostra_menu(escolha):\n    tela.escreve('Escolha o programa:', 0)\n    for i in range(3):                      # 3 linhas de opções, a escolhida no meio quando dá\n        k = max(0, min(len(OPCOES) - 3, escolha - 1)) + i\n        tela.escreve(('> ' if k == escolha else '  ') + OPCOES[k], i + 1)\n\n\ntela = Tela()\nteclado = abre_teclado()\napaga_leds()\nled(LED_BRANCO, True)                       # branco: esperando escolha\nescolha = 0\nmostra_menu(escolha)\nfim = time.time() + 30\nwhile time.time() < fim:\n    if apertou(Teclado.BOTAO_BAIXO):\n        escolha = (escolha + 1) % len(OPCOES)\n        mostra_menu(escolha)\n    elif apertou(Teclado.BOTAO_CIMA):\n        escolha = (escolha - 1) % len(OPCOES)\n        mostra_menu(escolha)\n    elif apertou(Teclado.BOTAO_ENTER):\n        apaga_leds()\n        led(LED_VERDE, True)                # verde: escolhido\n        tela.limpa()\n        tela.escreve('Escolhido:', 0)\n        tela.escreve(OPCOES[escolha], 1)\n        print('escolhido:', OPCOES[escolha])\n        time.sleep(2)\n        break\n    elif apertou(Teclado.BOTAO_VOLTAR):\n        apaga_leds()\n        led(LED_VERMELHO, True)             # vermelho: cancelado\n        tela.limpa()\n        tela.escreve('Cancelado', 0)\n        print('cancelado')\n        time.sleep(2)\n        break\n    time.sleep(0.05)\napaga_leds()\n", "codigos/07_servos/busca_servos.py": "\"\"\"Tutorial 7a — descobrir quais servos inteligentes estão no barramento (e seus IDs).\n\nRobô 4x4 do simulador da Line (4 servos na SERIAL1, IDs 70 a 73):\n    python simulador.py --programa CAMINHO/07_servos/busca_servos.py\n\"\"\"\nfrom placaControleServo import PlacaControleServo\nfrom portas import Portas\n\nencontrados = PlacaControleServo.buscar_servos(Portas.SERIAL1)\nfor s in encontrados:\n    print(f\"ID {s['id']:3d}  potenciômetro em {s['posicao']}\")\n", "codigos/07_servos/testa_garra.py": "\"\"\"Tutorial 7b — mover os servos da garra e esperar cada movimento terminar.\n\nRobô 4x4 do simulador da Line:\n    python simulador.py --mapa mapas/resgate.json --programa CAMINHO/07_servos/testa_garra.py\n\"\"\"\nimport time\n\nfrom placaControleServo import PlacaControleServo\nfrom portas import Portas\n\n# IDs e posições (leitura do potenciômetro, 0..1023) — CALIBRE no seu robô\nBRACO, DEDO_ESQ, DEDO_DIR = 70, 71, 72\nBRACO_BAIXO, BRACO_ALTO = 820, 270\nESQ_ABERTO, ESQ_FECHADO = 380, 680\nDIR_ABERTO, DIR_FECHADO = 640, 340\n\nbraco = PlacaControleServo(Portas.SERIAL1, BRACO)\ndedo_esq = PlacaControleServo(Portas.SERIAL1, DEDO_ESQ)\ndedo_dir = PlacaControleServo(Portas.SERIAL1, DEDO_DIR)\n\n\ndef espera_chegar(servo, alvo, tolerancia=25, tempo_max=2.0):\n    \"\"\"Lê a posição SEM desligar o motor (consulta_posicao) até chegar perto do alvo.\"\"\"\n    inicio = time.time()\n    while time.time() - inicio < tempo_max:\n        pos = servo.consulta_posicao()\n        if pos is not None and abs(pos - alvo) <= tolerancia:\n            return True\n        time.sleep(0.02)\n    return False\n\n\ndef move_e_espera(servo, alvo, potencia=255):\n    servo.move_servo(alvo, potencia)\n    ok = espera_chegar(servo, alvo)\n    print(f'servo {servo.id_equipamento}: alvo {alvo}, está em {servo.consulta_posicao()}',\n          '' if ok else '(NÃO chegou: travou ou demorou)')\n\n\ntry:\n    move_e_espera(braco, BRACO_ALTO)\n    move_e_espera(dedo_esq, ESQ_ABERTO)\n    move_e_espera(dedo_dir, DIR_ABERTO)\n    move_e_espera(braco, BRACO_BAIXO, potencia=180)   # descer mais devagar\n    # fecha os dois dedos juntos: manda os dois e só depois espera\n    dedo_esq.move_servo(ESQ_FECHADO)\n    dedo_dir.move_servo(DIR_FECHADO)\n    espera_chegar(dedo_esq, ESQ_FECHADO)\n    espera_chegar(dedo_dir, DIR_FECHADO)\n    move_e_espera(braco, BRACO_ALTO)\n    # mantendo a posição: o servo desliga após 5 s sem nenhum pacote, então reenvie o comando\n    for _ in range(10):\n        braco.move_servo(BRACO_ALTO)\n        time.sleep(0.5)\n    print('braço ainda em', braco.consulta_posicao())\nfinally:\n    for s in (braco, dedo_esq, dedo_dir):\n        s.para_servo()            # potência 0 (o braço cai se não estiver todo levantado)\n", "codigos/08_camera/procura_vitima.py": "\"\"\"Tutorial 8 — usar a câmera (módulo visao) para achar uma vítima e chegar perto dela.\n\nNo simulador a câmera é um stub que já devolve as detecções (90% de acerto).\nNo robô real, copie simuladorLine/robo_real/visao.py e coloque a sua YOLO nele.\nMapa do curso: o robô começa na frente da entrada da área de resgate.\n    python simulador.py --mapa mapas/curso_area.json --programa CAMINHO/08_camera/procura_vitima.py\n\"\"\"\nimport time\n\nfrom giroscopio import Giroscopio\nfrom motores import Motores\nfrom placaControleMotor import PlacaControleMotor\nfrom portas import Portas\nfrom visao import Visao\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nplacas = [PlacaControleMotor(barramento, 8), PlacaControleMotor(barramento, 51)]\nplacas[1].direcao_motor(PlacaControleMotor.INVERTIDO)\ngiro = Giroscopio(Portas.SERIAL5)\ncamera = Visao()\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(int(ve), int(vd))\n    motores.atualiza_motores()\n    placas[0].velocidade_motor(int(ve))\n    placas[1].velocidade_motor(int(vd))\n\n\ndef z():\n    return -giro.le_angulo_z()            # + = esquerda\n\n\ndef gira(graus):\n    alvo = z() + graus\n    fim = time.time() + 3\n    while time.time() < fim and abs(alvo - z()) > 2:\n        v = max(18, min(45, abs(alvo - z()) * 0.8)) * (1 if alvo > z() else -1)\n        anda(-v, v)\n        time.sleep(0.01)\n    anda(0, 0)\n\n\ntry:\n    # entra na área: ~45 cm para frente\n    fim = time.time() + 2.5\n    while time.time() < fim:\n        anda(40, 40)\n        time.sleep(0.02)\n    anda(0, 0)\n\n    for tentativa in range(18):              # gira no máximo 360° em passos de 20°\n        vitimas = camera.vitimas()           # espera o próximo quadro da IA (~4 por segundo)\n        if vitimas:\n            break\n        gira(20)\n    else:\n        raise SystemExit('nenhuma vítima à vista')\n\n    alvo = vitimas[0]                         # a lista vem da mais perto para a mais longe\n    print(f'vi uma vítima {alvo.tipo} a {alvo.distancia} mm, {alvo.angulo:+.0f}°')\n    # aproxima: corrige o ângulo e anda até ~15 cm\n    perdidas = 0\n    while True:\n        vs = camera.vitimas()\n        if not vs:\n            # 90% de acerto: um quadro sem a vítima é normal. Continue andando (parado, a\n            # câmera vê a mesma cena e tende a errar de novo) e só desista depois de vários\n            perdidas += 1\n            if perdidas > 6:\n                print('perdi a vítima de vista')\n                break\n            continue\n        perdidas = 0\n        v = vs[0]\n        if v.distancia < 150:\n            print(f'cheguei: vítima {v.tipo} a {v.distancia} mm')\n            break\n        correcao = max(-20, min(20, v.angulo * 0.8))   # ângulo + = vítima à esquerda\n        anda(30 - correcao, 30 + correcao)\n    anda(0, 0)\n\n    for t in camera.triangulos():               # OpenCV: ~30 quadros por segundo\n        print(f'triângulo {t.cor}: {t.angulo:+.0f}°, parede a {t.distancia} mm')\nfinally:\n    anda(0, 0)\n", "codigos/09_maze/mao_direita.py": "\"\"\"Tutorial 9 — Maze: explorar seguindo a parede da direita, ladrilho a ladrilho.\n\nRegra da mão direita: se a direita está livre, vira para a direita; senão, se a frente está\nlivre, segue; senão, vira para a esquerda (ou meia-volta). Simples e funciona em labirintos\nsem \"ilhas\". Simulador da Maze:\n    python simulador.py --programa CAMINHO/09_maze/mao_direita.py\n\"\"\"\nimport math\nimport time\n\nfrom botoes import Botoes\nfrom giroscopio import Giroscopio\nfrom motores import Motores\nfrom placaControleMotor import PlacaControleMotor\nfrom portas import Portas\nfrom sensorCorReflexao import CorReflexao\nfrom vl53 import VL53L0X\n\nLADRILHO = 300                                    # mm\nMM_POR_CONTAGEM = math.pi * 70 / (17 * 34 * 2)    # roda de 70 mm, encoder do Mariola\nPAREDE_LADO = 150                                 # mm: menos que isso = tem parede\nPAREDE_FRENTE = 200\n\nmotores = Motores(False)\nmotores.direcao_motor(2, Motores.INVERTIDO)\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nplacas = [PlacaControleMotor(barramento, 8), PlacaControleMotor(barramento, 51)]\nplacas[1].direcao_motor(PlacaControleMotor.INVERTIDO)\ngiro = Giroscopio(Portas.SERIAL5)\ncor = CorReflexao(Portas.SERIAL6)\ncor.usa_cores(['branco', 'preto', 'prata', 'azul', 'vermelho'])\nvl = {'esquerda': VL53L0X(Portas.I2C1), 'direita': VL53L0X(Portas.I2C3), 'frente': VL53L0X(Portas.I2C5)}\nbotoes = Botoes()\ndirecao = 0.0          # direção desejada em graus do giroscópio (múltiplos de 90)\n\n\ndef anda(ve, vd):\n    motores.velocidade_motores(int(ve), int(vd))\n    motores.atualiza_motores()\n    placas[0].velocidade_motor(int(ve))\n    placas[1].velocidade_motor(int(vd))\n\n\ndef z():\n    return -giro.le_angulo_z()                    # + = esquerda\n\n\ndef distancias():\n    for s in vl.values():\n        s.solicita_leitura()\n    time.sleep(0.034)\n    return {nome: s.leitura_mm() for nome, s in vl.items()}\n\n\ndef gira(graus):\n    global direcao\n    direcao += graus                              # alvo acumulado: o erro não se soma\n    fim = time.time() + 4\n    while time.time() < fim:\n        err
