= sensor.le_rgbc(tcs)\n    return sensor.cor(tcs) == 'vermelho' and r > 1.8 * g and r > 1.8 * b and c > 20\n```\n\n* **Prata x lombada x rampa:** o prata se vê pelo TCS (C ~200, acima do branco). Mas quando o\n  sensor chega **mais perto** do chão (em cima da lombada, no pé da rampa) tudo clareia, o branco\n  também (~200 no TCS). Confirme o prata com os **3** TCS ao mesmo tempo (a fita da entrada é\n  larga), com os 4 canais de IR sem linha preta e sem estourar (no prata ~80) e com o giroscópio\n  (robô nivelado). Veja `eh_prata()` no `resgate.py` do exemplo da Line.\n* **Altura importa muito:** o ITR8307 muda bastante com poucos milímetros. Fixe bem o sensor.\n\n## Versão antiga (V1, `libs/sensorCorReflexao.py`)\n\n| V1 | V2 |\n|---|---|\n| 32 bytes, modos 0–5 (`set_modo`) | 16 bytes, comando único `0x61` |\n| `le_hsv` vinha do firmware (índices 20–28), `posicao()` (índice 29) | HSV calculado no Python; sem `posicao()` |\n| `detecta_cor` esperava branco > 230 | referências aprendidas (`aprende_cor`), branco ≈ 127 |\n| importa `from libs.cronometro`, `from libs.portas` | importa `from portas` |\n\n## No simulador\n\nO Pro1616 é emulado com os 12 ITR8307 e os 3 TCS na posição do `sensor_linha` do `robo*.json`,\ncom a curva de leitura × altura do ITR8307, os valores de cada material em `cores_piso` e a taxa\nde 50 Hz do firmware.\n", "referencia/tcs34725.md": "# `TCS34725` — sensor de cor avulso (I2C)\n\nArquivo: `libs/tcs34725.py` · `from tcs34725 import TCS34725`\n\n## Para que serve\n\nUm sensor de cor TCS34725 (o mesmo chip dos três que ficam no Pro1616), ligado **direto num\nconector I2C** do Mariola. Como ele não fica preso no sensor de linha, você o coloca onde quiser:\n\n* **Área de resgate:** sensores **horizontais** na frente e atrás do robô, na altura das paredes,\n  para conferir a **cor do triângulo** (verde/vermelho) antes de soltar as vítimas, ou a cor da\n  vítima na garra (prata = viva, preta = morta).\n* Um sensor de piso extra (ex.: atrás do robô).\n\n## Como funciona\n\n* Endereço fixo 0x29: um por conector I2C (o mux separa).\n* A lib liga o sensor com **ganho 4x** e tempo de integração `ATIME = 0xC0`, que dá **~154 ms por\n  medida** (64 ciclos × 2,4 ms; o comentário no código diz ~60 ms, mas a conta dá 154). Ler mais\n  rápido que isso devolve o mesmo valor.\n* Devolve os valores **crus** de 16 bits (0 a 65535), sem calibração. O LED branco do módulo\n  ilumina o alvo, então a leitura cai muito com a distância: o que vale é a **proporção** entre\n  R, G e B.\n\n## Métodos\n\n### `TCS34725(porta_mux)`\n```python\ntcs_tras = TCS34725(Portas.I2C7)\n```\nLiga o sensor no canal indicado (`ValueError` se o canal for inválido; `OSError` se não responder).\n\n### `le_valores()` → `(r, g, b, c)`\nSeleciona o canal e lê. `c` (clear) é a luz total.\n\n```python\nr, g, b, c = tcs_tras.le_valores()\nif c > 50 and g > 1.3 * r and g > 1.1 * b:\n    print('verde')\nelif c > 50 and r > 1.6 * g and r > 1.6 * b:\n    print('vermelho')\n```\n\n* **Quando usar:** sempre que precisar da cor de algo que não está no chão embaixo do sensor de\n  linha.\n* **Dica:** classifique pela proporção (`r/c`, `g/c`, `b/c`) e só aceite quando `c` passar de um\n  mínimo (perto o bastante).\n\n### Métodos internos\n`_select_channel()`, `_read_tcs_id()` (deve dar 0x44 ou 0x10), `_read_word(reg)`.\n\n## No simulador\n\n`tcs_i2c` no `robo_4x4.json` (frente I2C6, trás I2C7, altura e direção). Ele lê a cor do que está\nna frente na altura dele (parede, triângulo, vítima), mais fraco com a distância.\n", "referencia/teclado-tela.md": "# `Tela` e `Teclado` — a placa de interface do brick\n\nArquivos: `libs/tela.py`, `libs/teclado.py`\n\n![Placa da tela e do teclado](../imagens/tela_teclado.jpg)\n\nNo brick atual, a **tela OLED 128×64** e o **teclado** ficam numa **placa só**, ligada no\nconector **TELA** (barramento I2C 0). É ela que o **menu principal** usa para escolher e iniciar os\nprogramas. No seu programa, serve para escolher modos, mostrar valores dos sensores no campo, fazer\ncalibração sem computador e indicar estados com os LEDs.\n\n| Posição (da esquerda para a direita) | 1 | 2 | 3 | 4 |\n|---|---|---|---|---|\n| **Botão** | Voltar | Baixo | Cima | Enter |\n| Constante | `BOTAO_VOLTAR` | `BOTAO_BAIXO` | `BOTAO_CIMA` | `BOTAO_ENTER` |\n| **LED** (acima do botão) | branco | vermelho | laranja | verde |\n| Número em `altera_led` | 1 | 2 | 3 | 4 |\n\n| Chip | Endereço I2C | Barramento | Lib |\n|---|---|---|---|\n| OLED SSD1306 128×64 | 0x3C | 0 (conector TELA) | `tela.py` (via `luma.oled`) |\n| ATtiny1616 emulando um PCF8574A (botões + LEDs) | 0x38 | 0 (conector TELA) | `teclado.py` |\n\n> Os conectores TELA e TECLADO são I2C **sem proteção** e a 3,3 V: use só para a tela e o teclado.\n> Bricks com a placa antiga têm o teclado separado, no conector TECLADO (barramento 1).\n\n---\n\n## `Teclado(i2c_bus=1, i2c_address=0x38)`\n\n`from teclado import Teclado`\n\nPara o Raspberry/Banana Pi, o teclado é um expansor de I/O **PCF8574A**: um byte, um bit por\npino; pinos 0–3 = botões, 4–7 = LEDs. Na placa, quem faz esse papel é um **ATtiny1616** com um\nfirmware que imita o PCF8574A (`tecladoMariola.ino`):\n\n| Escreveu no bit | O pino fica | Serve para |\n|---|---|---|\n| **1** | entrada com pull-up | **ler um botão** (solto = 1, apertado = 0, o botão liga o pino ao GND) · LED **aceso** (o pull-up liga o transistor do LED) |\n| **0** | saída em nível baixo (GND) | LED **apagado** |\n\nA leitura devolve o nível **real** dos 8 pinos. Duas consequências:\n\n* os bits dos botões (0–3) têm que estar sempre em **1**. Se um deles for escrito com 0, o pino\n  vira saída em GND e aquele botão lê **sempre \"apertado\"**. A lib já cuida disso (`0x0F` no\n  início e `altera_led` só mexe nos bits 4–7);\n* o firmware não filtra o ruído do contato (*debounce*) nem guarda apertos: o que vale é o nível\n  do pino **no momento da leitura**. Um toque rápido entre duas leituras se perde.\n\n> **Atenção ao barramento:** o padrão da lib ainda é `i2c_bus=1` (placa antiga). Na placa atual,\n> tela e teclado juntos, use **`Teclado(i2c_bus=0)`**. O menu principal tenta o 1 e depois o 0;\n> faça o mesmo se o programa tiver que rodar nos dois tipos de brick:\n>\n> ```python\n> def abre_teclado():\n>     for barramento in (0, 1):\n>         try:\n>             return Teclado(i2c_bus=barramento)\n>         except OSError:\n>             pass\n>     raise RuntimeError('teclado não encontrado')\n> ```\n\n| Constante | Valor |\n|---|---|\n| `BOTAO_VOLTAR`, `BOTAO_BAIXO`, `BOTAO_CIMA`, `BOTAO_ENTER` | 1, 2, 3, 4 |\n| `APERTADO`, `LIBERADO` | 0, 1 |\n\n### `le_botao(botao)` → `Teclado.APERTADO` (0) ou `Teclado.LIBERADO` (1)\nBotão 1 a 4 (`ValueError` fora disso). Cada chamada lê o chip pelo I2C.\n\n### `altera_led(led, valor)`\nMuda o pino do LED 1 a 4 (`ValueError` fora disso) para o nível `valor` (0 ou 1).\n\n> **Qual nível acende?** O pino não liga o LED direto: ele vai à base de um **transistor NPN**,\n> e o LED fica entre o VCC e o coletor. Bit 1 (pull-up) liga o transistor e o LED, com o brilho\n> normal; bit 0 (GND) desliga. Então o LED **acende com 1** e apaga com 0, como diz a lib. Ao ligar o brick, o firmware deixa todos os bits em 1: **os quatro LEDs acendem** e ficam\n> assim até um programa iniciar o teclado. `Teclado()` escreve `0x0F` (LEDs em 0) e **apaga os\n> quatro**. Vale esconder o nível numa função, para o programa ficar legível e fácil de adaptar\n> a outra placa:\n>\n> ```python\n> LED_ACENDE_COM = 1\n> def led(numero, aceso):\n>     teclado.altera_led(numero, LED_ACENDE_COM if aceso else 1 - LED_ACENDE_COM)\n> ```\n\n**Usos dos LEDs:** cada cor um estado do programa (branco = esperando, laranja = calibrando,\nverde = rodando, vermelho = erro), confirmar um aperto, piscar no fim de uma calibração. Como estão\nna frente do robô, dá para ver o estado do programa **na pista**.\n\n**Usos dos botões:** escolher o modo (seguir linha / calibrar cores / testar garra), ajustar um\nvalor (+/−) no campo, confirmar cada etapa de uma calibração.\n\n* **Um evento por aperto:** depois de ver `APERTADO`, espere soltar antes de ler de novo:\n  ```python\n  def apertou(botao):\n      if teclado.le_botao(botao) == Teclado.APERTADO:\n          while teclado.le_botao(botao) == Teclado.APERTADO:\n              time.sleep(0.02)\n          return True\n      return False\n  ```\n* **Menu e programa ao mesmo tempo:** enquanto o seu programa roda, o menu principal fica\n  esperando, mas o **VOLTAR segurado por 2 s** continua sendo do menu (abre o menu desligar).\n\n---\n\n## `Tela(i2c_bus=0, i2c_address=0x3C)`\n\n`from tela import Tela`\n\nTela SSD1306 pela biblioteca `luma.oled` (e Pillow), com **4 linhas** de texto (fonte DejaVu\nSans 12). Lança erro se a tela não responder.\n\n| Método | Faz |\n|---|---|\n| `escreve(texto, linha=0)` | escreve na linha 0 a 3 e redesenha a tela |\n| `limpa(linha=-1)` | apaga uma linha, ou todas (`-1`) |\n| `apaga(linha)` | apaga uma linha (`ValueError` fora de 0–3) |\n| `linhas` | lista com o texto das 4 linhas |\n| `display` | o objeto `ssd1306` do luma (para desenhar o que quiser, abaixo) |\n\n```python\ntela = Tela()\ntela.escreve('Seguidor v3', 0)\ntela.escreve(f'IR {sensor.le_reflexao()}', 1)\n```\n\n> **Correção (17/10/2026):** o `_desenha()` usava `self.device`, mas o objeto se chama\n> `self.display`, e `escreve()`/`limpa()` davam `AttributeError`. A `libs/tela.py` já está\n> corrigida; atualize as cópias que estiverem nos seus projetos.\n\n### Desenhando livre (além das 4 linhas)\n```python\nfrom luma.core.render import canvas\nwith canvas(tela.display) as draw:            # ao sair do with, a imagem vai para a tela\n    draw.rectangle((0, 0, 127, 63), outline='white')\n    draw.text((4, 4), 'IR', fill='white')\n    for i, v in enumerate(sensor.le_reflexao()):\n        draw.rectangle((10 + i * 28, 60 - v // 4, 30 + i * 28, 60), fill='white')\n```\n(Depois disso, um `tela.escreve()` redesenha as 4 linhas por cima de tudo.)\n\n* **Desempenho:** cada atualização redesenha a tela inteira pelo I2C (dezenas de ms). **Não\n  atualize a tela dentro do laço do seguidor**; atualize poucas vezes por segundo, ou só fora do\n  laço.\n* **Dono da tela:** enquanto o seu programa roda, o menu principal não desenha. Ao terminar, ele\n  volta a desenhar.\n\n---\n\n## No simulador\n\nOs dois simuladores mostram a **frente do brick** no canto de baixo à direita do mapa: a tela, os\n4 LEDs (com as cores de verdade) e os 4 botões.\n\n* **Botões:** clique e segure com o mouse, ou use **F1–F4** (Voltar, Baixo, Cima, Enter).\n* **Tecla O:** esconde/mostra o painel.\n* A `tela.py` e a `teclado.py` rodam sem mudar. A tela usa o Pillow (`pip install pillow`), como\n  no robô; a fonte DejaVu, que no robô fica em `/usr/share/fonts`, vem junto com o simulador.\n* No `robo*.json`: `\"tela\": {\"barramento\": 0, \"endereco\": 60}` e\n  `\"teclado\": {\"barramento\": 0, \"endereco\": 56, \"leds_acendem_com\": 1}`. Para simular a placa\n  antiga (teclado no barramento 1), use `\"teclado\": true`.\n* Quando o programa (re)começa, a tela apaga e os LEDs voltam ao estado de quando o robô liga\n  (os quatro acesos).\n", "referencia/vl53.md": "# `VL53L0X` — sensor de distância a laser (I2C)\n\nArquivo: `libs/vl53.py` · `from vl53 import VL53L0X`\n\n## Para que serve\n\nMede a distância até o que está na frente dele, de ~3 cm a ~1,2–2 m, com precisão de poucos\nmilímetros, usando um laser infravermelho (tempo de voo). No robô:\n\n* **Line:** ver o obstáculo antes de bater; achar e seguir as paredes da área de resgate; o\n  sensor na garra que vê a vítima entre os dedos.\n* **Maze:** ver as paredes dos lados e da frente de cada ladrilho; centralizar no corredor;\n  alinhar com a parede (dois sensores do mesmo lado).\n\n## Como funciona\n\n* Cada sensor vai num conector **I2C1 a I2C8**. Todos têm o mesmo endereço; o multiplexador do\n  Mariola separa um do outro. A lib seleciona o canal antes de cada conversa.\n* O feixe é um **cone de ~25°**: o sensor \"vê\" uma mancha que cresce com a distância. Perto de uma\n  quina ou com o robô torto, ele pode ver a parede do lado.\n* Uma medida leva ~**33 ms**. Fora do alcance (nada à vista) ele devolve **8190** (ou 8191).\n* Ao iniciar, a lib muda o endereço do sensor de 0x29 para 0x30 (e descobre sozinha em qual dos\n  dois ele está na próxima vez).\n\n## Criando o objeto\n\n### `VL53L0X(porta_mux)`\n```python\nfrente = VL53L0X(Portas.I2C5)\n```\nFaz a inicialização completa (calibração interna, ~100 ms). Lança `ValueError` para canal\ninválido e `OSError` se o sensor não responder (\"Sensor não encontrado...\").\n\n* Crie todos os sensores **uma vez**, no começo.\n* Num robô onde o sensor pode não existir, use `try/except` (o exemplo da Line faz isso).\n\n## Ler a distância\n\n### `read_range_single_millimeters()` — o jeito simples\nDispara uma medida, **espera** (~33 ms) e devolve os mm.\n\n* **Quando usar:** testes, calibração, situações sem pressa. Para 3 sensores, são ~100 ms\n  parados.\n\n### `solicita_leitura()` + `leitura_mm()` — o jeito rápido\n`solicita_leitura()` dispara a medida e volta logo. `leitura_mm()` pega o resultado (se ainda não\nficou pronto, espera até ficar).\n\n```python\nfor s in sensores.values():          # dispara todos\n    s.solicita_leitura()\ntime.sleep(0.034)                    # UMA espera para todos\nd = {nome: s.leitura_mm() for nome, s in sensores.items()}\n```\n\nOu, dentro do laço de controle, sem nunca esperar:\n\n```python\nfrente.solicita_leitura()\nwhile True:\n    ...                               # segue linha, etc.\n    if time.time() - t_pedido > 0.036:\n        dist = frente.leitura_mm()    # medida pedida na volta anterior\n        frente.solicita_leitura()     # já pede a próxima\n        t_pedido = time.time()\n```\n\n* **Cuidado — leitura velha:** o valor de `leitura_mm()` é de quando a medida foi **pedida**. Se o\n  robô girou ou andou muito no meio, ela descreve o lugar antigo. Depois de um giro, descarte a\n  primeira leitura ou use `read_range_single_millimeters()`.\n\n### Modo contínuo\n`start_continuous(period_ms=0)` liga a medição automática (0 = uma atrás da outra; `period_ms` =\numa a cada N ms) e `read_range_continuous_millimeters()` lê a mais recente. `stop_continuous()`\ndesliga.\n\n* **Cuidado:** `start_continuous()` **não seleciona o canal do mux**. Com vários sensores, chame\n  `sensor.select_channel()` antes. Para vários sensores o par `solicita_leitura`/`leitura_mm` é\n  mais simples.\n\n### `timeout_occurred()`\n`True` se alguma espera passou do limite desde a última consulta (e limpa o aviso). As esperas\nlançam `TimeoutError` depois de 500 ms; trate com `try/except (OSError, TimeoutError)`.\n\n## Problemas no barramento\n\n### `recover()`\nFecha e reabre o canal do mux e reinicia o sensor. Use quando um sensor começar a dar `OSError`\n(cabo com mau contato, travou depois de um tranco):\n\n```python\ntry:\n    d = frente.read_range_single_millimeters()\nexcept (OSError, TimeoutError):\n    frente.recover()\n    d = 8190\n```\n\n### `select_channel()` · `close_channel()`\nSeleciona/fecha o canal no mux (as leituras já fazem isso).\n\n## Ajustes avançados\n\n| Método | O que faz |\n|---|---|\n| `set_measurement_timing_budget(us)` / `get_measurement_timing_budget()` | tempo de cada medida (padrão ~33000 µs). Maior = mais preciso e mais lento; menor (ex.: 20000) = mais rápido e mais ruidoso |\n| `set_signal_rate_limit(mcps)` | sinal mínimo aceito (padrão 0,25). Menor = alcança mais longe, aceita mais erro |\n| `set_i2c_address(addr)` | muda o endereço (a lib já cuida disso) |\n| `get_spad_info`, `perform_ref_calibration`, `load_tuning_settings`, `get_vcsel_pulse_period`, `write_byte`, `read_byte`… | uso interno da inicialização |\n\n## Receitas\n\n**Tem parede?** `d < 150` (Maze, com o sensor a ~5 cm da lateral do robô). Teste o limiar no\nseu robô: a parede do ladrilho vizinho fica a ~450 mm.\n\n**Ângulo em relação à parede** com dois sensores do mesmo lado, separados por `D` mm:\n`math.degrees(math.atan2(d_tras - d_frente, D))`.\n\n**Média contra ruído:** o VL53 varia alguns milímetros. Para alinhar, faça a média de 3–4 leituras.\n\n## Erros comuns\n\n| Sintoma | Causa provável |\n|---|---|\n| `OSError` / \"Sensor não encontrado\" | canal errado, cabo invertido, sensor sem energia |\n| Sempre 8190 | nada ao alcance, ou sensor tampado/sujo, ou alvo muito escuro/espelhado |\n| Distância \"pula\" perto de quinas | o cone pegou a outra parede |\n| Valor certo, mas do lugar antigo | leitura pedida antes de um giro |\n| O sensor não vê as vítimas | altura: um VL53 a 5 cm do chão passa por cima de uma bolinha de 4,5 cm |\n\n## No simulador\n\nFeixe em cone, ruído, 8190 fora do alcance, tempo de medida e **altura** de cada sensor (`vl53`\nno `robo*.json`: canal, posição, ângulo, altura). Os registradores do VL53L0X atrás do TCA9548A são\nemulados, então a lib faz a inicialização normalmente.\n"}, "imagens": {"imagens/brick.jpg": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAK8Ag0DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD0M4I6UhAp7elJjivsT80aKGrA+Wk4HzR4Vvp2quzCeDHfHWtUqGyrjKkYI9q575rS6kgY8A8Z7ivBzKh7OftI7M+xyPF+2o+yk9Y/kWI2LxkEfMnGKwr9TZ3gI4R+a2ZGKSCYdDwRUWpWwu   const TITULO = {};
  ORDEM.forEach(i => { TITULO[i.caminho] = i.titulo; });

  const idDe = c => c.replace(/\.md$/, '').replace(/\//g, '~');
  const caminhoDe = id => {
    const c = id.replace(/~/g, '/');
    if (ARQ[c + '.md'] !== undefined) return c + '.md';
    if (ARQ[c] !== undefined) return c;
    if (ARQ[c + '/README.md'] !== undefined) return c + '/README.md';
    return 'README.md';
  };
  const pasta = c => c.includes('/') ? c.slice(0, c.lastIndexOf('/') + 1) : '';
  function resolve(base, rel) {
    const partes = (pasta(base) + rel).split('/');
    const out = [];
    for (const p of partes) {
      if (p === '..') out.pop(); else if (p !== '.' && p !== '') out.push(p);
    }
    let r = out.join('/');
    if (rel.endsWith('/')) r += '/';
    return r;
  }
  const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // ---------------- trilha (menu lateral) ----------------
  const trilha = document.getElementById('trilha');
  trilha.innerHTML = PARTES.map(p => `
    <section class="parte"><h3>${esc(p.titulo)}</h3>
      <ul class="itens${p.trilho ? ' trilho' : ''}">
        ${p.itens.map(i => `<li><a href="#${idDe(i.caminho)}" data-c="${i.caminho}">
          ${i.n ? `<span class="n">${i.n}</span>` : '<span class="ponto"></span>'}
          <span>${esc(i.titulo)}</span></a></li>`).join('')}
      </ul></section>`).join('');

  // ---------------- markdown ----------------
  marked.use({ gfm: true });
  const texto = document.getElementById('texto');

  function linguagem(c) {
    if (c.endsWith('.py')) return 'python';
    if (c.endsWith('.json')) return 'json';
    return '';
  }

  function blocoCodigo(codigo, ling, rotulo) {
    let html;
    try {
      html = (ling && hljs.getLanguage(ling)) ? hljs.highlight(codigo, { language: ling }).value
                                               : esc(codigo);
    } catch (e) { html = esc(codigo); }
    return `<div class="codigo"><div class="rotulo"><span>${esc(rotulo || ling || 'texto')}</span>
      <button type="button" class="copiar">Copiar</button></div>
      <pre><code>${html}</code></pre></div>`;
  }

  function renderMarkdown(c, md) {
    const div = document.createElement('div');
    div.innerHTML = marked.parse(md);
    // tabelas com rolagem própria
    div.querySelectorAll('table').forEach(t => {
      const w = document.createElement('div'); w.className = 'tabela';
      t.replaceWith(w); w.appendChild(t);
    });
    // blocos de código
    div.querySelectorAll('pre > code').forEach(code => {
      const m = /language-(\w+)/.exec(code.className || '');
      const ling = m ? m[1] : '';
      const tmp = document.createElement('div');
      tmp.innerHTML = blocoCodigo(code.textContent.replace(/\n$/, ''), ling, ling);
      code.parentElement.replaceWith(tmp.firstElementChild);
    });
    // avisos de atenção
    div.querySelectorAll('blockquote').forEach(b => {
      if (/^\s*(Atenção|Cuidado|Correção)/i.test(b.textContent)) b.classList.add('atencao');
    });
    // imagens
    div.querySelectorAll('img').forEach(img => {
      const src = img.getAttribute('src');
      if (src && !/^(https?:|data:)/.test(src)) {
        const r = resolve(c, src);
        if (IMG[r]) img.src = IMG[r];
      }
      img.loading = 'lazy';
    });
    // links internos
    div.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (/^(https?:|mailto:)/.test(h)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      if (h.startsWith('#')) return;
      const r = resolve(c, h.split('#')[0]);
      a.href = '#' + idDe(r.replace(/\/$/, ''));
    });
    return div.innerHTML;
  }

  function listaPasta(p) {
    const arquivos = Object.keys(ARQ).filter(k => k.startsWith(p) && k !== p + 'README.md').sort();
    return arquivos.map(k => `- [\`${k.slice(p.length)}\`](${k.slice(p.length)})`).join('\n');
  }

  // ---------------- páginas ----------------
  function mostra(c) {
    let html = '';
    let titulo = TITULO[c];
    if (c.endsWith('.md')) {
      let md = ARQ[c];
      if (c.endsWith('README.md') && c !== 'README.md' && c !== 'referencia/README.md' && c !== 'codigos/README.md') {
        md += '\n\n' + listaPasta(pasta(c));
      }
      html = renderMarkdown(c, md);
      if (!titulo) { const m = /^#\s+(.+)$/m.exec(md); titulo = m ? m[1] : c; }
    } else if (ARQ[c] !== undefined) {
      titulo = c.split('/').pop();
      const voltar = ARQ[pasta(c) + 'README.md'] !== undefined ? pasta(c) + 'README.md' : 'codigos/README.md';
      html = `<div class="caminho">${esc(c)}</div><h1>${esc(titulo)}</h1>
        <p>Programa testado no simulador. Copie para uma pasta de projeto junto com as bibliotecas que ele importa.
        <a href="#${idDe(voltar)}">Ver os outros programas</a>.</p>` + blocoCodigo(ARQ[c], linguagem(c), c);
    } else {
      // pasta sem README: lista os arquivos
      const p = c.endsWith('/') ? c : c + '/';
      html = renderMarkdown(p + 'x.md', `# ${p}\n\n` + listaPasta(p));
      titulo = p;
    }
    // anterior / próximo (só para módulos e referência)
    const k = ORDEM.findIndex(i => i.caminho === c);
    if (k >= 0) {
      const ant = ORDEM[k - 1], prox = ORDEM[k + 1];
      html += `<nav class="passos" aria-label="Navegação entre páginas">
        ${ant ? `<a href="#${idDe(ant.caminho)}"><small>Anterior</small>${esc(ant.titulo)}</a>` : '<span></span>'}
        ${prox ? `<a class="prox" href="#${idDe(prox.caminho)}"><small>Próximo</small>${esc(prox.titulo)}</a>` : ''}
      </nav>`;
    }
    texto.innerHTML = html;
    document.title = (titulo && c !== 'README.md') ? `${titulo.replace(/^Módulo \d+ — /, '')} · Curso Mariola` : 'Curso Mariola';
    trilha.querySelectorAll('a').forEach(a => {
      if (a.dataset.c === c) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    const atual = trilha.querySelector('a[aria-current]');
    if (atual) atual.scrollIntoView({ block: 'nearest' });
    window.scrollTo(0, 0);
    fechaMenu();
  }

  function rota() {
    const id = decodeURIComponent((location.hash || '#README').slice(1));
    mostra(caminhoDe(id));
  }
  window.addEventListener('hashchange', rota);

  // copiar código
  texto.addEventListener('click', ev => {
    const b = ev.target.closest('button.copiar');
    if (!b) return;
    const code = b.closest('.codigo').querySelector('code');
    const ok = () => { b.textContent = 'Copiado'; setTimeout(() => { b.textContent = 'Copiar'; }, 1400); };
    const seleciona = () => {
      const r = document.createRange(); r.selectNodeContents(code);
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent = 'Selecionado: Ctrl+C';
    };
    try { navigator.clipboard.writeText(code.textContent).then(ok, seleciona); } catch (e) { seleciona(); }
  });

  // ---------------- menu no celular ----------------
  const botaoMenu = document.getElementById('botao-menu');
  function fechaMenu() { document.body.classList.remove('menu-aberto'); botaoMenu.setAttribute('aria-expanded', 'false'); }
  botaoMenu.addEventListener('click', () => {
    const aberto = document.body.classList.toggle('menu-aberto');
    botaoMenu.setAttribute('aria-expanded', String(aberto));
  });

  // ---------------- busca ----------------
  const busca = document.getElementById('busca');
  const resultados = document.getElementById('resultados');
  const indice = Object.keys(ARQ).map(c => {
    const t = ARQ[c];
    const m = c.endsWith('.md') ? /^#\s+(.+)$/m.exec(t) : null;
    return { c, titulo: TITULO[c] || (m ? m[1] : c), texto: t, baixo: t.toLowerCase() };
  });
  function procura(q) {
    q = q.trim().toLowerCase();
    if (q.length < 2) { resultados.hidden = true; return; }
    const achados = [];
    for (const d of indice) {
      const i = d.baixo.indexOf(q);
      const noTitulo = d.titulo.toLowerCase().includes(q);
      if (i < 0 && !noTitulo) continue;
      let trecho = '';
      if (i >= 0) {
        const ini = Math.max(0, i - 50);
        trecho = (ini > 0 ? '…' : '') + d.texto.slice(ini, i + q.length + 70).replace(/[#*`|>\n]+/g, ' ') + '…';
      }
      const n = d.baixo.split(q).length - 1;
      achados.push({ d, trecho, peso: (noTitulo ? 100 : 0) + n });
    }
    achados.sort((a, b) => b.peso - a.peso);
    resultados.innerHTML = achados.length
      ? achados.slice(0, 12).map(a => `<a href="#${idDe(a.d.c)}">${esc(a.d.titulo)}<small>${esc(a.trecho)}</small></a>`).join('')
      : '<div class="vazio">Nada encontrado. Tente o nome de um método (ex.: le_reflexao).</div>';
    resultados.hidden = false;
  }
  busca.addEventListener('input', () => procura(busca.value));
  busca.addEventListener('focus', () => procura(busca.value));
  resultados.addEventListener('click', () => { resultados.hidden = true; busca.value = ''; });
  document.addEventListener('click', ev => { if (!ev.target.closest('.busca')) resultados.hidden = true; });
  busca.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { resultados.hidden = true; busca.blur(); }
    if (ev.key === 'Enter') { const a = resultados.querySelector('a'); if (a) { location.hash = a.getAttribute('href'); resultados.hidden = true; busca.value = ''; } }
  });

  rota();
})();
</script>
