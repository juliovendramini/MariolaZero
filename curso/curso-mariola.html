o = direcao - z()\n        if abs(erro) < 1.5:\n            break\n        v = max(15, min(45, abs(erro) * 0.9)) * (1 if erro > 0 else -1)\n        anda(-v, v)\n        time.sleep(0.01)\n    anda(0, 0)\n\n\ndef avanca():\n    \"\"\"Anda um ladrilho reto. Para antes se a parede da frente chegar perto.\n    Retorna 'ok' ou 'preto' (ladrilho proibido: volta para onde estava).\"\"\"\n    motores.estado()\n    motores.reseta_angulo_motor(1)\n    motores.reseta_angulo_motor(2)\n    andado = 0.0\n    while andado < LADRILHO - 8:\n        motores.estado()\n        andado = (motores.angulo_motor(1) + motores.angulo_motor(2)) / 2 * MM_POR_CONTAGEM\n        if cor.cores().count('preto') >= 2:\n            anda(0, 0)\n            volta_mm(andado)\n            return 'preto'\n        if vl['frente'].read_range_single_millimeters() < 60:\n            break\n        correcao = max(-12, min(12, (direcao - z()) * 2.5))\n        anda(40 - correcao, 40 + correcao)\n    anda(0, 0)\n    time.sleep(0.1)\n    return 'ok'\n\n\ndef volta_mm(mm):\n    motores.estado()\n    motores.reseta_angulo_motor(1)\n    motores.reseta_angulo_motor(2)\n    while abs(motores.angulo_motor(1)) * MM_POR_CONTAGEM < mm:\n        anda(-35, -35)\n        time.sleep(0.01)\n        motores.estado()\n    anda(0, 0)\n\n\ndef espera(segundos):\n    \"\"\"Espera parado mandando comando (o Mariola solta os motores após 5 s sem pacote).\"\"\"\n    fim = time.time() + segundos\n    while time.time() < fim:\n        anda(0, 0)\n        time.sleep(0.2)\n\n\ntry:\n    while not botoes.botao_pressionado(Botoes.P3):\n        anda(0, 0)\n        time.sleep(0.05)\n    giro.reseta_z()\n    time.sleep(0.1)\n    inicio = time.time()\n    acabou_de_ver_preto = False\n    while time.time() - inicio < 120:             # 2 minutos de exploração\n        d = distancias()\n        if d['direita'] > PAREDE_LADO and not acabou_de_ver_preto:\n            gira(-90)\n        elif d['frente'] > PAREDE_FRENTE:\n            pass\n        elif d['esquerda'] > PAREDE_LADO:\n            gira(90)\n        else:\n            gira(180)\n        acabou_de_ver_preto = False\n        resultado = avanca()\n        if resultado == 'preto':\n            # o preto conta como parede. Sem lembrar disso, na próxima volta a direita\n            # estaria \"livre\" de novo e o robô entraria no preto para sempre\n            print('ladrilho preto: voltei')\n            gira(180)\n            acabou_de_ver_preto = True\n            continue\n        piso = cor.cor_piso()\n        if piso == 'azul':\n            print('azul: parado 5 s')\n            espera(5.5)\n        elif piso == 'prata':\n            print('checkpoint (prata)')\nfinally:\n    anda(0, 0)\n", "codigos/README.md": "# Programas dos tutoriais\n\nTodos foram testados nos simuladores (sem janela, 4x). O comentário do começo de cada arquivo diz\no simulador, o robô e o mapa. Rode de dentro da pasta do simulador:\n\n```bash\ncd simuladorLine     # ou simuladorMaze\npython simulador.py --programa ../curso/codigos/PASTA/ARQUIVO.py [--robo ...] [--mapa ...]\n```\n\n| Pasta / arquivo | Módulo | Simulador, robô, mapa | O que faz |\n|---|---|---|---|\n| `01_ola_mariola/main.py` | 3 | Line, `robo_esteira.json` | LEDs, anda 1,5 s, lê encoders, para no `finally` |\n| `02_motores/anda_mm.py` | 4 | Line, `robo_esteira.json` | anda 300 mm e volta 150 mm pelo encoder |\n| `02_motores/move_motor_angulo.py` | 4 | Line, `robo_esteira.json` | `move_motores` e a armadilha da velocidade guardada |\n| `02_motores/tracao_4x4.py` | 4 | Line, `robo_4x4.json` | Mariola + 2 placas de motor; encoder ×2 × ×4 |\n| `03_giroscopio/gira_e_anda_reto.py` | 5 | Line, `robo_esteira.json` | quadrado com giro proporcional e alvo acumulado |\n| `04_linha/le_sensor.py` | 6 | Line | mostra IR, RGBC e cores |\n| `04_linha/seguidor_liga_desliga.py` | 6 | Line, `robo_esteira.json`, `curso_pista.json` | seguidor de 2 estados (balança, perde a linha) |\n| `04_linha/seguidor_p.py` | 6 | Line, `robo_esteira.json`, `curso_pista.json` | seguidor PD; para na fita vermelha |\n| `05_distancia/le_distancias.py` | 7 | Line ou Maze | 3 VL53, leitura simples × rápida |\n| `05_distancia/para_na_parede.py` | 7 | Maze | para a 80 mm da parede |\n| `06_interface/botao_e_cronometro.py` | 8 | Maze | botão de início, anda até o para-choque |\n| `06_interface/menu_teclado.py` | 8 | Line ou Maze | menu na tela OLED com o teclado (clique ou F1–F4) e os LEDs |\n| `07_servos/busca_servos.py` | 9 | Line, `robo_4x4.json` | lista os servos do barramento |\n| `07_servos/testa_garra.py` | 9 | Line, `robo_4x4.json` | move braço e dedos esperando cada movimento |\n| `08_camera/procura_vitima.py` | 10 | Line, `robo_4x4.json`, `curso_area.json` | acha uma vítima pela câmera e chega perto |\n| `09_maze/mao_direita.py` | 16 | Maze | explora pela regra da mão direita, trata preto e azul |\n\nMapas do curso: `../mapas/` (também em `simuladorLine/mapas/`).\n\n**No robô real:** copie para a pasta do programa as bibliotecas que ele importa (de\n`bananaPiM4Zero/libs/`; o `sensorCorReflexao.py` da V2) e, se usar, `simdebug.py`/`visao.py` de\n`simuladorLine/robo_real/`.\n", "mapas/curso_area.json": "{\n \"formato\": \"simuladorLine/1\",\n \"regra\": \"RoboCupJunior Rescue Line 2026\",\n \"nome\": \"curso_area\",\n \"largura\": 6,\n \"altura\": 5,\n \"inicio\": [\n  2,\n  4,\n  0\n ],\n \"inicio_dir\": \"N\",\n \"tempo\": 480.0,\n \"ladrilhos\": [\n  {\n   \"x\": 0,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 0,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"tile-6\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 0,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 90\n  },\n  {\n   \"x\": 0,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 1,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 2,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 90\n  },\n  {\n   \"x\": 3,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 4,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"chegada\",\n   \"rot\": 180\n  },\n  {\n   \"x\": 0,\n   \"y\": 4,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 1,\n   \"y\": 4,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 2,\n   \"y\": 4,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 90\n  },\n  {\n   \"x\": 3,\n   \"y\": 4,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 4,\n   \"y\": 4,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 4,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  }\n ],\n \"zona_resgate\": {\n  \"x\": 1,\n  \"y\": 0,\n  \"larg\": 4,\n  \"alt\": 3,\n  \"entrada\": {\n   \"lado\": \"S\",\n   \"i\": 1\n  },\n  \"saida\": {\n   \"lado\": \"L\",\n   \"i\": 1\n  },\n  \"verde\": \"NO\",\n  \"vermelho\": \"NE\",\n  \"obstaculo\": null,\n  \"cor_parede\": [\n   200,\n   200,\n   205\n  ],\n  \"vitimas\": null,\n  \"falsas\": 0\n }\n}", "mapas/curso_pista.json": "{\n \"formato\": \"simuladorLine/1\",\n \"regra\": \"RoboCupJunior Rescue Line 2026\",\n \"nome\": \"curso_pista\",\n \"largura\": 6,\n \"altura\": 4,\n \"inicio\": [\n  0,\n  3,\n  0\n ],\n \"inicio_dir\": \"L\",\n \"tempo\": 480.0,\n \"ladrilhos\": [\n  {\n   \"x\": 0,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 1,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"tile-6\",\n   \"rot\": 270\n  },\n  {\n   \"x\": 2,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 3,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"tile-17\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 4,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"tile-6\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 0,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 0,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 1,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 90,\n   \"checkpoint\": true\n  },\n  {\n   \"x\": 2,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 3,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 4,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"tile-6\",\n   \"rot\": 180\n  },\n  {\n   \"x\": 5,\n   \"y\": 1,\n   \"z\": 0,\n   \"tipo\": \"tile-6\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 0,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 1,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"chegada\",\n   \"rot\": 180\n  },\n  {\n   \"x\": 2,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 3,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 4,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"branco\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 2,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 90,\n   \"checkpoint\": true\n  },\n  {\n   \"x\": 0,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 1,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 2,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-13\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 3,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-8\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 4,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-0\",\n   \"rot\": 0\n  },\n  {\n   \"x\": 5,\n   \"y\": 3,\n   \"z\": 0,\n   \"tipo\": \"tile-6\",\n   \"rot\": 90\n  }\n ]\n}", "referencia/README.md": "# Referência das bibliotecas do Mariola\n\nCada página explica **todos os métodos** da biblioteca, **para que** cada um serve, **quando**\nusar e os **cuidados** que evitam horas de depuração. Os tutoriais (módulos 3 a 10) mostram as\nmesmas bibliotecas sendo usadas passo a passo.\n\n## Por biblioteca\n\n| Biblioteca | Página | Liga em |\n|---|---|---|\n| `portas.py` — `Portas` | [portas](portas.md) | — (nomes das portas) |\n| `motores.py` — `Motores` | [motores](motores.md) | interno (placa do Mariola) |\n| `placaControleMotor.py` — `PlacaControleMotor` | [placaControleMotor](placaControleMotor.md) | SERIAL (barramento) |\n| `placaControleServo.py` — `PlacaControleServo` | [placaControleServo](placaControleServo.md) | SERIAL (barramento) |\n| `giroscopio.py` — `Giroscopio` | [giroscopio](giroscopio.md) | SERIAL |\n| `sensorCorReflexao.py` (V2) — `CorReflexao` | [sensorCorReflexao](sensorCorReflexao.md) | SERIAL |\n| `vl53.py` — `VL53L0X` | [vl53](vl53.md) | I2C |\n| `tcs34725.py` — `TCS34725` | [tcs34725](tcs34725.md) | I2C |\n| `bno085.py` — `BNO085` | [bno085](bno085.md) | I2C |\n| `placaMuxVl53l0x.py`, `placaMuxTCS34725.py` | [placasMux](placasMux.md) | SERIAL |\n| `botoes.py` — `Botoes` | [botoes](botoes.md) | PINOS DIGITAIS |\n| `pinosDigitais.py` — `PinosDigitais` | [pinosDigitais](pinosDigitais.md) | PINOS DIGITAIS |\n| `teclado.py`, `tela.py` | [teclado-tela](teclado-tela.md) | TECLADO, TELA |\n| `cronometro.py` — `Cronometro` | [cronometro](cronometro.md) | — |\n| Lidar, controle Bluetooth, câmera | [extras](extras.md) | SERIAL, USB |\n| `simdebug`, `visao`, `deteccaoVitimas`, `dispensadorKits` | [modulos-simulador](modulos-simulador.md) | — |\n\n## Por tarefa: \"eu quero...\"\n\n| Quero... | Use |\n|---|---|\n| andar, girar, controlar a velocidade das rodas | `Motores.velocidade_motores` (+ `PlacaControleMotor.velocidade_motor` no 4x4) |\n| andar uma distância certa | encoder: `Motores.estado()` + `angulo_motor()`, ou `move_motores` |\n| girar 90° certinho / andar reto | `Giroscopio.le_angulo_z()` |\n| saber se estou numa rampa | `Giroscopio.le_angulo_x()` |\n| seguir a linha | `CorReflexao.le_reflexao()` |\n| ver o verde / o vermelho / o prata no chão | `CorReflexao.cores()` (+ confirmar no `le_rgbc`) |\n| saber a cor do piso na Maze | `CorReflexao.cor_piso()` |\n| ver obstáculo / parede | `VL53L0X` (frente, lados), `Botoes` (para-choque) |\n| ver a cor de uma parede / triângulo | `TCS34725` horizontal |\n| mover a garra e saber se chegou | `PlacaControleServo.move_servo` + `consulta_posicao` |\n| achar as vítimas | `visao.Visao().vitimas()` (Line), `DeteccaoVitimas` (Maze) |\n| esperar o botão de início | `Botoes.botao_pressionado(Botoes.P3)` |\n| mostrar algo no robô | LEDs (`Motores.set_led_rgb_*`), `Tela`, LEDs do `Teclado` |\n| escolher um modo sem computador | `Teclado` + `Tela` |\n| medir tempo / lembrar o tempo após reiniciar | `Cronometro` (com arquivo) |\n| ver no simulador o que o programa pensa | `simdebug` |\n\n## Regras que valem para todas\n\n1. **Crie cada objeto uma vez**, no começo, e reaproveite. Cada criação abre porta, reinicia\n   sensor, cria thread.\n2. **Copie as libs para a pasta do projeto.** O programa importa `from motores import Motores`:\n   o arquivo tem que estar ao lado do `main.py` no robô. No simulador, se não estiver, ele usa a\n   cópia `libs_mariola/`.\n3. **Os sensores na serial têm thread**: a leitura é instantânea, devolve o último valor. Os\n   sensores I2C (VL53, TCS, BNO085) leem **quando você chama** e demoram.\n4. **5 segundos sem comando** e o Mariola e as placas desligam os motores (o Mariola também apaga\n   os LEDs). Espere em laço, mandando comando.\n5. **Pare tudo no `finally`**, para o robô não sair andando se o programa der erro.\n", "referencia/bno085.md": "# `BNO085` — IMU de 9 eixos com fusão de sensores (I2C)\n\nArquivo: `libs/bno085.py` · `from bno085 import BNO085`\n\n## Para que serve\n\nO BNO085 tem acelerômetro, giroscópio e magnetômetro e **um processador que junta os três**\n(fusão), entregando a orientação pronta em quaternion. É uma alternativa à placa do giroscópio na\nserial, ligada num conector **I2C** do Mariola:\n\n* rumo (yaw), arfagem (pitch) e rolagem (roll) em graus;\n* aceleração (m/s²), velocidade angular (rad/s), campo magnético (µT);\n* aceleração linear (sem a gravidade) e o vetor da gravidade, se habilitar.\n\n## Como funciona\n\nA lib implementa uma versão simplificada do protocolo SHTP/SH-2: reseta o sensor, confere o ID e\nhabilita os relatórios padrão (vetor de rotação, acelerômetro, giroscópio e magnetômetro a 50 Hz).\nO sensor vai **acumulando pacotes**; cada `le_valores()` processa os que chegaram e guarda o mais\nrecente de cada tipo.\n\n## Métodos\n\n### `BNO085(porta_mux, endereco=None)`\n```python\nimu = BNO085(Portas.I2C2)          # endereço 0x4A (0x4B se o pino ADR estiver em alto)\n```\nLeva ~1 s (reset do sensor). `OSError` se não responder.\n\n### `le_valores(timeout_ms=50, max_pacotes=20)` → `dict`\nProcessa os pacotes pendentes (no máximo `timeout_ms` e `max_pacotes`) e devolve:\n\n```python\n{'aceleracao': (x, y, z), 'giroscopio': (x, y, z), 'magnetometro': (x, y, z),\n 'aceleracao_linear': (x, y, z), 'gravidade': (x, y, z),\n 'quaternion': (i, j, k, real), 'euler': (yaw, pitch, roll)}\n```\n\n* **Quando usar:** no laço, de preferência com frequência (se ficar muito tempo sem ler, os\n  pacotes se acumulam e você lê valores atrasados).\n\n### `euler()` → `(yaw, pitch, roll)` em graus, do último quaternion\nO yaw vai de -180 a 180 (dá a volta). Para girar, trate a passagem por ±180 (ex.: erro =\n`(alvo - yaw + 180) % 360 - 180`).\n\n### `habilita_relatorio(id_relatorio, intervalo_us=None)`\nLiga outro relatório: `REPORT_ACELERACAO_LINEAR`, `REPORT_GRAVIDADE`,\n`REPORT_VETOR_ROTACAO_JOGO` (rotação sem magnetômetro — **melhor dentro de um prédio cheio de\nferro e motores**, pois não é puxada pelo campo magnético), etc. Intervalo em µs (20000 = 50 Hz).\n\n* **Cuidado:** relatórios demais ou rápidos demais enchem o buffer mais rápido do que a lib\n  consegue ler através do mux.\n\n### `recover()` · `select_channel()` · `close_channel()`\nRecuperar o sensor depois de erro no barramento; selecionar/fechar o canal do mux.\n\n## Giroscópio serial x BNO085\n\n| | `Giroscopio` (serial) | `BNO085` (I2C) |\n|---|---|---|\n| Z/yaw | acumula (720° = 2 voltas) | -180 a 180 |\n| Leitura | thread automática | você chama `le_valores()` |\n| Extras | — | aceleração, magnetômetro, gravidade |\n\n## No simulador\n\n**Não é emulado.** Para usar o mesmo programa nos dois, use o `Giroscopio` no simulador ou\nesconda o sensor atrás de uma função sua (`def rumo(): ...`).\n", "referencia/botoes.md": "# `Botoes` — botões e chaves nos pinos digitais\n\nArquivo: `libs/botoes.py` · `from botoes import Botoes`\n\n## Para que serve\n\nLer **botões e chaves de contato** ligados nos conectores **PINOS DIGITAIS 1 a 8** (pinagem GND +\nPINO; aceitam 5 V e têm proteção). Usos:\n\n* **botão de início** da rodada (a regra pede que o robô comece com um toque);\n* **para-choque**: duas chaves na frente do robô para saber que bateu (e de que lado);\n* chave de fim de curso de um mecanismo.\n\n## Como funciona\n\nOs pinos são linhas GPIO do Banana Pi (`/dev/gpiochip0`), lidas pela biblioteca `gpiod`. Os\npinos têm *pull-up*: **solto = nível alto, apertado (ligado ao GND) = nível baixo**. Por isso as\nconstantes parecem \"ao contrário\": `LIBERADO = ACTIVE` e `APERTADO = INACTIVE`.\n\nLigue o botão entre o PINO e o GND do mesmo conector.\n\n## Constantes\n\n| Constante | Significado |\n|---|---|\n| `Botoes.P1` … `Botoes.P8` | os 8 pinos (números das linhas GPIO; use sempre o nome) |\n| `Botoes.APERTADO`, `Botoes.LIBERADO` | o que `le_botao` devolve |\n\n## Métodos\n\n### `Botoes()`\nReserva os 8 pinos como entrada.\n\n* **Cuidado:** só pode haver **um** dono de cada pino. Não crie dois `Botoes()`, nem `Botoes()` e\n  `PinosDigitais()` no mesmo programa (o segundo dá erro \"Device or resource busy\"). A classe\n  `Lidar` cria um `PinosDigitais` por dentro quando recebe `pino_liga`. Se precisar de entradas\n  **e** saídas, use só [`PinosDigitais`](pinosDigitais.md), que tem os mesmos métodos.\n\n### `botao_pressionado(pino)` → `True`/`False`\n**O método do dia a dia.**\n\n```python\nif botoes.botao_pressionado(Botoes.P1):\n    print('bateu do lado esquerdo')\n```\n\n### `le_botao(pino)` → `Botoes.APERTADO` ou `Botoes.LIBERADO`\nO mesmo, devolvendo o nível. `ValueError` para pino inválido.\n\n## Receitas\n\n**Esperar o botão de início (apertar e soltar):**\n```python\nwhile not botoes.botao_pressionado(Botoes.P3):\n    motores.estado()          # mantém o Mariola acordado (timeout de 5 s)\n    time.sleep(0.05)\nwhile botoes.botao_pressionado(Botoes.P3):\n    time.sleep(0.02)\n```\nEsperar soltar evita que o robô saia com a mão do juiz ainda em cima dele.\n\n**Um evento por aperto (para menus):** depois de detectar o aperto, espere soltar antes de ler de\nnovo. Sem isso, um aperto de 200 ms vira 20 eventos.\n\n**Para-choque:** os dois apertados = robô encostado reto na parede (ótimo para alinhar na Maze).\n\n## No simulador\n\n`botao_inicio` (P3) e `para_choque` (P1 esquerdo, P2 direito) no `robo*.json`. O botão de início\né apertado sozinho 1,5 s depois do programa subir (**Auto-botão**) ou com a tecla **B**.\n", "referencia/cronometro.md": "# `Cronometro` — medir tempo (e lembrar dele depois de reiniciar)\n\nArquivo: `libs/cronometro.py` · `from cronometro import Cronometro`\n\n## Para que serve\n\nMedir quanto tempo passou, em **milissegundos**, de um jeito legível:\n\n* \"fiquei 5 s parado no azul?\", \"faz quanto tempo que perdi a linha?\";\n* limitar o tempo de uma manobra (girar no máximo 3 s);\n* saber quanto falta da rodada de 8 minutos — **mesmo depois de o programa reiniciar** num LoP,\n  se o cronômetro tiver um arquivo.\n\n## Métodos\n\n### `Cronometro(nome_arquivo=None)`\nSem arquivo: cronômetro comum. Com arquivo: cada `inicia()`/`reseta()` grava o instante de início\nnele, e `carrega()` recupera.\n\n### `inicia()` · `reseta()`\nComeça a contar a partir de agora (e grava, se tiver arquivo). Os dois fazem o mesmo.\n\n### `tempo()` → ms desde o início (ou `None` se nunca iniciou)\n\n### `carrega()`\nLê o início do arquivo. Se o arquivo não existe ou está estragado, **inicia agora** e grava.\n\n### `salva()` · `apaga()`\nGrava o início no arquivo / apaga o arquivo (`rm`).\n\n## Receitas\n\n**Tempo máximo de uma manobra:**\n```python\nc = Cronometro()\nc.inicia()\nwhile c.tempo() < 3000 and not achou_linha():\n    ...\n```\n\n**Relógio da rodada que sobrevive a um reinício:**\n```python\nrodada = Cronometro('/home/banana/rodada.txt')\nif comecando_rodada_nova:          # ex.: escolhido no menu, ou o arquivo é de outra rodada\n    rodada.inicia()\nelse:\n    rodada.carrega()               # LoP: o programa reiniciou, o tempo continua\nif rodada.tempo() > 6.5 * 60 * 1000:\n    print('hora de voltar para o início')\n```\n\n* **Cuidado:** o tempo vem do relógio do Linux (`time.time()`). Se o relógio do brick mudar no meio\n  (sincronizou pela internet), a conta pula. Num arquivo de checkpoint, guarde também o instante e\n  confira se ele faz sentido (o exemplo da Maze descarta checkpoint com mais de 8 minutos).\n* Com a partição principal somente leitura, grave os arquivos na sua pasta em `/home/banana/`.\n\n## No simulador\n\n`time.time()` segue o relógio simulado, então o `Cronometro` também (pausa, 4x, etc.).\n", "referencia/extras.md": "# Bibliotecas dos exemplos: Lidar, controle Bluetooth e câmera\n\nEstas bibliotecas ficam junto dos exemplos (não na pasta `libs/`). Copie para o seu projeto.\n\n---\n\n## `Lidar` — lidar 360° (protocolo Neato XV-11)\n\nArquivo: `exemplos/06-lidar/sensorLidar.py` · `from sensorLidar import Lidar`\n\nUm lidar giratório que mede a distância em **todos os ângulos** (0 a 359°), de 100 a 3000 mm.\nÚtil para mapear paredes em volta do robô, achar a saída da área de resgate, ver obstáculos.\n\n| Método / propriedade | Faz |\n|---|---|\n| `Lidar(porta_serial, pino_liga=None)` | abre a serial (115200). `pino_liga` (ex.: `PinosDigitais.P7`) liga o motor do lidar por um relé |\n| `liga()` / `desliga()` | liga/desliga o motor pelo pino |\n| `pontos(angulo_inicio=0, angulo_fim=359)` | lista `[(angulo, distancia_mm), ...]` só com leituras válidas. Início > fim cruza o 0° (ex.: 340 a 20) |\n| `velocidade` | rotação do motor em RPM |\n| `conectado` | `True` se chegaram dados nos últimos 2 s |\n| `fechar()` | para a thread, desliga o motor e fecha a serial |\n\n```python\nlidar = Lidar(Portas.SERIAL6, pino_liga=PinosDigitais.P7)\nfrente = lidar.pontos(340, 20)\n```\n\n* Com `pino_liga`, a classe cria um `PinosDigitais` por dentro: não crie `Botoes()` no mesmo\n  programa (use `PinosDigitais` para tudo).\n* Não é emulado no simulador.\n\n---\n\n## `ControleRemotoBluetooth` — dirigir o robô pelo celular\n\nArquivo: `exemplos/12-controleRemotoBluetooth/controleRemotoBluetooth.py`\n\nLê um módulo **HC-05** (Bluetooth serial, 9600 baud) com o app Android **BT Controller** no modo\nanalógico. Bom para testar mecânica (tração, garra) e para demonstrações.\n\n| Método / propriedade | Faz |\n|---|---|\n| `ControleRemotoBluetooth(porta, leitura_continua=True)` | abre a porta; com leitura contínua uma thread atualiza os valores |\n| `frente_tras` | -100 (ré) a +100 (frente) |\n| `esquerda_direita` | -100 (esquerda) a +100 (direita) |\n| `estado()` | `{'frente_tras': ..., 'esquerda_direita': ...}` |\n| `ler()` | lê um pacote (quando `leitura_continua=False`) |\n| `parar()` | para a thread e fecha a porta |\n\n```python\ne = ctrl.estado()\nmotores.potencia_motores(e['frente_tras'] + e['esquerda_direita'],\n                         e['frente_tras'] - e['esquerda_direita'])\n```\n\n---\n\n## Câmera\n\nOs exemplos de `exemplos/camera/` mostram, em ordem:\n\n| Pasta | O que ensina |\n|---|---|\n| `01-streamingVLC` | transmitir a imagem da câmera (Flask) para ver no navegador/VLC em `http://IP:8080/video` (atraso de alguns segundos) |\n| `02-processamentoIAStreaming` | rodar a IA (PyTorch) e transmitir a imagem com as detecções |\n| `03-posicionamentoDeteccao` | detectar com YOLO e marcar posição e área de cada objeto |\n| `03-posicionamentoDeteccaoONNX` / `NCNN` | o mesmo sem PyTorch: OpenCV DNN com ONNX, ou NCNN — inicia muito mais rápido e roda melhor no Banana Pi (instruções de conversão do modelo no próprio arquivo) |\n| `04-detectandoPadraoObjetos` | OpenCV: achar retângulos de uma cor (contornos) |\n| `05-usandoThreads` | capturar em uma thread e processar em outra (sempre o quadro mais novo) |\n| `06-projetoSalvaFotos` | salvar fotos originais e processadas para treinar a rede de novo e ver onde ela errou |\n| `07-detectandoAreas` | achar áreas de uma cor por faixa HSV (ex.: os triângulos verde e vermelho) |\n\nPara a área de resgate, o simulador da Line define uma interface simples (`visao`), descrita em\n[módulos do simulador](modulos-simulador.md). No robô, `simuladorLine/robo_real/visao.py` tem o\nesqueleto com a mesma interface: é onde você encaixa a YOLO e o OpenCV desses exemplos.\n", "referencia/giroscopio.md": "# `Giroscopio` — placa do giroscópio na serial\n\nArquivo: `libs/giroscopio.py` · `from giroscopio import Giroscopio`\n\n## Para que serve\n\nSaber **para onde o robô está virado** (ângulo Z, em graus) e **se ele está inclinado** (X e Y:\nrampa, lombada, gangorra). É o sensor mais importante para:\n\n* girar ângulos exatos (90°, 180°) sem depender do encoder (que patina);\n* andar reto (corrigir o desvio);\n* atravessar gap na Rescue Line, manter a direção na área de resgate;\n* saber em que direção do labirinto o robô está, na Maze.\n\nA placa do giroscópio (com seu próprio microcontrolador) faz a integração e manda os ângulos\nprontos pela serial (115200 baud).\n\n## Como funciona\n\n* Ao criar o objeto, a lib inicia uma **thread** que pergunta os ângulos à placa sem parar\n  (a cada ~5 ms). Os métodos `le_angulo_*()` só devolvem o último valor recebido: são instantâneos.\n* **Z acumula:** girando 2 voltas para o mesmo lado, Z vai a 720 (não volta para 0 em 360). Isso é\n  bom: você pode somar 90 no alvo sem se preocupar em \"dar a volta\".\n* **Sentido:** no Mariola o Z **cresce girando no sentido horário** (visto de cima). Muitos\n  programas preferem \"positivo = esquerda\" (padrão da matemática); para isso, use `-le_angulo_z()`.\n* **Deriva:** todo giroscópio \"anda\" um pouco parado (fração de grau por minuto). Por isso, se\n  houver uma referência melhor (parede reta, linha), use-a para corrigir (veja a Maze).\n\n## Criando o objeto\n\n### `Giroscopio(porta_serial)`\n```python\ngiro = Giroscopio(Portas.SERIAL5)\n```\nLança exceção se a porta não abrir. Começa no modo `GYRO`.\n\n## Constantes\n\n| Constante | Valor | Significado |\n|---|---|---|\n| `GYRO` | 0 | modo normal: ângulos X, Y, Z |\n| `GYRO2` | 1 | igual ao `GYRO`; **trocar entre os dois zera o Z** |\n| `GYRO_CAL` | 2 | modo de calibração (uso interno de `calibra()`) |\n| `ROS_IMU` | 3 | quaternion + velocidade angular + aceleração (firmware com suporte) |\n\n## Métodos principais\n\n### `le_angulo_z()`\nÂngulo de **rumo** (giro no chão), inteiro em graus, acumulando. Positivo = horário.\n\n* **Quando usar:** em todo giro e para andar reto.\n\n### `le_angulo_x()` · `le_angulo_y()`\nInclinação em graus. No robô de exemplo, **X é a inclinação para frente** (positivo = frente\nsubindo) e Y a lateral — confira no seu, depende de como a placa foi montada.\n\n* **Quando usar:** detectar rampa (subindo/descendo), saber que está em cima de lombada, não\n  confundir o pé da rampa com outra coisa, detectar a gangorra virando.\n\n### `reseta_z()`\nZera o Z (troca entre `GYRO` e `GYRO2`, o que faz a placa zerar) e espera 25 ms.\n\n* **Quando usar:** no começo da rodada, logo depois do botão de início, com o robô parado na\n  direção que vai virar \"zero\".\n* **Cuidado:** depois de zerar, todos os alvos que você guardou ficam errados. Prefira zerar só uma\n  vez e trabalhar com **alvos relativos** (`alvo = z() + 90`).\n\n### `calibra()`\nPara a thread, manda a placa calibrar (mede o \"zero\" do sensor com o robô **parado**), espera a\nconfirmação (até 5 s) e volta ao modo `GYRO`. `True` se deu certo.\n\n* **Quando usar:** quando o Z deriva muito com o robô parado. A calibração fica gravada na placa;\n  não precisa calibrar em todo programa. Se calibrar, **não encoste no robô** enquanto isso.\n\n### `set_modo(modo)`\nEscolhe o modo (0 a 3). `ValueError` para outros valores.\n\n### `atualiza()`\nPede e lê um pacote. A thread já faz isso; você não precisa chamar.\n\n## Modo `ROS_IMU` (avançado)\n\nCom `set_modo(Giroscopio.ROS_IMU)` e um firmware que suporte, a placa manda orientação em\nquaternion, velocidade angular (rad/s) e aceleração linear (m/s²). Métodos:\n`get_quaternion()`, `get_angular_velocity()`, `get_linear_acceleration()`,\n`get_orientation_euler()` (roll, pitch, yaw em graus), `get_all_imu_data()` (dict no formato do\nROS), `print_imu_data()`, e as covariâncias `get_*_covariance()`. Útil para quem usa ROS 2 ou\nfusão de sensores. Nesse modo, `le_angulo_*()` **não** são atualizados.\n\n## Receitas\n\n**Ângulo com \"positivo = esquerda\":**\n```python\ndef z():\n    return -giro.le_angulo_z()\n```\n\n**Girar até um alvo** (proporcional com velocidade mínima):\n```python\ndef gira_para(alvo, tolerancia=1.5):\n    while abs(alvo - z()) > tolerancia:\n        erro = alvo - z()\n        v = max(15, min(50, abs(erro) * 0.8))\n        motores.velocidade_motores(-v if erro > 0 else v, v if erro > 0 else -v)\n        motores.atualiza_motores()\n        time.sleep(0.01)\n```\n\n**Alvos acumulados:** guarde a direção desejada e some 90 a cada curva (`direcao += 90`) em vez de\n\"girar 90 a partir de onde estou\". Assim o erro de uma curva não se soma ao da próxima.\n\n**A direção mais próxima de um múltiplo de 90°:** `round(z() / 90) * 90`.\n\n## Erros comuns\n\n| Sintoma | Causa provável |\n|---|---|\n| Gira para o lado errado | sinal: o Z do Mariola é positivo no sentido horário |\n| Passa do alvo e volta (oscila) | ganho alto ou velocidade mínima alta; diminua perto do alvo |\n| Fica girando sem parar | o alvo nunca é atingido (tolerância pequena demais / roda patinando): ponha tempo máximo |\n| Z \"anda\" parado | calibre (`calibra()`) com o robô imóvel |\n\n## No simulador\n\nZ em graus acumulando, positivo no horário (`giroscopio` no `robo*.json`: escala, sentido,\nderiva, ruído). X/Y mostram a inclinação em rampas, escadas, lombadas e a vibração dos detritos.\n", "referencia/modulos-simulador.md": "# Módulos que o simulador fornece: `simdebug`, `visao`, `deteccaoVitimas`, `dispensadorKits`\n\nAlgumas partes do robô **não dá para simular de verdade** (a imagem da câmera, a IA, o mecanismo\nde kits) e algumas só **existem no simulador** (desenhar na tela dele). Para o mesmo programa rodar\nnos dois lugares, o simulador injeta módulos com uma **interface simples**, e a pasta `robo_real/`\nde cada simulador traz a versão do robô com a **mesma interface**.\n\n| Módulo | Simulador | No robô real, copie |\n|---|---|---|\n| `simdebug` | Line e Maze | `robo_real/simdebug.py` (não faz nada) |\n| `visao` | Line | `simuladorLine/robo_real/visao.py` (câmera USB + a sua YOLO/OpenCV) |\n| `deteccaoVitimas` | Maze | `simuladorMaze/robo_real/deteccaoVitimas.py` (complete) |\n| `dispensadorKits` | Maze | `simuladorMaze/robo_real/dispensadorKits.py` (complete) |\n\n`simdebug` e `visao` têm `NO_SIMULADOR` (`True` no simulador, `False` no robô), para o raro caso de o\nprograma precisar saber onde está.\n\n---\n\n## `simdebug` — desenhar o que o programa \"acha\"\n\n```python\ntry:\n    import simdebug\nexcept ImportError:          # robô sem o simdebug.py: segue sem desenhar\n    simdebug = None\n\nif simdebug:\n    simdebug.pose(x_mm, y_mm, theta_graus)\n```\n\n| Função | Desenha |\n|---|---|\n| `pose(x_mm, y_mm, theta_graus)` | o contorno roxo do robô **onde o seu programa acha que ele está** (referencial do início: x para frente, y para a esquerda, θ anti-horário) |\n| `texto(s)` | uma frase no painel (o estado da sua máquina de estados, por exemplo) |\n| `marca(x_mm, y_mm, cor='amarelo')` | um ponto no mapa (onde achou uma vítima, onde viu o preto...) |\n| `limpa()` | apaga as marcas |\n\n* **Quando usar:** sempre que tiver odometria ou um mapa interno. Ver o robô de verdade e o\n  \"robô imaginado\" lado a lado mostra na hora se o erro é de **percepção** ou de **decisão**.\n\n---\n\n## `visao` — câmera da frente (Line, área de resgate)\n\n```python\nfrom visao import Visao\ncamera = Visao()\nfor v in camera.vitimas():\n    print(v.tipo, v.angulo, v.distancia)\n```\n\n### `Visao()`\nNo simulador, dá erro se o robô não tiver `camera` no `robo*.json` (o de esteira não tem).\n\n### `vitimas()` → lista de detecções, **da mais perto para a mais longe**\nCada uma com:\n\n| Campo | Significado |\n|---|---|\n| `tipo` | `'viva'` (prata) ou `'morta'` (preta) |\n| `angulo` | graus, **+ = à esquerda** do centro da imagem |\n| `distancia` | mm (estimada pelo tamanho da bolinha) |\n| `x`, `y`, `raio_px` | posição e raio na imagem (320×240) |\n| `confianca` | 0 a 1 |\n\n### `triangulos()` → lista de detecções dos triângulos\n`cor` (`'verde'`/`'vermelho'`), `angulo`, `distancia` (até a parede do triângulo), `x`, `x_min`,\n`x_max`, `largura_px`.\n\n### Como o stub se comporta (igual a uma câmera de verdade)\n* **Ritmo:** `vitimas()` entrega ~4 quadros/s (a IA no Banana Pi), `triangulos()` ~30/s (OpenCV).\n  Cada chamada **espera o próximo quadro**.\n* **Atraso:** a resposta descreve o quadro capturado antes do processamento: o robô já andou um\n  pouco.\n* **Erros:** 90% de acerto (às vezes a vítima não aparece), ~3% de troca viva/morta, ruído no\n  ângulo e na distância, vítimas falsas às vezes detectadas como vivas.\n* **O erro fica preso ao ponto de vista:** parado no mesmo lugar, o mesmo erro se repete. Andando\n  ou girando, ele é sorteado de novo. Ou seja: **se não viu, mexa-se um pouco e olhe de novo**.\n* **Oclusão:** uma vítima esconde a outra; paredes, triângulos e o obstáculo escondem o que está\n  atrás; **a garra toda abaixada tapa a câmera**.\n\n### No robô real\n`robo_real/visao.py` abre a câmera USB numa thread (sempre o quadro mais novo), calcula ângulo e\ndistância com o campo de visão e a altura da câmera, e tem dois pontos para você completar:\n`_detecta_vitimas(img)` (a sua YOLO) e `_detecta_triangulos(img)` (já vem com OpenCV por faixa\nHSV). **Meça** `FOV_GRAUS` e `ALTURA_MM` da sua câmera.\n\n---\n\n## `deteccaoVitimas` — câmeras laterais (Maze)\n\n```python\nfrom deteccaoVitimas import DeteccaoVitimas\ncam = DeteccaoVitimas()\nv = cam.detecta()                 # olha as duas câmeras; None ou um dict\ntodas = cam.detecta_todas('esquerda')\n```\n\nCada vítima é um `dict`:\n`{'camera': 'esquerda'|'direita', 'tipo': 'letra'|'cognitivo', 'status': 'ferida'|'estavel'|'ilesa',\n'kits': 2|1|0, 'letra': 'H'|'S'|'U' (só letras), 'distancia_mm': int}`.\n\nNo simulador, a câmera só vê a vítima dentro do campo de visão, de frente e sem parede no meio,\ne (opção ligada) **só com os LEDs de iluminação acesos**. No robô, complete `_processa(nome)` em\n`robo_real/deteccaoVitimas.py` com a sua visão (letras Φ Ψ Ω e alvos cognitivos).\n\n## `dispensadorKits` — kits de resgate (Maze)\n\n```python\nfrom dispensadorKits import DispensadorKits\nkits = DispensadorKits()\nsaiu = kits.deposita(2, 'esquerda')   # quantos kits saíram\nkits.restantes()\n```\n\nNo robô, `robo_real/dispensadorKits.py` traz um exemplo com dois servos comuns do Mariola\n(`DispensadorKits(motores=motores)`); ajuste os ângulos para o seu mecanismo.\n", "referencia/motores.md": "# `Motores` — motores, encoders, servos comuns e LEDs da placa do Mariola\n\nArquivo: `libs/motores.py` · `from motores import Motores`\n\n## Para que serve\n\nDentro do brick há uma placa com um **ATmega328PB** ligada ao Banana Pi pela serial interna\n(`_SERIAL0`). É ela que gera o PWM dos motores, conta os encoders, faz o **PID de velocidade**,\nmove os **servos comuns** e acende os **LEDs RGB**. A classe `Motores` conversa com essa placa.\n\n| Saída | Quantas | Detalhe |\n|---|---|---|\n| Motores 1 e 2 | 2 | **com encoder**: velocidade com PID, giro por ângulo, leitura da contagem |\n| Motores 3 e 4 | 2 | sem encoder: potência direta, ou \"copiando\" o PID dos motores 1 e 2 (modo 4x4) |\n| Servos | 4 conectores (o protocolo tem 6 posições) | servo comum de hobby, 0 a 180° |\n| LEDs RGB | 10 (índices 0 a 9) | fita de LEDs endereçáveis |\n\n## Como a conversa funciona (importante para entender os métodos)\n\nA lib guarda os valores em listas (`lista_motores`, `lista_servos`) e **só manda para a placa\nquando um método de envio é chamado**. Cada envio é um pacote de 10 bytes, e a placa responde com\na contagem dos encoders e o estado dos motores.\n\n* **`Motores(True)`** (atualização instantânea): todo método que muda um valor já envia. Fácil, bom\n  para começar e para testes.\n* **`Motores(False)`**: os métodos só mudam a lista; **você** chama `atualiza_motores()` ou\n  `atualiza_servos()` quando quiser enviar. Bom no laço de controle: você muda os dois motores e\n  manda **um** pacote só (mais rápido, os dois mudam juntos).\n\n**Unidade de velocidade:** `100` = a velocidade de calibração guardada na EEPROM da placa (por\npadrão ~80% da rotação livre do motor). O PID tenta manter essa velocidade mesmo com carga, na\nsubida, com bateria mais fraca. `-100` = mesma coisa para trás.\n\n**Unidade de \"ângulo\":** contagens do encoder (não são graus!). O Mariola conta as duas bordas de\num canal do encoder: `contagens por volta da roda = pulsos do encoder × redução × 2`. Ex.: motor\ncom 17 pulsos e redução 34 → 1156 contagens por volta da roda.\n\n**Segurança — timeout de 5 s:** se a placa ficar **5 segundos sem receber nenhum pacote**, ela\nsolta os motores e **apaga todos os LEDs**. É proteção para o robô não sair andando sozinho se o\nprograma travar. Consequência: **nunca dê `time.sleep()` longo sem mandar nada** quando os motores\nou LEDs precisam continuar como estão (espere em um laço que reenvia o comando).\n\n## Criando o objeto\n\n### `Motores(atualiza_instantaneo=False)`\nAbre a serial interna (250000 baud), envia motores e servos zerados e zera a referência dos\nencoders. Lança `Exception('Erro ao abrir a porta serial')` se a placa não for encontrada.\n\n```python\nmotores = Motores(True)\nmotores.direcao_motor(2, Motores.INVERTIDO)   # quase sempre um lado é espelhado\n```\n\n* Crie **um só** objeto `Motores` no programa inteiro e passe-o para quem precisar.\n* Quando o objeto é destruído (fim do programa), `__del__` chama `para_motores()` e fecha a\n  serial. Com `Motores(False)` o `para_motores()` não envia nada: pare você mesmo no `finally`.\n\n## Constantes\n\n| Constante | Valor | Uso |\n|---|---|---|\n| `NORMAL`, `INVERTIDO` | 0, 1 | `direcao_motor()` |\n| `BREAK`, `HOLD` | 0, 1 | `set_modo_freio()`: solto / segura parado |\n| `PARADO`, `GIRANDO_NORMAL`, `GIRANDO_INVERTIDO` | 0, 1, 2 | `estado_motor()` |\n| `DEBUG` | False | `True` imprime cada pacote (deixa lento) |\n\n## Métodos de movimento\n\n### `direcao_motor(motor, direcao)`\nDiz se o motor (1 a 4) está montado invertido. Depois disso, velocidade positiva = robô para\nfrente nos dois lados, e `angulo_motor()` também já vem com o sinal certo.\n\n* **Quando usar:** uma vez, logo depois de criar o objeto. Os motores de um lado do robô ficam\n  espelhados em relação ao outro lado, então um deles precisa de `INVERTIDO`.\n* **Como descobrir:** mande `velocidade_motores(30, 30)`; a roda que girar para trás é a invertida.\n\n### `velocidade_motor(motor, velocidade)`\nVelocidade de **um** motor (1 a 4), de -120 a 120. Nos motores 1 e 2 é velocidade com PID; nos\nmotores 3 e 4 (sem encoder) o valor vira **potência direta**.\n\n* **Quando usar:** quando só um motor muda (ex.: um motor de esteira transportadora, um rolo).\n\n### `velocidade_motores(velocidade1, velocidade2)`\nVelocidade dos motores 1 e 2 juntos (-120 a 120). É o comando principal de um robô de duas rodas\nou duas esteiras: `velocidade_motores(ve, vd)`.\n\n* **Quando usar:** em todo laço de controle (seguidor de linha, andar reto, girar).\n* **Dica:** a diferença entre os dois lados é o que faz o robô virar. `(40, 40)` reto,\n  `(20, 60)` curva para a esquerda, `(-30, 30)` gira no lugar para a esquerda.\n\n### `velocidade_motores_4x4(velocidade1, velocidade2)`\nComo `velocidade_motores`, mas o motor 3 recebe o mesmo controle do motor 1 e o 4 o do 2 (os\nmotores sem encoder \"copiam\" o PID dos com encoder). Faixa -100 a 100.\n\n* **Quando usar:** robô com 4 motores todos ligados no Mariola (2 com encoder, 2 sem).\n\n### `potencia_motor(motor, potencia)` / `potencia_motores(p1, p2)` / `potencia_motores_4x4(p1, p2)`\n**Potência PWM direta** (-100 a 100), **sem PID**. O encoder continua contando.\n\n* **Quando usar:** quando você quer a força bruta e não a velocidade: empurrar um obstáculo,\n  teste de motor, controle feito por você mesmo, motor sem encoder.\n* **Diferença para a velocidade:** com potência 40 o robô anda mais devagar na subida e mais rápido\n  na descida; com velocidade 40 o PID compensa. Para seguir linha e andar distâncias, prefira\n  velocidade.\n\n### `move_motor(motor, velocidade, angulo)` / `move_motores(v1, a1, v2, a2)` / `move_motores_4x4(v1, a1, v2, a2)`\nGira o motor (só 1 e 2, que têm encoder) **um número de contagens** e para sozinho. `angulo` de 0\na 32767 (a placa lê como número com sinal de 16 bits: acima disso o motor para na hora). O sentido\nvem do sinal da velocidade.\n\n```python\nmotores.move_motores(40, 1156, 40, 1156)    # uma volta da roda nos dois motores\n```\n\n* **Quando usar:** movimentos curtos e exatos sem precisar de laço: andar 1 ladrilho, recuar 5 cm.\n* **Como esperar terminar:** em laço, `estado()` e `estado_motor(1) == Motores.PARADO`\n  (veja o [tutorial 4](../04-motores-e-encoders.md)).\n* **Cuidados:**\n  * com `Motores(True)` o método já envia e espera 50 ms;\n  * `angulo` 0 **não cancela**: mantém o alvo anterior. Para cancelar, mande velocidade 0;\n  * ao chegar no alvo o motor para, mas **a velocidade fica guardada**: o próximo pacote de motor\n    (qualquer `velocidade_motor`, `atualiza_motores`...) faz ele voltar a girar sem fim. Depois de\n    chegar, mande `velocidade_motores(0, 0)`. Para só acompanhar, use `estado()`, que não reenvia;\n  * o robô passa um pouco do alvo (inércia). Para precisão, desacelere perto do fim.\n\n### `para_motores()`\nVelocidade 0 nos quatro motores (modo 4x4). Com `Motores(False)`, chame `atualiza_motores()`\ndepois (senão nada é enviado).\n\n### `set_modo_freio(modo)`\n`Motores.BREAK` (padrão): parado, o motor fica livre. `Motores.HOLD`: parado, a placa **segura**\no motor. O valor vai junto no próximo pacote de motores (não envia sozinho).\n\n* **Quando usar `HOLD`:** parar em rampa sem escorregar, ficar parado num lugar exato.\n\n### `pid_motor(kp, ki, kd)`\nGrava as constantes do PID de velocidade **na EEPROM** da placa (multiplicadas por 100: de 0 a\n655,35). Demora ~1,1 s. Lança exceção se a placa não confirmar.\n\n* **Quando usar:** só quando for ajustar o PID; não precisa chamar em todo programa (fica gravado).\n\n## Métodos de leitura (encoders)\n\n### `atualiza_motores()`\n**Envia** o pacote de motores e **lê** a resposta: contagem dos encoders e estado. Lança\n`Exception('Erro ao ler o estado dos motores')` se a placa não respondeu certo.\n\n* **Quando usar:** com `Motores(False)`, uma vez por volta do laço, depois de definir as\n  velocidades. Com `Motores(True)` os métodos já chamam por você.\n\n### `estado()`\n**Só lê** contagens e estado, sem mudar nada nos motores. Mantém a placa \"acordada\" (conta como\npacote para o timeout de 5 s).\n\n* **Quando usar:** para ler encoders sem reenviar velocidade (principalmente depois de\n  `move_motor`), e para manter a placa viva enquanto espera.\n\n### `angulo_motor(motor)`\nContagem do motor 1 ou 2 desde o último `reseta_angulo_motor`, já com o sinal certo (respeita\n`direcao_motor`). **Não lê da placa**: devolve o valor recebido no último `atualiza_motores()` ou\n`estado()`. Chame um deles antes.\n\n### `reseta_angulo_motor(motor)`\nZera a referência do motor 1 ou 2. Não mexe na placa: só guarda o valor atual para descontar.\n\n* **Cuidado:** o \"valor atual\" é o do último pacote. Para zerar exatamente agora, faça\n  `motores.estado()` e depois `reseta_angulo_motor(...)`.\n\n### `estado_motor(motor)`\n`PARADO`, `GIRANDO_NORMAL` ou `GIRANDO_INVERTIDO` para o motor 1 ou 2 (do último pacote).\n\n### Distância andada (receita)\n\n```python\nimport math\nMM_POR_CONTAGEM = math.pi * DIAMETRO_RODA_MM / CONTAGENS_POR_VOLTA\nmotores.estado()\nmm = (motores.angulo_motor(1) + motores.angulo_motor(2)) / 2 * MM_POR_CONTAGEM\n```\n\nLembre: a roda patina (curva, arranque, empurrando parede). O encoder mede a roda, não o robô.\n\n## Calibração de velocidade\n\n### `obtem_calibracao_motores()`\nDevolve `(calibracao_motor1, calibracao_motor2)`: a velocidade (contagens a cada 25 ms) que vale\n\"100\". Serve para conferir e para o simulador ficar igual ao seu robô.\n\n### `calibra_motores()`\nManda a placa medir a velocidade máxima dos motores e gravar a calibração. **Os motores giram\nsozinhos** e a placa fica ~26 s sem responder. Faça com o robô **suspenso** (rodas no ar).\n\n* **Quando usar:** motor novo, troca de redução/roda, robô andando torto com velocidades iguais.\n\n## Servos comuns\n\n### `move_servo(servo, angulo)`\nServo comum ligado nos pinos amarelos (1 a 4), de 0 a 180°. Com `Motores(False)`, envie com\n`atualiza_servos()`.\n\n### `desativa_servo(servo)`\nPara de mandar pulso (o servo fica solto e para de consumir/forçar).\n\n### `atualiza_servos()`\nEnvia a lista dos servos.\n\n* **Quando usar servo comum:** mecanismos simples (uma alavanca, uma porta) em que não é preciso\n  saber a posição real. Para garra com leitura de posição e detecção de travamento, use os\n  [servos inteligentes](placaControleServo.md).\n\n## LEDs RGB\n\n### `set_led_rgb_all(r, g, b)` · `set_led_rgb_one(indice, r, g, b)`\nAcende todos os LEDs, ou um (índice 0 a 9), com a cor (0 a 255 cada). Enviam na hora (não\ndependem de `atualiza_instantaneo`).\n\n* **Quando usar:** indicar estado do programa (ótimo para depurar sem tela!), iluminar as\n  câmeras, sinalizar vítima na Maze.\n* **Cuidado:** o timeout de 5 s apaga os LEDs. Se o programa fica parado esperando o botão, os\n  LEDs apagam: reacenda depois.\n\n## Erros comuns\n\n| Sintoma | Causa provável |\n|---|---|\n| Robô gira em vez de andar reto | falta `direcao_motor(2, Motores.INVERTIDO)` (ou o motor errado invertido) |\n| Nada acontece com `Motores(False)` | esqueceu de chamar `atualiza_motores()` |\n| Motor volta a girar depois de `move_motor` | a velocidade ficou guardada: mande `velocidade_motores(0, 0)` |\n| Robô para sozinho e LEDs apagam | ficou 5 s sem mandar pacote (um `sleep` longo) |\n| `angulo_motor` não muda | não chamou `estado()`/`atualiza_motores()` antes |\n| `Exception: Erro ao ler o estado dos motores` | dois programas usando a placa ao mesmo tempo (o anterior não fechou?) ou cabo/placa |\n\n## No simulador\n\nEmulado byte a byte (PID a 40 Hz, encoder ×2, timeout de 5 s, LEDs). Os motores e LEDs ligados em\ncada canal estão no `robo*.json` (`motores`, `leds`).\n", "referencia/pinosDigitais.md": "# `PinosDigitais` — os 8 pinos como entrada ou saída\n\nArquivo: `libs/pinosDigitais.py` · `from pinosDigitais import PinosDigitais` ·\n`from gpiod.line import Direction`\n\n## Para que serve\n\nA mesma coisa que [`Botoes`](botoes.md), mas cada pino pode ser **entrada ou saída**:\n\n* **saída:** ligar um LED de sinalização, um relé (ex.: o motor do lidar), um buzzer, um\n  transistor que liga um eletroímã;\n* **entrada:** botões, chaves, sensores digitais (fim de curso, sensor indutivo, saída digital de\n  outro microcontrolador).\n\nOs pinos aceitam 5 V e têm proteção (veja o módulo 1).\n\n## Constantes\n\n`P1`…`P8` (pinos), `ALTO`/`BAIXO` (níveis), `LIBERADO`/`APERTADO` (compatíveis com `Botoes`).\n\n## Métodos\n\n### `PinosDigitais()`\nReserva os 8 pinos, todos como **entrada**. Não use junto com `Botoes()` (os dois querem os mesmos\npinos).\n\n### `configura_pino(pino, direcao)`\n`Direction.OUTPUT` ou `Direction.INPUT`.\n```python\npinos.configura_pino(PinosDigitais.P5, Direction.OUTPUT)\n```\n\n### Entrada\n| Método | Faz |\n|---|---|\n| `le_pino(pino)` | `ALTO` ou `BAIXO` (`ValueError` se o pino não for entrada) |\n| `botao_pressionado(pino)` | `True` se está em nível baixo (apertado) |\n| `le_botao(pino)` | igual a `le_pino` |\n\n### Saída\n| Método | Faz |\n|---|---|\n| `escreve_pino(pino, valor)` | `ALTO` ou `BAIXO` (`ValueError` se o pino não for saída) |\n| `liga_pino(pino)` / `desliga_pino(pino)` | atalhos para `ALTO` / `BAIXO` |\n| `inverte_pino(pino)` | troca o estado (pisca-pisca) |\n\n### `get_direcao(pino)`\nDevolve a direção atual.\n\n## Receita: botões nos pinos 1–4, LEDs nos 5–8\n\n```python\npinos = PinosDigitais()\nfor p in (PinosDigitais.P5, PinosDigitais.P6, PinosDigitais.P7, PinosDigitais.P8):\n    pinos.configura_pino(p, Direction.OUTPUT)\nwhile True:\n    if pinos.botao_pressionado(PinosDigitais.P1):\n        pinos.liga_pino(PinosDigitais.P5)\n    else:\n        pinos.desliga_pino(PinosDigitais.P5)\n    time.sleep(0.02)\n```\n\n(Exemplo completo: `exemplos/05-pinosDigitais/`.)\n\n* **Cuidado com corrente:** um pino de saída acende um LED (com resistor), mas **não** liga motor,\n  eletroímã ou relé grande direto. Use um transistor/módulo de relé.\n\n## No simulador\n\nAs linhas GPIO são emuladas (entrada e saída). Um LED de vítima num pino pode ser configurado\nna Maze (`\"led_vitima\": \"gpio:P5\"`).\n", "referencia/placaControleMotor.md": "# `PlacaControleMotor` — placas de motor extras (barramento de um fio)\n\nArquivo: `libs/placaControleMotor.py` · `from placaControleMotor import PlacaControleMotor`\n\n## Para que serve\n\nCada **placa de controle de motor** (ATtiny1616) controla **um** motor com encoder: PID de\nvelocidade, giro por ângulo, freio que segura a posição. Várias placas ficam penduradas no\n**mesmo fio serial** (barramento *half-duplex one-wire*), cada uma com um **ID** gravado.\n\nUso típico: o robô 4x4 — os 2 motores traseiros no Mariola e os 2 dianteiros em placas na SERIAL1.\n\n## Como funciona o barramento\n\n* Todas as placas recebem todos os pacotes; só responde a que tem o **ID** do pacote.\n* Pacote de comando: 6 bytes `[ID, modo, valor, giro_alto, giro_baixo, CRC]`. Resposta: 8 bytes\n  `[ID, modo, estado, pulsos(4 bytes), CRC]`. O CRC é o XOR dos bytes.\n* Como o fio é um só, o Banana Pi **ouve o próprio pacote** (eco). A lib descarta o eco e lê a\n  resposta. Se o CRC não bate, tenta de novo (3 tentativas) e devolve `None` se não conseguiu.\n* **Os servos inteligentes podem ficar no mesmo barramento** (IDs diferentes!).\n\n**Segurança da placa:** 5 s sem nenhum pacote para ela → motor para. 10 s → o *watchdog* reinicia\na placa e **a contagem do encoder volta a 0**. Reenvie o comando sempre (no laço de controle isso\nacontece naturalmente).\n\n**Encoder em quadratura (×4):** a placa conta as 4 bordas dos 2 canais. O mesmo motor dá **o dobro\nde contagens** do que no Mariola (que conta ×2).\n\n## Criando o objeto\n\n### `PlacaControleMotor(objeto_porta_serial, id_equipamento)`\nRecebe a **porta já aberta** (não o número da porta!) e o ID.\n\n```python\nfrom portas import Portas\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nfrente_esq = PlacaControleMotor(barramento, 8)\nfrente_dir = PlacaControleMotor(barramento, 51)\nfrente_esq.reset()\nfrente_dir.reset()\nfrente_dir.direcao_motor(PlacaControleMotor.INVERTIDO)\n```\n\n* Abra a porta **uma vez** e passe o mesmo objeto para todas as placas.\n* `timeout=0.005` deixa o laço rápido (a resposta chega em ~1 ms).\n\n## Constantes\n\n`NORMAL`/`INVERTIDO` (direção), `FREIO_BREAK`/`FREIO_TRAVADO` (freio), `PARADO`,\n`GIRANDO_NORMAL`, `GIRANDO_INVERTIDO` (estado), `DEBUG`, e os `MODO_*` do protocolo (uso interno).\n\n## Métodos do dia a dia\n\nQuase todos devolvem um `dict` `{'id', 'modo', 'estado', 'pulsos'}` com a resposta, ou `None` se\na placa não respondeu.\n\n### `direcao_motor(direcao)`\n`NORMAL` ou `INVERTIDO`. Só muda a lib (inverte o sinal do que você manda e do que lê).\n\n### `velocidade_motor(velocidade)`\nVelocidade com PID (-100 a 100), contínua. Mesma escala do Mariola (100 = calibração).\n\n* **Quando usar:** no laço de controle, junto com `Motores.velocidade_motores`, para as 4 rodas\n  andarem juntas.\n\n### `move_motor(velocidade, angulo)`\nGira `angulo` contagens (0 a 65535) e para. **Diferente do Mariola: `angulo` 0 cancela o alvo**\n(gira sem parar).\n\n### `potencia_motor(potencia)`\nPWM direto (-100 a 100), sem PID.\n\n### `para_motor()`\nVelocidade 0 (com PID: o motor freia ativamente).\n\n### `angulo_motor()`\nContagens desde o último `reseta_angulo_motor()`, com o sinal da direção. **Faz uma transação na\nserial** (pergunta para a placa). Devolve 0 se falhou.\n\n### `reseta_angulo_motor()`\nLê a contagem atual e passa a contar a partir dela.\n\n### `estado_motor()`\n`PARADO`, `GIRANDO_NORMAL` ou `GIRANDO_INVERTIDO` (pergunta para a placa).\n\n### `le_pulsos()` / `atualizar()`\nContagem absoluta (sem desconto) / a resposta completa, sem mudar o comando.\n\n### `set_freio(modo_freio)` · `set_modo_freio(modo)`\n`FREIO_BREAK` (solta) ou `FREIO_TRAVADO` (parado, a placa segura a posição com um PD de posição).\nAjuste o freio travado com `set_kp_freio`, `set_kd_freio` e `set_delta_freio` (zona morta, em\ncontagens).\n\n### `reset()`\nReinicia a placa como se tivesse acabado de ligar: para, zera contadores, recarrega PID e\ncalibração da EEPROM. Também zera o desconto da lib.\n\n* **Quando usar:** no começo do programa, para começar de um estado conhecido. Também serve para\n  **testar se a placa está lá** (`None` = não respondeu).\n\n## Ajuste e calibração (de vez em quando)\n\n| Método | O que faz |\n|---|---|\n| `pid_motor(kp, ki, kd)` | grava as três constantes (×100) na EEPROM; `True` se todas confirmaram |\n| `set_kp(v)`, `set_ki(v)`, `set_kd(v)` | uma constante de cada vez |\n| `set_kp_freio(v)`, `set_kd_freio(v)`, `set_delta_freio(v)` | ajuste do freio travado |\n| `calibrar()` | a placa gira o motor nos dois sentidos e mede a velocidade máxima (~12–14 s, **robô suspenso**). Devolve `{'giro_max_horario', 'giro_max_antihorario'}` |\n| `calibracao_manual(horario, antihorario)` | grava a calibração sem medir (ex.: para igualar ao motor do Mariola) |\n| `obter_calibracao()` | lê a calibração e se o encoder está ativo |\n\nSem calibração gravada, a placa trabalha em PWM direto (a \"velocidade\" vira potência).\n\n## Para descobrir e configurar placas\n\n### `PlacaControleMotor.buscar_motores(porta_serial, baud_rate=250000)` *(estático)*\nVarre os IDs 0 a 255 e devolve a lista `[{'id', 'estado', 'pulsos'}, ...]`. Recebe o **número**\nda porta (ex.: `Portas.SERIAL1`), abre e fecha sozinho. Demora alguns segundos.\n\n* **Quando usar:** placa nova, ou \"não sei o ID desta placa\". Rode com nada mais usando a porta.\n\n### `set_ignorar_retorno(ignorar)`\n`True`: manda o comando e não espera resposta (mais rápido, mas você não sabe se chegou e não lê\no encoder).\n\n### `envia_comando(modo, valor, giro=0, tentativas=3)`\nO envio \"cru\". Os outros métodos usam este. Só use para experimentos com o protocolo.\n\n## Erros comuns\n\n| Sintoma | Causa provável |\n|---|---|\n| Tudo devolve `None` | ID errado, porta errada, baud diferente de 250000 ou placa sem energia |\n| Rodas da frente e de trás andando diferente | calibração diferente: veja `obter_calibracao()` e `Motores.obtem_calibracao_motores()` (lembre do ×4 vs ×2) |\n| Contagem volta para 0 sozinha | a placa ficou 10 s sem pacote e reiniciou |\n| `PlacaControleMotor(Portas.SERIAL1, 8)` dá erro estranho | passou o número da porta: esta classe quer a porta **aberta** |\n\n## No simulador\n\nEmulado byte a byte (eco, CRC, quadratura ×4, giro 0 cancela, timeout 5 s, watchdog 10 s,\ncalibração). Quais IDs existem e em que roda estão: `motores` no `robo*.json`.\n", "referencia/placaControleServo.md": "# `PlacaControleServo` — servos inteligentes (MG90S + placa de controle)\n\nArquivo: `libs/placaControleServo.py` · `from placaControleServo import PlacaControleServo`\n\n> Esta é a versão **unificada** (17/10/2026). Ela precisa do firmware unificado\n> (`placaControleServo.ino` da mesma data) para `consulta_posicao()`, `define_id()` e a calibração\n> do tempo de trava. Com firmware antigo, `consulta_posicao()` e `define_id()` mandam o servo para\n> 1023 — atualize as placas antes.\n\n## Para que serve\n\nUm servo comum só recebe \"vá para X graus\" e você nunca sabe se ele chegou. O **servo\ninteligente** é um MG90S cujo potenciômetro interno é lido por uma placinha (ATtiny) que:\n\n* move o motor até a **posição pedida** (leitura do potenciômetro, 0 a 1023);\n* **devolve a posição real** a cada comando;\n* percebe quando o servo **travou** (está forçando e não se mexe) e desliga o motor para não\n  queimar;\n* fica num **barramento serial de um fio** com um **ID**: vários servos (e as placas de motor) no\n  mesmo conector.\n\nUso típico: a **garra** e a **caçamba** da área de resgate.\n\n## Como o firmware se comporta (para entender o que acontece no robô)\n\n* **Controle liga-desliga com zona morta:** fora da zona (`alvo ± zona_morta`) a placa aplica a\n  `potencia` para o lado certo; dentro, desliga o motor. Ou seja, **parado no alvo o servo não faz\n  força**. Se algo empurrar para fora da zona, ele volta a corrigir.\n* **Trava:** se o motor está ligado e a posição não muda por mais que o **tempo de trava** (1 s de\n  fábrica, ajustável de 1 a 5 s), a placa desliga o motor por **2 s** e depois tenta de novo.\n  Exemplo: dedos fechando numa bolinha param encostados nela → depois do tempo de trava o motor\n  desliga e **a bolinha deixa de ser apertada**.\n* **5 s sem nenhum pacote para a placa:** potência vai a 0 (motor desligado).\n* **10 s sem pacote:** a placa reinicia (ID e tempo de trava continuam gravados na EEPROM).\n* **Potência 0** = motor desligado (um braço com peso cai).\n\n## Criando o objeto\n\n### `PlacaControleServo(porta_serial, id_equipamento, baud_rate=250000)`\nRecebe o **número da porta** (ex.: `Portas.SERIAL1`) e abre a serial sozinho.\n\n```python\nbraco = PlacaControleServo(Portas.SERIAL1, 70)\ndedo_esq = PlacaControleServo(Portas.SERIAL1, 71)\n```\n\n* Cada objeto abre a porta de novo (no Linux, abrir o mesmo dispositivo várias vezes funciona).\n  Não use os servos ao mesmo tempo em **threads** diferentes: os pacotes se misturam no fio.\n* Pode estar no mesmo barramento das placas de motor, desde que os IDs sejam diferentes.\n\n## Constantes\n\n| Constante | Valor | Uso |\n|---|---|---|\n| `ID_BROADCAST` | 254 | pacote para todas as placas (nenhuma responde) |\n| `COMANDO_CALIBRACAO` | 65000 | uso interno (calibrar tempo de trava) |\n| `COMANDO_CONSULTA` | 65001 | uso interno (consultar posição) |\n| `TEMPO_DETECTA_TRAVA_MIN/MAX` | 1000 / 5000 | limites do tempo de trava (ms) |\n| `DEBUG` | False | imprime cada pacote |\n| `ultima_posicao` | — | última posição recebida |\n\n## Movimento\n\n### `move_servo(posicao, potencia=255, zona_morta=5)`\nManda ir para `posicao` (0 a 1023) com `potencia` (0 a 255). Devolve a **posição atual** (antes de\nse mover), ou `None` se não respondeu.\n\n* **`potencia`**: 255 = o mais rápido/forte. Menos potência = mais lento e mais suave (bom para\n  baixar o braço sem bater). Abaixo de ~60 o MG90S nem sai do lugar.\n* **`zona_morta`**: tolerância. Pequena demais e o servo fica \"tremendo\" em volta do alvo; grande\n  demais e ele para longe.\n* **Quando usar:** sempre que quiser mover; e também **para manter** uma posição por mais de 5 s\n  (reenvie o mesmo comando de vez em quando, senão a placa desliga o motor).\n* `move_servo` não espera chegar. Para esperar, veja `consulta_posicao`.\n\n### `consulta_posicao(tentativas=3)`\nLê a posição **sem mudar o comando** (o servo continua indo para onde estava indo).\n\n* **Quando usar:** para esperar um movimento terminar:\n\n```python\ndef espera_chegar(servo, alvo, tolerancia=25, tempo_max=2.0):\n    fim = time.time() + tempo_max\n    while time.time() < fim:\n        pos = servo.consulta_posicao()\n        if pos is not None and abs(pos - alvo) <= tolerancia:\n            return True\n        time.sleep(0.02)\n    return False          # travou no caminho (ou demorou demais)\n```\n\n* Também serve para **detectar se pegou algo**: dedos que fecharam mas pararam longe do\n  \"fechado\" estão segurando um objeto.\n\n### `le_posicao()`\nLê a posição mandando **potência 0**: **desliga o motor** até o próximo `move_servo`.\n\n* **Quando usar:** só com firmware antigo, ou quando você quer mesmo soltar o servo.\n\n### `para_servo()`\nPotência 0 (motor desligado). Devolve a posição.\n\n* **Quando usar:** no fim do programa, ou para soltar um mecanismo de propósito.\n\n### `envia_comando(posicao, potencia, zona_morta=5, tentativas=3)`\nO envio \"cru\"; devolve `{'id', 'posicao', 'potencia', 'zona_morta'}` ou `None`.\n\n## Todas as placas de uma vez\n\n### `envia_broadcast(posicao, potencia, zona_morta=5)`\nManda o mesmo comando para **todas** as placas do barramento (ninguém responde).\n\n* **Quando usar:** raramente (ex.: desligar todos os servos de uma vez: `envia_broadcast(512, 0)`).\n  Cuidado: placas de motor no mesmo fio também recebem o pacote (ID 254 não é delas, mas confira).\n\n### `calibrar_tempo_detecta_trava_todos(tempo_ms)`\nGrava o tempo de trava em todas as placas (broadcast, sem confirmação).\n\n## Configuração (uma vez por placa)\n\n### `PlacaControleServo.buscar_servos(porta_serial, baud_rate=250000)` *(estático)*\nVarre os IDs 0 a 253 e devolve `[{'id', 'posicao'}, ...]`. **Deixa cada servo encontrado com o\nmotor desligado.**\n\n* **Quando usar:** para descobrir os IDs dos servos ligados.\n\n### `define_id(novo_id)`\nGrava um novo ID (0 a 253) na placa que hoje tem o ID do objeto, e passa a usar o novo.\n`True` se o pacote foi enviado.\n\n* **Como trocar o ID de uma placa nova:** ligue **só ela** no barramento, descubra o ID com\n  `buscar_servos`, crie o objeto com esse ID e chame `define_id(...)`. Rode `buscar_servos` de novo\n  para conferir.\n\n### `calibrar_tempo_detecta_trava(tempo_ms, tentativas=3)`\nGrava o tempo de trava desta placa (1000 a 5000 ms). `True` se confirmou.\n\n* **Quando aumentar:** dedos de garra que precisam continuar apertando um objeto enquanto o braço\n  se move. Com 1 s, eles soltam a bolinha 1 s depois de encostar nela. O robô de exemplo usa 3000.\n\n## Calibrando as posições do seu mecanismo\n\nAs posições não são graus: são a leitura do potenciômetro **montado no seu robô**. Para cada\nservo, anote as leituras nas posições que importam (braço embaixo/em cima, dedo aberto/fechado,\nporta fechada/abrindo para cada lado):\n\n1. `para_servo()` (motor solto) e coloque o mecanismo **com a mão** na posição desejada;\n2. `consulta_posicao()` e anote;\n3. teste com `move_servo(valor_anotado)`.\n\nGuarde os valores como constantes no topo do seu `robo.py` (e no `resgate` do `robo_4x4.json` do\nsimulador).\n\n## Erros comuns\n\n| Sintoma | Causa provável |\n|---|---|\n| Servo vai para 1023 ao consultar/trocar ID | firmware antigo na placa |\n| Dedos soltam a bolinha sozinhos | tempo de trava curto (calibre para 2–3 s) ou o braço se mexeu depois da trava |\n| Braço cai quando o programa espera | 5 s sem pacote ou `le_posicao()`/`para_servo()`; ou parado na zona morta com peso |\n| Servo treme parado | zona morta pequena ou potência alta demais |\n| `None` em tudo | ID errado, porta errada ou firmware/baud diferente |\n\n## No simulador\n\nO simulador da Line emula o firmware unificado (`resgate` no `robo_4x4.json`: IDs 70 a 73,\nposições, velocidade do MG90S, tempo de trava 3000). O braço cai sem força a não ser todo\nlevantado, e os dedos só seguram enquanto empurram.\n", "referencia/placasMux.md": "# `PlacaMuxVl53l0x` e `PlacaMuxTCS34725` — placas multiplexadoras na serial\n\nArquivos: `libs/placaMuxVl53l0x.py`, `libs/placaMuxTCS34725.py`\n\n## Para que servem\n\nSão placas com um microcontrolador que lê **até 4 sensores** sozinhas e mandam tudo junto por uma\n**porta serial** (115200 baud). Vantagem: os sensores não ocupam os conectores I2C do Mariola e a\nleitura não pesa no Banana Pi. Desvantagem: você depende do firmware da placa (modos fixos).\n\nHoje o jeito mais comum no Mariola é ligar cada sensor direto num conector I2C (`VL53L0X`,\n`TCS34725`). Use as placas mux quando faltar conector I2C ou quando já tiver as placas.\n\nNas duas, uma **thread** pede os dados periodicamente e os métodos de leitura devolvem o último\nvalor.\n\n---\n\n## `PlacaMuxVl53l0x(porta_serial)`\n\n`from placaMuxVl53l0x import PlacaMuxVl53l0x`\n\nPlaca com 4 entradas de VL53L0X (e 4 botões). Atualiza a cada ~100 ms.\n\n| Método | Devolve |\n|---|---|\n| `le_distancia(porta)` | distância em mm do sensor 0 a 3 |\n| `botao_apertado(porta)` | `True`/`False` do botão 0 a 3 da placa |\n| `atualiza()` | faz uma leitura (a thread já faz) |\n\n```python\nmux = PlacaMuxVl53l0x(Portas.SERIAL2)\nprint(mux.le_distancia(0), mux.le_distancia(1))\n```\n\n`ValueError` para porta fora de 0–3.\n\n---\n\n## `PlacaMuxTCS34725(porta_serial)`\n\n`from placaMuxTCS34725 import PlacaMuxTCS34725`\n\n> A lib importa `from libs.portas import Portas`. Se der `ModuleNotFoundError: libs`, troque a\n> linha para `from portas import Portas` na cópia do seu projeto.\n\nPlaca com 4 entradas de TCS34725. Atualiza a cada ~25 ms.\n\n| Constante | Modo |\n|---|---|\n| `RGB_4X` (0) | ganho 4x, LED aceso (padrão) |\n| `RGB_16X` (1) | ganho 16x (alvo escuro ou longe), LED aceso |\n| `RGB_4X_LED_OFF` (2) / `RGB_16X_LED_OFF` (3) | LED apagado (medir a luz ambiente) |\n\n| Método | Devolve |\n|---|---|\n| `set_modo(modo)` | escolhe o modo (`ValueError` fora de 0–3) |\n| `le_sensor(porta)` | `(r, g, b, c)` do sensor 0 a 3 |\n| `atualiza()` | faz uma leitura |\n\n```python\ncores = PlacaMuxTCS34725(Portas.SERIAL3)\nr, g, b, c = cores.le_sensor(0)\n```\n\n## No simulador\n\nSó o `PlacaMuxVl53l0x` é emulado (opcional no `robo*.json`). O `PlacaMuxTCS34725` não.\n", "referencia/portas.md": "# `Portas` — os nomes das portas do Mariola\n\nArquivo: `libs/portas.py` · `from portas import Portas`\n\n## Para que serve\n\nO Mariola tem conectores com nome escrito na caixa: **SERIAIS 1 a 6**, **I2C1 a I2C8**. No Linux\nessas portas têm outros nomes (`/dev/ttyUSB2`, `/dev/ttyS4`, canal 3 do multiplexador I2C...).\nA classe `Portas` faz a tradução: no programa você escreve o nome que está na caixa e a lib\ndescobre o resto.\n\nQuase nunca você chama `Portas` diretamente. Você passa as **constantes** dela para as outras\nbibliotecas:\n\n```python\nfrom portas import Portas\ngiro = Giroscopio(Portas.SERIAL5)     # sensor ligado no conector SERIAIS 5\nfrente = VL53L0X(Portas.I2C5)         # sensor ligado no conector I2C5\n```\n\n## Constantes\n\n### Portas seriais\n\n| Constante | Valor | Conector na caixa | No Linux |\n|---|---|---|---|\n| `Portas._SERIAL0` | 0 | (interna) placa do Mariola: motores, servos, LEDs | USB `usb-0:1.1` |\n| `Portas.SERIAL1` | 1 | SERIAIS 1 | USB `usb-0:1.4` |\n| `Portas.SERIAL2` | 2 | SERIAIS 2 | USB `usb-0:1.3` |\n| `Portas.SERIAL3` | 3 | SERIAIS 3 | USB `usb-0:1.2` |\n| `Portas.SERIAL4` | 4 | SERIAIS 4 | `/dev/ttyS4` |\n| `Portas.SERIAL5` | 5 | SERIAIS 5 | `/dev/ttyS2` |\n| `Portas.SERIAL6` | 6 | SERIAIS 6 | `/dev/ttyS5` |\n\n* As **SERIAIS 1, 2 e 3** são conversores USB-serial dentro do brick. O Linux dá a elas um nome\n  `/dev/ttyUSBn` que pode mudar a cada boot; por isso a lib procura pelo **caminho físico** em\n  `/dev/serial/by-path/`, que não muda.\n* As **SERIAIS 4, 5 e 6** são UARTs do próprio processador (Banana Pi M4 Zero).\n* Pinagem de todas: **TX, RX, GND, 5V** (veja o [módulo 1](../01-o-brick-mariola.md)).\n* `_SERIAL0` começa com `_` porque é de uso interno: só a lib `Motores` usa.\n\n### Portas I2C (canais do multiplexador)\n\n| Constante | Canal do TCA9548A | Conector |\n|---|---|---|\n| `Portas.I2C1` | 0 | I2C1 |\n| `Portas.I2C2` | 1 | I2C2 |\n| `Portas.I2C3` | 7 | I2C3 |\n| `Portas.I2C4` | 2 | I2C4 |\n| `Portas.I2C5` | 3 | I2C5 |\n| `Portas.I2C6` | 6 | I2C6 |\n| `Portas.I2C7` | 5 | I2C7 |\n| `Portas.I2C8` | 4 | I2C8 |\n\nOs 8 conectores I2C passam por um **multiplexador TCA9548A** (endereço 0x70). Cada conector é um\n\"barramento separado\": dá para ligar **oito sensores iguais, com o mesmo endereço** (oito VL53L0X,\npor exemplo), um em cada conector. A ordem dos canais não é 0..7 porque segue o desenho da placa:\n**sempre use as constantes**, nunca o número.\n\n> As portas I2C dos conectores **TELA** e **TECLADO** não passam pelo multiplexador e **não têm\n> proteção**: não ligue sensores nelas.\n\n## Métodos\n\n### `porta_serial_real(porta)`\nDevolve o nome Linux da porta (ex.: `'/dev/ttyUSB1'`).\n\n* **Quando usar:** para depurar (\"em qual ttyUSB está a SERIAL2?\") ou para usar uma biblioteca de\n  terceiros que pede o caminho do arquivo.\n* **Erros:** `ValueError` se o número não é de nenhuma porta; `RuntimeError` se não conseguiu\n  listar `/dev/serial/by-path/`. Se o conversor USB daquela porta não for achado, devolve `None`.\n\n### `abre_porta_serial(porta, baud_rate=250000, timeout=0.010)`\nAbre a porta e devolve um objeto `serial.Serial` (pyserial), ou `None` se deu erro ao abrir. Imprime\n`Comunicação estabelecida com sucesso na porta ...` quando dá certo.\n\n* **Quando usar:**\n  * para as **placas de controle de motor** (`PlacaControleMotor`), que recebem a porta já aberta.\n    Abra **uma vez** e passe o mesmo objeto para todas as placas do barramento;\n  * para conversar com um dispositivo seu (um Arduino, um módulo Bluetooth) pela serial.\n* **Parâmetros:** `baud_rate` padrão 250000 (o das placas de motor e servo); sensores como o\n  giroscópio usam 115200 e já passam isso por dentro. `timeout` em segundos: quanto o `read()`\n  espera pela resposta.\n* **Cuidado:** teste o resultado antes de usar. Atenção a um detalhe do pyserial: se o\n  conversor USB (SERIAL1–3) não for encontrado, `porta_serial_real` devolve `None` e o\n  `serial.Serial(None, ...)` cria um objeto **fechado** em vez de dar erro. Por isso teste as duas\n  coisas:\n\n```python\nbarramento = Portas().abre_porta_serial(Portas.SERIAL1, 250000, timeout=0.005)\nif barramento is None or not barramento.is_open:\n    print('não consegui abrir a SERIAL1')\n```\n\n* Abrir a porta **não** diz se tem alguma coisa ligada nela (as SERIAIS 1–3 existem sempre, são\n  conversores dentro do brick). Para saber se um dispositivo responde, mande um comando e veja a\n  resposta (ex.: `PlacaControleMotor.reset()` devolve `None` se a placa não respondeu).\n\n## No simulador\n\nO simulador troca só `porta_serial_real` por uma porta virtual (`sim://SERIAL1`). O resto é igual.\nUma porta sem nada ligado no `robo.json` devolve `None` em `abre_porta_serial`. No robô real as\nSERIAIS 1–3 sempre abrem (o conversor está dentro do brick), então **não use \"a porta abriu\" para\ndescobrir o que está ligado**: pergunte ao dispositivo.\n", "referencia/sensorCorReflexao.md": "# `CorReflexao` — sensor de linha e cor Pro1616 (V2)\n\nArquivo: `sensorCorReflexao.py` **versão V2** (`exemplos/11-sensorCorReflexaoV2/` e\n`libs_mariola/` dos simuladores) · `from sensorCorReflexao import CorReflexao`\n\n> **Atenção:** a pasta `libs/` ainda tem a versão antiga (V1, 32 bytes, `set_modo`, `posicao()`,\n> importa `libs.cronometro`). Ela **não funciona** com o firmware novo do Pro1616 (16 bytes,\n> comando `0x61`). Use a V2: copie a de `exemplos/11-sensorCorReflexaoV2/` para o seu projeto.\n> As diferenças estão no fim desta página.\n\n## Para que serve\n\n![Sensor Pro1616 visto de baixo](../imagens/sensor_linha.jpg)\n\n*A face que fica virada para o chão: a fileira de sensores IR (faixa preta comprida); um pouco\natrás dela, os três sensores de cor TCS34725, cada um entre dois LEDs brancos SMD; abaixo de cada\nTCS, um LED branco de 5 mm de alto brilho (as lentes redondas), que reforça a iluminação e é o que\npermite ler a reflexão alta de superfícies refletivas como a fita prata; no canto de cima, o botão\nde reset da placa. Vista de baixo, a esquerda e a direita do robô aparecem trocadas.*\n\nÉ o \"olho no chão\" do robô da Rescue Line (e o leitor de piso da Maze). Uma placa com:\n\n* **12 sensores infravermelhos ITR8307** em fila, agrupados em **4 canais** de 3. Cada canal diz\n  o quanto aquele trecho do chão reflete: **0 = preto, ~100 = branco calibrado**. A fita prata\n  lê **menos** que o branco no IR (~80).\n* **3 sensores de cor TCS34725** (esquerda = 1, meio = 2, direita = 3), um pouco atrás da fila de\n  IR (no robô de exemplo, 9 mm), que dão R, G, B e C (claridade). Calibrados no branco e mandados\n  pela **metade**: **branco ≈ 127**, o que sobra até 255 é para o prata (~200, graças aos LEDs\n  de 5 mm).\n\n```\n              ← esquerda do robô                     direita →\n IR:   [canal 0: 3 ITR] [canal 1: 3 ITR] [canal 2: 3 ITR] [canal 3: 3 ITR]\n TCS:        [TCS 1]           [TCS 2 (meio)]          [TCS 3]\n```\n\nPara que cada parte serve:\n\n| Parte | Use para |\n|---|---|\n| 4 canais IR | **seguir a linha** (rápido, ~50 leituras/s), achar interseção, gap |\n| 3 TCS | **cores**: marcadores verdes, fita vermelha da chegada, prata, azul/preto da Maze |\n\n## Como funciona\n\nAo criar o objeto, uma **thread** pede os 16 bytes ao sensor sem parar (115200 baud). Os métodos\nde leitura só devolvem os últimos valores recebidos: são instantâneos, pode chamar à vontade.\n\n| Bytes | Conteúdo |\n|---|---|\n| 0–3 | reflexão IR dos 4 canais |\n| 4–7 | TCS1: R, G, B, C |\n| 8–11 | TCS2 (meio): R, G, B, C |\n| 12–15 | TCS3: R, G, B, C |\n\n## Criando o objeto\n\n### `CorReflexao(porta_serial, arquivo_cores=None, limiar=6.0, usar_ir=False)`\n```python\nsensor = CorReflexao(Portas.SERIAL6, arquivo_cores='cores_line.json')\nsensor.usa_cores(['branco', 'preto', 'verde', 'vermelho', 'prata'])\nwhile not sensor.conectado:      # espera a primeira leitura (logo após criar, tudo é 0)\n    time.sleep(0.01)\n```\n\n* `arquivo_cores`: JSON com as cores aprendidas no campo (se existir, carrega).\n* `limiar`: quão longe (em \"desvios\") uma leitura pode estar da cor para ser aceita.\n* `usar_ir`: usar também o IR do lado de cada TCS na decisão da cor. **Desligado por padrão**\n  (ver \"Cuidados importantes\").\n\n## Leitura crua\n\n### `le_reflexao()` → `[ir0, ir1, ir2, ir3]`\nOs 4 canais IR. **O método do seguidor de linha.**\n\n### `reflexao(sensor)` → um canal (0 a 3)\n\n### `le_rgbc(sensor)` → `[R, G, B, C]` · `le_rgb(sensor)` → `[R, G, B]`\nDo TCS 1, 2 ou 3. Branco ≈ (127, 127, 127, 127), preto perto de 0.\n\n### `le_hsv(sensor)` → `[H, S, V]`\nMatiz 0–360, saturação 0–100, valor 0–100 (branco ≈ 50). Bom para regras simples (\"verde é H\nentre 90 e 170 com S > 30\").\n\n### `le_hsv120(sensor, valor_maximo=255)` → `[H, S, V]` na escala 0–120 (como o Paint antigo)\n\n### `rgb_para_hsv(r, g, b)` · `rgb_para_hsv120(r, g, b, valor_maximo)` *(estáticos)*\nConversões avulsas.\n\n### `valores` *(propriedade)* → os 16 bytes · `conectado` *(propriedade)*\n`conectado` é `True` se o sensor respondeu nos últimos 2 s.\n\n## Classificação de cor por referências\n\nCada cor é uma **referência**: média e desvio de quatro características da leitura —\ncromaticidade `r/(r+g+b)`, `g/…`, `b/…` (a cor em si, não depende do brilho) e brilho `C/127`\n(e uma quinta, IR `/100`, só com `usar_ir=True`). A leitura vai para a cor mais próxima; se nenhuma\nestiver perto (`limiar`), dá `'desconhecida'`. Com pouca luz (preto) a cromaticidade não conta,\nporque vira ruído: aí só o brilho decide.\n\n### `cor(sensor=2)` → nome da cor no TCS 1, 2 ou 3\n`'branco'`, `'preto'`, `'verde'`, `'vermelho'`, `'azul'`, `'amarelo'`, `'prata'` ou\n`'desconhecida'`.\n\n### `cores()` → `[cor TCS1, cor TCS2, cor TCS3]`\n**O método para os marcadores verdes**: verde no TCS 1 = verde à esquerda, no 3 = à direita.\n\n### `cor_piso()` → votação dos 3 TCS (sem maioria, vale o do meio)\n**O método da Maze** (cor do ladrilho embaixo do robô).\n\n### `detecta_cor(sensor)` → a cor como constante `COR_*`\n`COR_NADA` (-1, sensor sem resposta), `COR_PRETO` 0, `COR_BRANCO` 1, `COR_VERMELHO` 2,\n`COR_VERDE` 3, `COR_AZUL` 4, `COR_AMARELO` 5, `COR_DESCONHECIDA` 6, `COR_PRATA` 7.\n`nome_cor(sensor)` é o mesmo que `cor(sensor)`. `NOMES_CORES` e `CODIGO_COR` convertem.\n\n### `detectar_cor(r, g, b, c, ir=None)` → constante `COR_*` de um RGBC avulso\n\n### `distancias(sensor=2)` → `[(distância, nome), ...]` ordenado\n**Para depurar**: mostra o quão perto a leitura está de cada cor. Se a cor certa aparece em\nsegundo lugar com distância parecida, aprenda as cores de novo.\n\n## Ensinando as cores (calibração no campo)\n\nAs referências que vêm na lib (`REFERENCIAS_PADRAO`) são só um começo. Luz do local, altura do\nsensor e o material das fitas mudam tudo. No tempo de calibração da competição:\n\n### `usa_cores(nomes)`\nDeixa só as cores que existem na prova. **Sempre use**: menos cores = menos confusão.\nLine: `['branco', 'preto', 'verde', 'vermelho', 'prata']`. Maze: `['branco', 'preto', 'prata',\n'azul', 'vermelho']`.\n\n### `aprende_cor(nome, amostras=25, intervalo=0.03, sensores=(1, 2, 3))`\nRobô **parado** com os TCS sobre a cor: lê várias vezes e grava média e desvio. Leva ~1 s.\n\n* Use `sensores=(2,)` se só o do meio está sobre a cor (fita estreita).\n\n### `esquece_cor(nome)` · `salva_cores(arquivo)` · `carrega_cores(arquivo)`\nGrava/lê as referências em JSON. `carrega_cores` devolve `False` se o arquivo não existe.\n\nPrograma pronto para isso: `calibra_cores.py` do exemplo (simulador da Maze e da Line).\n\n## Calibração do firmware (o \"zero\" e o \"cem\")\n\n### `calibra_branco(timeout_ms=10000)`\nSensor sobre o **branco**: o firmware ajusta os LEDs IR e o branco dos TCS (~7 s). `True` se\nconfirmou. Depois disso branco = ~100 no IR e ~127 no TCS.\n\n### `calibra_preto(timeout_ms=5000)`\nSensor sobre o **preto** (~2 s).\n\n* **Quando:** sensor novo, mudou a altura do sensor, ou leituras do branco muito longe de 100.\n  Fica gravado no sensor. Depois de calibrar o firmware, ensine as cores de novo.\n\n### `atualiza()` · `fechar()`\n`atualiza` faz uma leitura (a thread já faz). `fechar` para a thread e fecha a serial.\n\n## Cuidados importantes\n\n* **Logo depois de criar, tudo é zero** (a primeira leitura ainda não chegou): espere\n  `sensor.conectado`. Senão o robô \"vê preto\" no começo.\n* **Por que o IR vem desligado na classificação.** A fileira de IR fica ~9 mm **à frente** dos\n  TCS. Numa curva ou na borda da linha, o IR já está no branco enquanto o TCS ainda está no preto.\n  Com pouca luz, a lib ignora a cromaticidade e sobram brilho e IR; a combinação \"escuro no TCS,\n  claro no IR\" não bate com o preto (IR errado) nem com o branco (brilho errado), e caía no\n  meio-termo: **\"vermelho\" ou \"verde\"**. No simulador isso fez o seguidor \"chegar\" no meio da\n  pista. Com `usar_ir=False` (o padrão desde 17/10/2026), o escuro vai para o preto. Se ligar o IR\n  para testar, saiba que esse erro volta.\n* **Confirme decisões importantes.** Uma leitura isolada pode pegar a borda de uma fita. Para\n  chegada e interseção, confirme em 2–3 leituras seguidas e/ou pelo RGB:\n\n```python\ndef eh_verde(tcs):\n    r, g, b, c = sensor.le_rgbc(tcs)\n    return sensor.cor(tcs) == 'verde' and g > 1.4 * r and g > 1.15 * b and c > 20\n\ndef eh_vermelho(tcs):\n    r, g, b, c
